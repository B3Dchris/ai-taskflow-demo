# Render Blueprint for JitsFlow (static site).
# The site in web/ is prebuilt: run `python3 build.py` locally and commit web/ before pushing changes.
services:
  - type: web
    name: jitsflow
    runtime: static
    buildCommand: echo "JitsFlow is prebuilt in web/"
    staticPublishPath: ./web
    pullRequestPreviewsEnabled: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # After you buy the domain, uncomment these two lines and push.
    # Render then shows the DNS records to add at your registrar.
    # domains:
    #   - jitsflow.com
