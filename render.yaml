# Render Blueprint for JitsFlow: a Node web service in Frankfurt on the Starter plan.
# server.js serves the prebuilt app in web/. Run `python3 build.py` locally and commit web/ before pushing changes.
services:
  - type: web
    name: jitsflow-app
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: echo "JitsFlow is prebuilt in web/"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    # After you buy the domain, uncomment these two lines and push.
    # Render then shows the DNS records to add at your registrar.
    # domains:
    #   - jitsflow.com
