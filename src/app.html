<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Saira+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: single-column phone app with a bottom tab bar. Motif: belt + tape stripes; four stripes = mastery levels. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#EAEEF4; --ink:#0D1424; --ink-2:#4F5A6E; --line:#D9DFE8;
  --blue:#2350C2; --blue-soft:#E4EBFA; --on-blue:#FFFFFF; --chart:#2350C2;
  --belt:#FAFAF7; --belt-edge:#C9CED6; --belt-bar:#151515; --tape:#F4F4F0; --tape-off:#3A3A3A;
  --good:#1B7345; --good-soft:#DDF1E6; --warn:#955700; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE1DE;
  --tap:#B3261E; --tap-soft:#FBE3E0; --primary:#101B36; --on-primary:#FFFFFF;
  --navy:#0B1530; --navy-2:#15244D; --navy-glow:rgba(91,140,255,.22); --on-navy:#EEF2FA; --on-navy-2:#AEBAD0;
  --edge:rgba(13,20,36,.07); --glass:rgba(255,255,255,.80);
  --sh-1:0 1px 2px rgba(13,20,36,.05),0 2px 10px rgba(13,20,36,.04);
  --sh-2:0 1px 2px rgba(13,20,36,.04),0 10px 30px rgba(13,20,36,.09);
  --sh-3:0 -10px 40px rgba(13,20,36,.14);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:24px;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,1.2,.32,1);
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080C14; --surface:#111826; --surface-2:#1A2233; --ink:#E9EDF5; --ink-2:#9DA9BE; --line:#28324A;
  --blue:#8AAAFF; --blue-soft:#18264A; --on-blue:#0A1020; --chart:#7097F5;
  --belt:#ECECE6; --belt-edge:#8E949D; --belt-bar:#0A0A0A; --tape:#F4F4F0; --tape-off:#333;
  --good:#52C78E; --good-soft:#15301F; --warn:#E6A84C; --warn-soft:#33260F; --bad:#F2786D; --bad-soft:#3A1916;
  --tap:#FF8A80; --tap-soft:#3A1916; --primary:#E9EDF5; --on-primary:#0B1220;
  --navy:#0E1A38; --navy-2:#172752; --navy-glow:rgba(91,140,255,.20); --on-navy:#EEF2FA; --on-navy-2:#AEBAD0;
  --edge:rgba(255,255,255,.07); --glass:rgba(14,20,32,.80);
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 12px 32px rgba(0,0,0,.45); --sh-3:0 -10px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080C14; --surface:#111826; --surface-2:#1A2233; --ink:#E9EDF5; --ink-2:#9DA9BE; --line:#28324A;
  --blue:#8AAAFF; --blue-soft:#18264A; --on-blue:#0A1020; --chart:#7097F5;
  --belt:#ECECE6; --belt-edge:#8E949D; --belt-bar:#0A0A0A; --tape:#F4F4F0; --tape-off:#333;
  --good:#52C78E; --good-soft:#15301F; --warn:#E6A84C; --warn-soft:#33260F; --bad:#F2786D; --bad-soft:#3A1916;
  --tap:#FF8A80; --tap-soft:#3A1916; --primary:#E9EDF5; --on-primary:#0B1220;
  --navy:#0E1A38; --navy-2:#172752; --navy-glow:rgba(91,140,255,.20); --on-navy:#EEF2FA; --on-navy-2:#AEBAD0;
  --edge:rgba(255,255,255,.07); --glass:rgba(14,20,32,.80);
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 12px 32px rgba(0,0,0,.45); --sh-3:0 -10px 40px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{padding-block:10px calc(160px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h2.label{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
h3{font-size:22px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input[type=checkbox]{flex:none;width:22px;height:22px;margin:0;accent-color:var(--blue)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.between{justify-content:space-between}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:12px;border-radius:2px;background:#151515;outline:1px solid var(--belt-edge);position:relative}
.brand .mark::after{content:"";position:absolute;right:4px;top:0;bottom:0;width:10px;background:#B3261E}
.sync{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.sync[data-s="db"]{color:var(--good);border-color:currentColor}
.sync[data-s="err"]{color:var(--warn);border-color:currentColor}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.subpanel{border-top:1px solid var(--line);padding-top:14px}
.panel.accent{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}
.panel.warnp{border-color:var(--warn)}

/* belt */
.beltwrap{display:flex;flex-direction:column;gap:12px;border-radius:20px;padding:18px 16px;color:#EEF2FA;border:1px solid rgba(255,255,255,.06);
  background:#0D1730}
.beltwrap .muted{color:#A9B5CC}.beltwrap .bignum{color:#FFFFFF}
.beltwrap .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}.beltwrap .stat b{color:#FFFFFF}.beltwrap .stat span{color:#A9B5CC}
.beltwrap .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#F4F6FB}
.beltwrap .area .track{background:rgba(255,255,255,.12)}.beltwrap .area .fill{background:linear-gradient(90deg,#5B8CFF,#A9C3FF)}.beltwrap .area.low .fill{background:#E6A84C}.beltwrap .area .mono{color:#A9B5CC}
.beltwrap .small b,.beltwrap p b{color:#FFFFFF}
.beltwrap svg.belt{filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
.posimg{margin:0;border-radius:14px;overflow:hidden;background:#0E1626}.posimg img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.posimg.sm{max-width:260px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.beltbanner{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:12px}
svg.belt{width:100%;height:auto;display:block;max-width:100%}
.belt .b{fill:var(--belt);stroke:var(--belt-edge);stroke-width:1}
.belt .b.blue{fill:#1F4FB0}.belt .b.purple{fill:#5E2D8C}.belt .b.brown{fill:#6A4326}
.belt .bar{fill:var(--belt-bar)}
.belt .on{fill:var(--tape)}
.belt .off{fill:var(--tape-off)}
.belt .knot{fill:var(--belt);stroke:var(--belt-edge)}
.bignum{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:44px}
a.btn{color:var(--ink);text-decoration:none}
.btn.yt{justify-content:flex-start;text-align:left}
.ytplay{display:inline-grid;place-items:center;width:26px;height:18px;border-radius:5px;background:#E1251B;color:#fff;font-size:10px;flex:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.full{width:100%}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-align:left}
.linkbtn.small{min-height:44px;display:inline-flex;align-items:center;padding-inline:4px}.linkbtn.tap{padding:6px 2px}

/* technique rows */
.list{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px}
.list .trow:first-child{border-top:0}
.trow .nm{font-weight:600;display:block}
.nm,.whochip,.attrow b,.bookcard b{overflow-wrap:anywhere;min-width:0}
.ferr{color:var(--bad);font-weight:600;margin:0}
.addlist{max-height:44vh;overflow-y:auto;overscroll-behavior:contain}
.addlist .trow{padding:10px 2px}
.trow .meta{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.stripes{display:inline-flex;gap:3px;padding:3px;background:var(--belt-bar);border-radius:2px}
.stripes i{width:5px;height:16px;background:var(--tape-off);display:block}
.stripes i.on{background:var(--tape)}
.cat{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.cat[data-c="sub"]{background:var(--bad-soft);color:var(--bad)}
.cat[data-c="escape"],.cat[data-c="defense"]{background:var(--good-soft);color:var(--good)}
.cat[data-c="sweep"],.cat[data-c="back"]{background:var(--blue-soft);color:var(--blue)}
.cat[data-c="pass"],.cat[data-c="takedown"]{background:var(--warn-soft);color:var(--warn)}
.pri{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.pri[data-p="core"]{color:var(--blue)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.chip .x{font-weight:700;opacity:.7}
.forwho{margin:-6px 0 12px}.forwho .chip{min-height:44px;max-width:100%}.forwho .chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex}
nav.tabs .wrap button{flex:1 1 0;min-width:0}
nav.tabs .wrap[data-n="5"] button{font-size:11px;letter-spacing:.02em;padding-inline:0}
nav.tabs button{white-space:nowrap}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--blue)}

/* sheet */
.sheet{background:var(--bg)}
.sheet .wrap{padding-block:8px calc(190px + env(safe-area-inset-bottom,0px))}
.sheettitle{display:flex;align-items:center;gap:8px;min-height:40px;margin-bottom:8px}
.sheetbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheetbar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.sheetbar .main{display:flex;gap:10px;align-items:stretch}
.righty .sheetbar .main{flex-direction:row-reverse}
.sheetbar .grow{flex:1}
.sheetbar .btn{min-height:52px;font-size:17px}
.sheetbar .back{min-width:110px}
.fab{position:fixed;z-index:25;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));border-radius:50%;width:60px;height:60px;padding:0;display:grid;place-items:center;font-size:30px;line-height:1;background:var(--blue);color:var(--on-blue);border:0;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.righty .fab{left:auto;right:max(16px,env(safe-area-inset-right,0px))}
details.grp{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.grp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:14px;min-height:56px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .chev{transition:transform .15s;color:var(--ink-2)}
details.grp[open]>summary .chev{transform:rotate(90deg)}
details.grp .body{padding:0 14px 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.posfig{margin:0;display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:12px;padding:8px}
.posfig svg{width:100%;height:auto;display:block;max-width:100%}
.posfig.sm{padding:4px;border-radius:8px;max-width:260px}
.thumb{width:64px;height:44px;border-radius:8px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .posfig{padding:2px;border-radius:0;background:none;width:100%}
.thumb svg{max-height:40px}
.thumb .play{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;border-radius:3px;padding:1px 4px}
.btag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;color:#fff}
.btag.purple{background:#5E2D8C}.btag.brown{background:#6A4326}.btag.black{background:#111;outline:1px solid var(--line)}
.tree{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tree.root{padding-left:0;border-left:0;display:flex;flex-direction:column;gap:14px}
.tree li{position:relative;padding:6px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.tree.root>li{padding-left:0}
.tree:not(.root)>li::before{content:"";position:absolute;left:-14px;top:19px;width:22px;border-top:2px solid var(--line)}
.tif{font-size:13px;font-weight:600;color:var(--warn)}
.tree.root>li>.tif{color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.tnode{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.tnode .tm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tdef{font-size:14px;background:var(--good-soft);border-radius:8px;padding:8px 10px}
.tdef span:first-child{font-weight:700;color:var(--good)}
.term{all:unset;cursor:pointer;color:inherit;text-decoration:underline dotted var(--blue) 2px;text-underline-offset:3px;-webkit-tap-highlight-color:transparent}
.term:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.termcard{position:fixed;left:0;right:0;z-index:55;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet-open .termcard{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.termcard .in{max-width:696px;margin:0 auto;background:var(--surface);border:1px solid var(--blue);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto}
.termcard h3{font-size:22px}
.ai{display:flex;flex-direction:column;gap:8px}
.ai h4{font-family:var(--f-display);font-size:18px;margin:6px 0 0}
.ai ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ai p{margin:0}
.aiq{font-weight:700;font-size:14px;color:var(--ink-2)}
.aiitem{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.coachbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;background:var(--warn-soft)}
.coachbox b{color:var(--warn)}.coachbox.ok{border-color:var(--good);background:var(--good-soft)}.coachbox.ok b{color:var(--good)}
.btag.ok{background:var(--good)}
.ytbox{display:flex;flex-direction:column;gap:8px}
.ytface{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:12px;overflow:hidden;background:#000;cursor:pointer}
.ytface img{width:100%;height:100%;object-fit:cover;display:block}
.ytbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px;border-radius:12px;background:#E1251B;color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ytcap{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:15px;line-height:1.35}
.btn.ytpick{padding:10px 12px}
.ytembed{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.ytembed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.week{display:flex;flex-direction:column}
.wd{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;min-height:52px}
.week .wd:first-child{border-top:0}
.wd .dn{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1}
.wd .dn small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--ink-2)}
.wd.today{background:var(--blue-soft);border-radius:10px}
.wd.cls .dn{color:var(--blue)}

/* Original compact, no-horizontal-scroll map, with paths drawn above every node. */
.jf-classic-map{width:100%;max-width:100%;overflow:hidden}
.jf-classic-map .flowsvg{width:100%;max-width:100%;height:auto;display:block}
.jf-classic-map .flowsvg .edges{pointer-events:none}

.jf-classic-map .flowsvg .edge{stroke-linecap:round;stroke-linejoin:round;opacity:1;filter:drop-shadow(0 0 1px var(--surface))}
.jf-classic-map .flowsvg .node.sel rect{filter:none}

/* flow */
.flowsvg{width:100%;height:auto;display:block;max-width:100%}
.flowsvg .node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.flowsvg .node text{font-family:var(--f-body);font-size:12px;font-weight:600;fill:var(--ink)}
.flowsvg .node.t0 rect{stroke:var(--good)} .flowsvg .node.t1 rect{stroke:var(--blue)}
.flowsvg .node.t4 rect{stroke:var(--warn)} .flowsvg .node.t5 rect{stroke:var(--bad)}
.flowsvg .node.sel rect{fill:var(--blue);stroke:var(--blue)}
.flowsvg .node.sel text{fill:var(--on-blue)}
.flowsvg .node{cursor:pointer}
.flowsvg .tier{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink-2);font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.flowsvg .kbar-bg{fill:var(--line)!important;stroke:none!important}.flowsvg .kbar{fill:var(--good)!important;stroke:none!important}
.flowsvg .node.sel .kbar-bg{fill:rgba(255,255,255,.3)!important}.flowsvg .node.sel .kbar{fill:var(--on-blue)!important}
.flowkey{display:flex;flex-wrap:wrap;gap:6px 14px}.flowkey span{display:inline-flex;align-items:center;gap:6px}
.flowkey i{display:inline-block}.k-bar{width:22px;height:4px;border-radius:2px;background:var(--good)}
.lk{width:22px;height:3px;border-radius:2px;position:relative}.lk::after{content:"";position:absolute;right:-3px;top:-3px;border-left:6px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.lk.up{background:var(--good);color:var(--good)}.lk.side{background:var(--blue);color:var(--blue)}.lk.down{background:var(--warn);color:var(--warn)}.lk.fin{background:var(--bad);color:var(--bad)}
/* map: arrows and what they point at */
.flowsvg .edge{fill:none;stroke-linecap:round;opacity:.9;animation:edgein .45s ease both;animation-delay:calc(var(--i) * 45ms)}
@keyframes edgein{from{opacity:0}to{opacity:.9}}
.flowsvg .edge.up,.fsk .fl.up{stroke:var(--good)}.flowsvg .edge.side,.fsk .fl.side{stroke:var(--blue)}.flowsvg .edge.down,.fsk .fl.down{stroke:var(--warn)}.flowsvg .edge.fin,.fsk .fl.fin{stroke:var(--bad)}.fsk .fl.stay{stroke:var(--ink-2)}
.ah.up path{fill:var(--good)}.ah.side path{fill:var(--blue)}.ah.down path{fill:var(--warn)}.ah.fin path{fill:var(--bad)}.ah.stay path{fill:var(--ink-2)}

.flowsvg .node.fin rect{fill:var(--surface);stroke:var(--bad);stroke-dasharray:4 3}.flowsvg .node.fin text{fill:var(--bad);font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}

/* "From here": lines run down the gutter into each destination */
.fsk{position:relative;display:flex;flex-direction:column;gap:10px}

/* ============ DESIGN SYSTEM v2 ============
   One visual language: deep-navy hero surfaces (the "dk" scope re-maps the colour tokens so anything inside adapts),
   light elevated cards for lists, one quiet secondary button and one primary, soft layered shadows instead of outlines,
   8-pt spacing, tabular numbers for stats. Motion is short and springy, and switched off under reduced motion. */
body{font-feature-settings:"kern"}
.mono,.stat b,.bignum,.cr-time,.cr-cap b,.refrow b{font-variant-numeric:tabular-nums}
h1{letter-spacing:-.01em}
h2.label{font-size:14px;letter-spacing:.08em}
.app{padding-top:8px}
.stack-lg{gap:var(--s4)}

/* dark navy scope */
.dk{color:var(--on-navy);--ink:#EEF2FA;--ink-2:#AEBAD0;--surface:#18264E;--surface-2:#1E2E5C;--line:rgba(255,255,255,.16);--bg:#0B1530;
  --blue:#93B2FF;--blue-soft:rgba(147,178,255,.16);--on-blue:#0B1530;--chart:#93B2FF;--good:#5BD49A;--good-soft:rgba(91,212,154,.16);--warn:#F2B661;--warn-soft:rgba(242,182,97,.16);
  --bad:#FF8F85;--bad-soft:rgba(255,143,133,.16);--tap:#FF8F85;--tap-soft:rgba(255,143,133,.16);--primary:#FFFFFF;--on-primary:#0B1530;--edge:rgba(255,255,255,.08)}
.dk .muted,.dk .small.muted{color:var(--ink-2)}
.hero{position:relative;border-radius:var(--r-xl);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3);min-width:0;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 90% at 100% 0%,var(--navy-glow),transparent 62%),linear-gradient(170deg,var(--navy-2),var(--navy) 58%);box-shadow:var(--sh-2);border:1px solid rgba(255,255,255,.05)}
.hero h1{font-size:34px;line-height:1.02;font-weight:700;color:#fff}
.pagehero h1{font-size:30px}.pagehero .hero-t p{font-size:14px}.pagehero .hero-t{gap:4px}.pagehero .hact{display:flex;gap:10px;margin-top:4px}
/* Focus moved to a heading or panel for screen readers isn't a keyboard focus: no ring (keyboard focus keeps its ring) */
[tabindex="-1"]:focus{outline:none}
.learnhero h1{font-size:30px}.learnhero .hero-t p{font-size:14px}.learnhero .hero-t{gap:4px}
.eyebrow{display:block;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.hero-t{display:flex;flex-direction:column;gap:6px}
.hero-t p{color:var(--ink-2);font-size:15px}
.beltwrap{background:radial-gradient(120% 90% at 100% 0%,var(--navy-glow),transparent 62%),linear-gradient(170deg,var(--navy-2),var(--navy) 58%);box-shadow:var(--sh-2);border-radius:var(--r-xl)}

/* cards: elevation instead of outlines */
.panel,details.grp,details.more,.classcard,.bookcard,.compcard,.calrows,.insight,.revealcard,.howbtn,.impban,.qsugg,.edrow,.ttday{border-color:var(--edge);box-shadow:var(--sh-1)}
.panel{border-radius:var(--r-lg);padding:var(--s3)}
details.grp,details.more,.classcard,.bookcard,.compcard,.calrows,.revealcard,.howbtn{border-radius:var(--r-lg)}
.panel.accent{border-color:var(--edge);box-shadow:var(--sh-1),inset 3px 0 0 var(--blue)}
.panel.warnp{border-color:var(--edge);box-shadow:var(--sh-1),inset 3px 0 0 var(--warn)}
.bookcard.mine{box-shadow:var(--sh-1),inset 3px 0 0 var(--good)}
.dk.panel,.dk .panel{box-shadow:none}
details.more>summary,details.grp>summary{border-radius:inherit}
details.more>summary{list-style:none;justify-content:space-between;gap:12px;min-height:44px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s var(--ease)}
details.more[open]>summary::after{transform:rotate(225deg) translate(-2px,-2px)}
.empty{border-radius:var(--r-md)}

/* buttons: one primary, a quiet secondary, a ghost */
.btn{border-radius:12px;background:var(--surface-2);border-color:var(--edge);color:var(--ink);transition:transform .12s var(--ease),background-color .15s,box-shadow .15s}
a.btn{color:var(--ink)}
.panel .btn:not(.primary):not(.danger):not(.wa),.sheet .btn:not(.primary):not(.danger):not(.wa){background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 1px 2px rgba(13,20,36,.12),0 4px 14px rgba(13,20,36,.12)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.yt{background:var(--surface);border-color:var(--edge);box-shadow:var(--sh-1)}
.dk .btn{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.12);color:#F4F6FB}
.dk .btn.primary{background:#fff;border-color:#fff;color:#0B1530}
.linkbtn{color:var(--blue)}
.btn:active,.chip:active,.trow:active,.tnode:active,.seg button:active,.seg3 button:active,.branch .bmove:active,.bgo:active,.howbtn:active,.classcard:active,.calrow:active,.wd:active{transform:scale(.98)}
.trow,.tnode,.seg button,.seg3 button,.chip,.calrow,.wd,.classcard{transition:transform .12s var(--ease),background-color .15s}
:focus-visible{outline-color:var(--blue)}

/* chips and segments: selected = ink, not a heavy blue block */
.chip{border-color:var(--line);background:var(--surface);min-height:44px;padding:6px 14px;font-weight:600}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"],.seg2 button[aria-pressed="true"],.seg3 button[aria-pressed="true"],.seg4 button[aria-pressed="true"],.seg5 button[aria-pressed="true"],.seg6 button[aria-pressed="true"],.seg7 button[aria-pressed="true"],.segrow button[aria-pressed="true"],.segpills button[aria-pressed="true"],.tchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.seg button,.seg2 button,.seg3 button,.seg4 button,.seg5 button,.seg6 button,.seg7 button,.segrow button,.tchip,.segpills button{border-color:var(--line)}
.beltchips button[aria-pressed="true"],.levels button[aria-pressed="true"],.qrlevels button[aria-pressed="true"]{border-color:var(--primary);background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--primary)}
/* segmented control on a navy hero: a track with a raised thumb */
.dk .learnseg,.seg3.track{background:rgba(255,255,255,.08);border-radius:14px;padding:4px;gap:4px}
.dk .learnseg button{min-height:44px;border:0;background:transparent;color:var(--ink-2);border-radius:10px;font-weight:700;transition:background-color .2s var(--ease),color .2s}
.dk .learnseg button[aria-pressed="true"]{background:#fff;color:#0B1530;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.wday.sel,.mcell.sel{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.wday.sel small,.wday.sel i{color:var(--on-primary)}

/* tips */
.tip{background:var(--surface);box-shadow:var(--sh-1);border:1px solid var(--edge);border-radius:var(--r-md);padding:8px 6px 8px 14px;color:var(--ink-2)}
.tip::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.tip .tipx{width:44px;height:44px}

/* header */
.top{padding-block:4px 12px}
.avatar{background:var(--primary);color:var(--on-primary)}

/* bottom tab bar: frosted, with a soft active pill */
nav.tabs{background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);border-top:1px solid var(--edge)}
nav.tabs button{position:relative;text-transform:none;letter-spacing:.01em;font-size:12px;font-weight:600;padding:8px 2px 10px;gap:3px}
nav.tabs .wrap[data-n="5"] button{font-size:11.5px;letter-spacing:0}
nav.tabs button svg{position:relative;z-index:1;width:22px;height:22px;padding:0;stroke-width:1.9}
nav.tabs button::before{content:"";position:absolute;top:5px;left:50%;width:54px;height:30px;margin-left:-27px;border-radius:15px;background:var(--blue-soft);transform:scale(.4);opacity:0;transition:transform .28s var(--spring),opacity .2s}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--blue)}
nav.tabs button[aria-current="page"]::before{transform:scale(1);opacity:1}
nav.tabs button svg{margin-top:4px}

/* sheets: slide up with a little spring; the action bar is frosted */
.sheetbar{background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);border-top:1px solid var(--edge)}
.sheet.in>.wrap{animation:sheetin .42s var(--spring) both}
.sheetbar.in{animation:barin .32s var(--ease) both}
@keyframes sheetin{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes barin{from{transform:translateY(100%)}to{transform:none}}
/* screens: a short fade-and-rise when you change tab (the View Transitions API handles the chain explorer) */
#app.enter{animation:viewin .32s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* technique sheet header */
.shead{border-radius:var(--r-xl);padding:0;gap:0}
.shead .shead-t{padding:var(--s3);display:flex;flex-direction:column;gap:10px}
.shead h1{color:#fff;font-size:36px}
.shead .sheettitle{margin:0;min-height:0;color:var(--ink-2)}
.shead .fromto{gap:6px}
.shead .posbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#EEF2FA;min-height:44px;border-radius:10px}
.shead>.ytm,.shead>.ytbox,.shead>.posfig,.shead>.posimg,.shead>.photo,.shead>.vid,.shead>.photoempty{border-radius:0;margin:0}
.shead>.posfig{background:rgba(255,255,255,.04);padding:12px 16px 4px}
.shead>.posfig svg{max-height:200px}
.shead>.ytbox .ytcap{padding:10px 16px 0}
.posfig{background:var(--surface-2)}

/* video: poster first, a soft placeholder while it loads, never a black box */
.ytm{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden;color:#fff;text-decoration:none;background:var(--navy);isolation:isolate}
.ytbox.ytm{aspect-ratio:auto;background:none;color:inherit;overflow:visible}
.ytposter{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(80% 70% at 30% 20%,rgba(147,178,255,.28),transparent 60%),linear-gradient(160deg,#1B2B57,#0B1530)}
.ytposter::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.6s linear infinite}
.ytposter>.posfig,.ytposter>.posimg,.ytposter>.photo{position:absolute;inset:0;margin:0;padding:12% 14%;background:none;border-radius:0;display:grid;place-items:center}
.ytposter>.posfig svg{max-height:100%;opacity:.55}
.ytposter figcaption{display:none}
.thumb img.ytthumb{position:absolute;inset:0}
.chain button{min-height:44px;border-color:var(--line)}
.tdef .linkbtn,.routesteps .linkbtn{min-height:44px;display:inline-flex;align-items:center}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,.sheettitle[tabindex="-1"]:focus{outline:none}
.ytposter>.posimg img,.ytposter>.photo img{width:100%;height:100%;object-fit:cover;aspect-ratio:auto;border-radius:0;opacity:.7}
.ytposter>.photo,.ytposter>.posimg{padding:0}
.ytposter .ytthumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ytposter .ytshade{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(5,10,24,0) 45%,rgba(5,10,24,.78))}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.ytm .ytbig,.ytface .ytbig{z-index:3;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.94);color:#0B1530;font-size:22px;padding-left:4px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .2s var(--spring)}
.ytm:hover .ytbig,.ytm:active .ytbig,.ytface:active .ytbig{transform:translate(-50%,-50%) scale(1.06)}
.ytmeta{position:absolute;z-index:3;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:2px;text-align:left;font-size:14px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.ytmeta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ytmeta small{font-size:12px;color:#D5DCEA}
.ytout{position:absolute;z-index:3;top:10px;right:10px;font-size:12px;font-weight:700;background:rgba(5,10,24,.6);border-radius:999px;padding:4px 10px}
.ytnote{position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700;font-size:14px;background:rgba(5,10,24,.7);border-radius:999px;padding:8px 14px;white-space:nowrap}
.ytembed{background:none;border-radius:var(--r-md)}
.ytembed iframe{z-index:2}
.ytface{border-radius:var(--r-md)}
.ytcap .ytplay{display:none}
.ytcap{font-size:14px;color:var(--ink-2)}.ytcap b{color:var(--ink)}

/* ============ CHAIN EXPLORER ============ */
.mapnav{display:flex;flex-direction:column;gap:10px;margin-inline:-6px}
.mapnav .flowsvg .node rect{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.18)}
.mapnav .flowsvg .node.t0 rect{stroke:var(--good)}.mapnav .flowsvg .node.t1 rect{stroke:var(--blue)}.mapnav .flowsvg .node.t4 rect{stroke:var(--warn)}.mapnav .flowsvg .node.t5 rect{stroke:var(--bad)}
.mapnav .flowsvg .node.sel rect{fill:#fff;stroke:#fff;filter:drop-shadow(0 0 10px rgba(147,178,255,.65))}
.mapnav .flowsvg .node.sel text{fill:#0B1530}
.mapnav .flowsvg .node.sel .kbar-bg{fill:rgba(11,21,48,.18)!important}.mapnav .flowsvg .node.sel .kbar{fill:#1B7345!important}
.mapnav .flowsvg .node.dest.up rect:first-of-type{fill:rgba(91,212,154,.16)}.mapnav .flowsvg .node.dest.side rect:first-of-type{fill:rgba(147,178,255,.18)}.mapnav .flowsvg .node.dest.down rect:first-of-type{fill:rgba(242,182,97,.16)}
.mapnav .flowsvg .node.fin rect{fill:transparent}.mapnav .flowsvg .node.fin.dest rect{fill:rgba(255,143,133,.18)}
.mapnav .flowsvg .tier{stroke:var(--navy)}
.mapnav .flowsvg .edge-halo{stroke:#0E1B3C}
.mapnav .flowkey{padding-inline:6px;font-size:12.5px}
.mapnav .flowkey,.mapnav .flowkey span{color:var(--ink-2)}
.beltfilter{display:flex;align-items:center;gap:8px;padding-inline:6px}
.beltfilter>span{font-size:13px;color:var(--ink-2);white-space:nowrap}
.beltfilter .chips{flex-wrap:nowrap;gap:6px;min-width:0;flex:1}
.beltfilter .chip{flex:1 1 0;min-width:0;justify-content:center;padding:6px 4px;min-height:44px;font-size:13px;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:var(--ink)}
.beltfilter .chip i{width:14px;height:6px;border-radius:2px;flex:none;outline:1px solid rgba(255,255,255,.3)}
.beltfilter .chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:#0B1530}

.chainstage{display:flex;flex-direction:column;gap:12px;view-transition-name:chainstage;scroll-margin-top:12px}
.poshero{display:flex;flex-direction:column;gap:12px;border-radius:var(--r-xl);padding:var(--s3)}
.poshero h2{font-family:var(--f-display);font-size:30px;line-height:1.05;color:#fff}
.poshero .pgo{font-size:16px;line-height:1.4;color:var(--ink)}
.poshero .ptop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.poshero .ptop .eyebrow b{color:#fff;font-weight:700}
.poshero .ymedia>.posfig{background:rgba(255,255,255,.05);border-radius:var(--r-md);padding:10px}
.poshero .ymedia>.posfig svg{max-height:170px}
.poshero .pfig{flex:none;width:96px}.poshero .pfig>*{margin:0;padding:4px;border-radius:12px;background:rgba(255,255,255,.07)}.poshero .pfig svg{max-height:64px}.poshero .pfig img{border-radius:10px;aspect-ratio:4/3}
.poshero .flip{align-self:flex-start;min-height:44px;font-size:14px}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;flex:1;min-width:0}
.crumbs li{display:flex;align-items:center;gap:2px;min-width:0}
.crumbs li+li::before{content:"›";color:var(--ink-2);font-size:16px;padding:0 4px}
.crumbs ol button{border:0;background:rgba(255,255,255,.08);color:var(--ink);border-radius:999px;padding:0 14px;min-height:44px;font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs ol button[aria-current="step"]{background:#fff;color:#0B1530}
.crumbs .fin button,.crumbs .fin button[aria-current="step"]{background:var(--tap);color:#0B1530}
.crumbs .reset{border:0;background:none;color:var(--ink-2);font-weight:700;font-size:13px;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.crumbhead{display:flex;justify-content:space-between;align-items:center;flex-basis:100%;margin-bottom:-6px}
.branchhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-inline:2px}
.branchhead h3{font-size:22px}
.branchhead .small{white-space:nowrap}
.branches{display:grid;gap:12px}
.branch{--bc:var(--blue);position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.branch.d-up{--bc:var(--good)}.branch.d-fin{--bc:var(--tap)}.branch.d-down{--bc:var(--warn)}.branch.d-stay{--bc:var(--ink-2)}
.branch::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--bc)}
.bcue{padding:14px 16px 0 18px;font-size:15px;line-height:1.35;color:var(--ink-2)}
.bcue b{display:block;font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bc);margin-bottom:2px}
.bmove{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 16px 12px 18px;color:var(--ink);font:inherit;width:100%;min-height:76px;transition:transform .12s var(--ease)}
.bmove .thumb{width:96px;height:60px;border-radius:10px}
.bmove .thumb svg{max-height:56px}
.bmove .thumb .play{right:auto;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#0B1530;font-size:11px;padding:0 0 0 2px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.bmove .bname{font-weight:700;font-size:18px;line-height:1.2;display:block;overflow-wrap:anywhere}
.bmove .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.bgo{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;border:0;border-top:1px solid var(--edge);background:color-mix(in srgb,var(--bc) 7%,var(--surface));color:var(--ink);font:inherit;padding:8px 16px 8px 18px;text-align:left;transition:background-color .15s}
.bgo span{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.bgo small{font-size:12px;color:var(--ink-2);font-weight:600}
.bgo b{font-size:16px;overflow-wrap:anywhere}
.bgo i{font-style:normal;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bc);color:var(--bg);font-weight:800;font-size:18px;transition:transform .2s var(--spring)}
.bgo:hover i,.bgo:active i{transform:translateX(3px)}
.bgo.tapgo b{color:var(--tap)}
.finish{display:flex;flex-direction:column;gap:6px;border-radius:var(--r-lg);padding:14px 16px;background:var(--tap-soft);border:1px solid color-mix(in srgb,var(--tap) 30%,transparent)}
.finish b{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--tap)}
.chainmore{display:flex;gap:8px;flex-wrap:wrap}
.fold>summary{font-size:16px}
.fold>summary small{display:block;font-weight:400;color:var(--ink-2);font-size:13px}
.fold>.foldbody{padding-top:14px;display:flex;flex-direction:column;gap:var(--s4)}
.chainstage.in-fwd{animation:slidefwd .38s var(--ease) both}.chainstage.in-back{animation:slideback .38s var(--ease) both}.chainstage.in-fade{animation:viewin .3s var(--ease) both}
@keyframes slidefwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideback{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
::view-transition-old(chainstage){animation:.3s var(--ease) both vt-out}
::view-transition-new(chainstage){animation:.38s var(--ease) both vt-in}
html[data-dir="back"]::view-transition-old(chainstage){animation-name:vt-out-back}
html[data-dir="back"]::view-transition-new(chainstage){animation-name:vt-in-back}
@keyframes vt-out{to{opacity:0;transform:translateX(-36px)}}@keyframes vt-in{from{opacity:0;transform:translateX(36px)}}
@keyframes vt-out-back{to{opacity:0;transform:translateX(36px)}}@keyframes vt-in-back{from{opacity:0;transform:translateX(-36px)}}

/* Home hero */
.homehero{align-items:stretch;flex-wrap:nowrap}
.homehero .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.homehero .bignum{font-size:56px;color:#fff;letter-spacing:-.02em}
.homehero .hrow{justify-content:flex-start;align-items:baseline;gap:10px}
.homehero .hready{font-size:17px;color:var(--ink-2)}.homehero .hready b{color:#fff;font-weight:700}
.homehero svg.belt{filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
.homehero .hbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.homehero .hbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#5B8CFF,#A9C3FF)}
.homehero .hact{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px}
.homehero .hact .btn{min-height:50px}
.logbtn b{font-size:20px;line-height:1;font-weight:600}

/* Moves: search + one Filter control */

const GLOSS_K=Object.fromEntries(GLOSS.map(g=>[g.k,g]));
const GLOSS_RE=new RegExp("\\b("+GLOSS.map((g,i)=>`(?<g${i}>${g.re})`).join("|")+")\\b","gi");
/* escape text, then make the first use of each term in this block tappable */
function gl(text){const seen=new Set();return esc(text).replace(GLOSS_RE,(...a)=>{const groups=a[a.length-1];let k=null;for(const n in groups)if(groups[n]!==undefined){k=GLOSS[Number(n.slice(1))].k;break}
  if(!k||seen.has(k))return a[0];seen.add(k);return `<button type="button" class="term" data-a="term" data-v="${esc(k)}">${a[0]}</button>`})}

function saveProgress(){

/* With an account, a session is saved on the phone first and then sent. Without signal it waits in "rtb.pending" and goes
   when the phone is back online or the app opens (flushLogs). Returns true when it reached the account, "later" when it's waiting. */
const pendingLogs=()=>new Set(lsGet("rtb.pending")||[]);
function setPending(id,on){const p=pendingLogs();if(on)p.add(id);else p.delete(id);lsSet("rtb.pending",[...p])}
async function addSession(s){
  if(S.mode==="api"){const was=S.sessions;S.sessions=[s,...S.sessions.filter(x=>x.id!==s.id)];lsSet("rtb.sessions",S.sessions);setPending(s.id,true);
    try{await api("PUT","/logs/"+encodeURIComponent(s.id),{data:s});setPending(s.id,false);return true}
    catch(e){if(e.offline||e.status>=500){setSync("Offline: saved on this device","err");return "later"}
      S.sessions=was;lsSet("rtb.sessions",was);setPending(s.id,false);toast("Couldn't save the session: "+e.message);return false}}
  if(S.mode==="db"){
    try{await sessCol.doc(s.id).set(s)}catch(e){
      if(e&&e.code==="quota_exceeded")toast("Your log is full. Delete old sessions to add new ones.");
      else toast("Couldn't save the session. Try again.");return false}
  }else{S.sessions=[s,...S.sessions.filter(x=>x.id!==s.id)];lsSet("rtb.sessions",S.sessions)}
  return true;
}
async function deleteSession(id){
  if(S.mode==="api"){try{await api("DELETE","/logs/"+encodeURIComponent(id))}catch(e){toast("Couldn't delete: "+e.message);return}setPending(id,false);S.sessions=S.sessions.filter(x=>x.id!==id);lsSet("rtb.sessions",S.sessions);render();return}
  if(S.mode==="db"){try{await sessCol.doc(id).delete()}catch(e){toast("Couldn't delete. Try again.")}}
  else{S.sessions=S.sessions.filter(x=>x.id!==id);lsSet("rtb.sessions",S.sessions);render()}
}
const SAVED_LATER="Saved on this phone. It will sync when you're back online.";
function setSync(t,st){S.sync=t;S.syncState=st;const el=document.getElementById("sync");if(el){el.textContent=t;el.dataset.s=st}}

async function connect(){
  const timer=setTimeout(()=>{if(S.mode!=="db"){setSync("Saved on this device","local");maybeOnboard()}},10000);
  try{
    if(!window.claude||!window.claude.use){clearTimeout(timer);setSync("Saved on this device","local");acctInit().finally(()=>{if(!API.me)maybeOnboard();else maybeOnboardAfterSync()});return}
    window.claude.use("assets").then(a=>{if(a){ASSETS=a;render()}}).catch(()=>{});
    window.claude.use("sample").then(sm=>{if(sm){SAMPLE=sm;if(S.ui.sheet&&S.ui.sheet.k==="tech"){const y=window.scrollY;techSheet(S.ui.sheet.id,true);window.scrollTo(0,y)}}}).catch(()=>{});
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){clearTimeout(timer);setSync("Saved on this device","local");maybeOnboard();return}
    const uid=await user.id();
    if(!uid){clearTimeout(timer);setSync("Saved on this device","local");maybeOnboard();return}
    DB=db;
    progRef=db.doc("data/users/"+uid+"/progress");
    sessCol=db.doc("data/users/"+uid+"/profile").collection("sessions");
    explainCol=db.doc("data/users/"+uid+"/profile").collection("explain");
    let firstP=true;
    progRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||pTimer||pWriting)return;
      if(!snap.metadata.fromCache)clearTimeout(timer);
      S.mode="db";setSync("Saved to your account","db");
      if(snap.exists){S.progress=normalize(snap.data());lsSet("rtb.progress",S.progress)}
      else if(firstP&&!snap.metadata.fromCache){flushProgress()}
      firstP=false;render();if(!snap.metadata.fromCache)setTimeout(maybeOnboard,400);
    },err=>{clearTimeout(timer);S.mode="local";setSync("Saved on this device","err");maybeOnboard()});
    let firstS=true;
    sessCol.orderBy("date","desc").limit(500).onSnapshot(snap=>{
      const remote=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(firstS&&!snap.metadata.fromCache){
        firstS=false;
        const local=lsGet("rtb.sessions")||[];
        const have=new Set(remote.map(x=>x.id));
        local.filter(x=>x&&x.id&&!have.has(x.id)).slice(0,100).forEach(x=>sessCol.doc(x.id).set(x).catch(()=>{}));
      }
      S.sessions=remote;lsSet("rtb.sessions",remote);render();
    },err=>{});
  }catch(e){clearTimeout(timer);setSync("Saved on this device","local")}
}

const lv=id=>P().mastery[id]||0;
function setLevel(id,l){P().mastery[id]=l;if(l>=1)ensureCard(id);saveProgress()}
function ensureCard(id){if(!P().srs[id])P().srs[id]={due:today(),ivl:0,ease:2.3}}
/* Spaced review: how many days until a move comes back, from how well you remembered it (0 forgot … 3 easy). */
function nextIvl(c,r){c=c||{ivl:0,ease:2.3};
  if(r===0)return 1;
  if(r===1)return Math.max(1,Math.round((c.ivl||1)*1.2));
  if(r===2)return c.ivl?Math.max(2,Math.round(c.ivl*c.ease)):2;
  return c.ivl?Math.max(4,Math.round(c.ivl*c.ease*1.3)):4}
function rateCard(id,r){
  const c=P().srs[id]||{ivl:0,ease:2.3};const ivl=nextIvl(c,r);
  if(r===0)c.ease=Math.max(1.3,c.ease-.2);else if(r===1)c.ease=Math.max(1.3,c.ease-.15);else if(r===3)c.ease=Math.min(3,c.ease+.15);
  c.ivl=ivl;c.due=addDays(today(),ivl);P().srs[id]=c;saveProgress();
}
const whenBack=d=>d<=1?"tomorrow":d<14?`in ${d} days`:d<60?`in ${Math.round(d/7)} weeks`:`in ${Math.round(d/30)} months`;
function dueList(){const t=today();return Object.entries(P().srs).filter(([id,c])=>TM[id]&&c.due<=t).sort((a,b)=>a[1].due<b[1].due?-1:1).map(([id])=>id).slice(0,12)}
function readiness(belt){belt=belt||goal();let s=0,w=0;TECH.forEach(t=>{if(t.p==="plus"||beltOf(t)!==belt)return;const k=t.p==="core"?2:1;w+=k;s+=k*lv(t.id)/4});return w?Math.round(100*s/w):0}
function blocksFor(belt){if(belt==="blue")return BLOCKS;const out=[];AREAS.forEach(a=>{const ts=TECH.filter(t=>beltOf(t)===belt&&a.f(t)).sort((x,y)=>(x.p==="core"?0:x.p==="key"?1:2)-(y.p==="core"?0:y.p==="key"?1:2));for(let i=0;i<ts.length;i+=5){const part=ts.slice(i,i+5);out.push({n:a.n+(ts.length>5?` (${i/5+1})`:""),why:`${BELT[belt].to}-belt ${a.n.toLowerCase()}.`,ids:part.map(t=>t.id)})}});return out.length?out:BLOCKS}
const curBlocks=()=>blocksFor(goal());
function blockIndex(){const st=P().settings.cycleStart||today();const d=Math.max(0,daysBetween(st,today()));const n=curBlocks().length;return {i:Math.floor(d/14)%n,left:14-(d%14),n}}
function recent(days){const from=addDays(today(),-days);return S.sessions.filter(s=>s.date>=from)}
function hoursLogged(){return S.sessions.reduce((a,s)=>a+(Number(s.mins)||0),0)/60}
function stuckCounts(days){const c={};recent(days).forEach(s=>(s.stuck||[]).forEach(p=>{if(POS[p])c[p]=(c[p]||0)+1}));return Object.entries(c).sort((a,b)=>b[1]-a[1])}
const byPos=(a,b)=>RANK[beltOf(a)]-RANK[beltOf(b)]||(a.p==="core"?0:1)-(b.p==="core"?0:1)||ORDER.indexOf(a.f)-ORDER.indexOf(b.f);
const rateable=()=>TECH.filter(t=>t.p!=="plus"&&RANK[beltOf(t)]<=RANK[goal()]);
function rateQueue(){const m=P().mastery;return rateable().filter(t=>!(t.id in m)).sort(byPos).map(t=>t.id)}
function fromPos(p,max,primary){return TECH.filter(t=>(t.f===p||!primary&&t.also&&t.also.includes(p))&&(!max||RANK[beltOf(t)]<=max))}
function intoPos(p,max){return TECH.filter(t=>t.t===p&&t.f!==p&&(!max||RANK[beltOf(t)]<=max))}

function chainTree(nodes,mode,depth){
  const flip=w=>w.replace(/\b(they|their|them|you|your)\b/gi,(m,_,i,str)=>{const lw=m.toLowerCase();let r={they:"you",their:"your",them:"you",your:"their"}[lw];
    if(lw==="you"){const before=str.slice(0,i).trim().toLowerCase();r=(!before||/(^|[:,.]|\band|\bso|\bif|\bwhen|\bbefore|\bas)$/.test(before))?"they":"them"}
    return m[0]===m[0].toUpperCase()?r[0].toUpperCase()+r.slice(1):r});
  const lab=(w,d)=>{if(mode==="def")w=w.replace(/^Start:/,"Their start:").replace(/^(Their start:)(.*)$/,(m,a,rest)=>a+flip(rest)),w=/^Their start:/.test(w)?w:flip(w);
    return d===0?(/start:/i.test(w)?w:"When "+w[0].toLowerCase()+w.slice(1)):"If "+w[0].toLowerCase()+w.slice(1)};
  return `<ul class="tree${depth?"":" root"}">${nodes.filter(n=>TM[n.t]).map(n=>{const t=TM[n.t],b=beltOf(t);
    let def="";if(mode==="def"){const d=defTech(t);def=d?`<div class="tdef"><span>Your defense:</span> <button class="linkbtn" data-a="open" data-v="${d.id}">${esc(d.n)}</button></div>`:CT[t.id]?`<div class="tdef"><span>Your defense:</span> ${gl(CT[t.id])}</div>`:""}
    return `<li><div class="tif">${gl(lab(n.w,depth))}</div><button class="tnode" data-a="open" data-v="${t.id}"><span class="tn">${mode==="def"?"They go for ":""}<b>${esc(t.n)}</b></span><span class="tm">${cat(t.c)}${b!=="blue"?`<span class="btag ${b}">${BELT[b].to}</span>`:""}${mode==="att"?stripes(lv(t.id)):""}</span></button>${def}${n.k.length?chainTree(n.k,mode,depth+1):""}</li>`}).join("")}</ul>`;
}
const DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function defaultDays(pw){return ({1:[2],2:[1,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]})[Math.min(7,Math.max(1,Number(pw)||2))]}
function weekPlan(){const st=P().settings,days=(st.days&&st.days.length?st.days:defaultDays(st.perWeek)),mon=weekKey(today()),blk=curBlocks()[blockIndex().i];
  const cand=blk.ids.map(id=>TM[id]).filter(t=>t&&lv(t.id)<4).sort((a,b)=>lv(a.id)-lv(b.id));const pool=cand.length?cand:blk.ids.map(id=>TM[id]).filter(Boolean);let k=0;
  return DN.map((n,i)=>{const date=addDays(mon,i),cls=days.includes(i),logged=S.sessions.some(s=>s.date===date);const next=days.includes((i+1)%7);
    if(cls){const t=pool[k++%pool.length];return {n,date,cls,logged,t,txt:`Class: work on <b>${esc(t.n)}</b>`}}
    if(next){const t=pool[k%pool.length];return {n,date,cls,logged,t,txt:`Review cards, then read the steps of ${esc(t.n)} (5 min)`}}
    return {n,date,cls,logged,txt:"Solo drills, 10 minutes"}})}
function weekKey(d){const x=parseD(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return ds(x)}
function weekStreak(){const wk=new Set(S.sessions.map(s=>s.date&&weekKey(s.date)).filter(Boolean));let k=weekKey(today());if(!wk.has(k))k=addDays(k,-7);let n=0;while(wk.has(k)){n++;k=addDays(k,-7)}return n}
const AREAS=[{n:"Escapes & defense",f:isDef},{n:"Guard & sweeps",f:t=>["guard","sweep","entry"].includes(t.c)},{n:"Passing",f:t=>t.c==="pass"},{n:"Pins & control",f:t=>t.c==="control"},{n:"Back takes",f:t=>t.c==="back"},{n:"Submissions",f:t=>t.c==="sub"},{n:"Takedowns",f:t=>t.c==="takedown"}];
function areaScores(g=goal()){return AREAS.map(a=>{const ts=TECH.filter(t=>t.p!=="plus"&&beltOf(t)===g&&a.f(t));const v=ts.reduce((x,t)=>x+lv(t.id),0)/(ts.length*4||1);return {n:a.n,pct:Math.round(100*v),count:ts.length}}).filter(a=>a.count)}
function avgSessionHrs(){const ms=S.sessions.map(s=>Number(s.mins)||0).filter(Boolean);return ms.length?ms.reduce((a,b)=>a+b,0)/ms.length/60:(P().settings.sessionMins||90)/60}
function monthsTo(perWeek){const st=P().settings;const rem=Math.max(0,(st.targetHours||300)-((st.priorHours||0)+hoursLogged()));return rem/(perWeek*avgSessionHrs())/4.345}

/* #toast is a polite live region that's always there: hiding it only fades it out. The same message again is cleared first, so a screen reader reads it again.
   A toast with Undo stays 10s, and waits while a finger or the keyboard is on it. */
function toast(msg,act){const t=document.getElementById("toast"),put=()=>{t.textContent=msg;if(act)t.insertAdjacentHTML("beforeend",` <button class="toastbtn" data-a="toastact">${esc(act.label)}</button>`)};
  clearTimeout(toast._s);toast._act=act?act.fn:null;toast._ms=act?10000:2800;
  if(t.classList.contains("on")&&toast._msg===msg){t.textContent="";toast._s=setTimeout(put,60)}else put();toast._msg=msg;t.classList.add("on");toastWait()}
function toastWait(){clearTimeout(toast._t);toast._t=setTimeout(toastHide,toast._ms)}
function toastHide(){const t=document.getElementById("toast");clearTimeout(toast._t);t.classList.remove("on");t.textContent="";toast._act=null;toast._msg=null}
{const t=document.getElementById("toast");t.addEventListener("pointerenter",()=>clearTimeout(toast._t));t.addEventListener("focusin",()=>clearTimeout(toast._t));
  t.addEventListener("pointerleave",()=>{if(t.classList.contains("on"))toastWait()});t.addEventListener("focusout",()=>{if(t.classList.contains("on"))toastWait()})}

/* ============ SMART SEARCH ============
   Forgiving search over moves, positions and terms: typos ("kimra"), word order ("guard half"), squashed words ("armbar"),

const ALIAS={dbl:"double",sgl:"single",rnc:"rear naked choke",mataleao:"rear naked choke",armbar:"arm bar armbar",juji:"arm bar",keylock:"americana",heelhook:"heel hook",kneebar:"knee bar",toehold:"toe hold",slx:"single leg x",ashi:"ashi garami leg entanglement",legs:"leg entanglement",fifty:"50 50",darce:"d arce darce",brabo:"d arce darce",kob:"knee on belly",sc:"side control",hg:"half guard",cg:"closed guard",bfly:"butterfly",td:"takedown",guillo:"guillotine",omo:"omoplata",tri:"triangle",ns:"north south",scarf:"kesa scarf",bodylock:"body lock",shrimp:"hip escape shrimp",upa:"trap roll upa bridge",sprawl:"sprawl",snap:"snap down snapdown",dl:"double leg",sl:"single leg",ezekiel:"ezekiel",anaconda:"anaconda",choke:"choke",lock:"lock",tap:"submission",sub:"submission",subs:"submission",escape:"escape",pass:"pass",sweep:"sweep",back:"back",mount:"mount",turtle:"turtle",guard:"guard",wrestling:"takedown wrestle"};

  for(let i=1;i<=a.length;i++){let lo=max+1;for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);lo=Math.min(lo,d[i][j])}if(lo>max)return max+1}return d[a.length][b.length]}
let SIDX=null;
function searchIndex(){if(SIDX)return SIDX;const e=[];
  TECH.forEach(t=>e.push({k:"t",id:t.id,label:t.n,sub:`${CATS[t.c]} · from ${POS[t.f].l.toLowerCase()}`,name:norm(t.n),text:norm(`${t.n} ${CATS[t.c]} ${POS[t.f].L} ${POS[t.f].l} ${(t.also||[]).map(a=>POS[a].L+" "+POS[a].l).join(" ")} ${t.t==="sub"?"submission":POS[t.t]?POS[t.t].L:""}`)}));
  Object.entries(POS).forEach(([k,p])=>e.push({k:"p",id:k,label:p.L,sub:"Position",name:norm(p.L),text:norm(p.L+" "+p.l)}));
  GLOSS.forEach(g=>e.push({k:"g",id:g.k,label:g.k,sub:"Term",name:norm(g.k),text:norm(g.k)}));
  e.forEach(x=>{x.words=x.text.split(" ");x.compact=x.text.replace(/ /g,"");x.ncompact=x.name.replace(/ /g,"");x.initials=x.name.split(" ").map(w=>w[0]).join("")});

function scoreEntry(x,toks,qn){const qc=qn.replace(/ /g,"");let s=0,all=true;
  if(x.name===qn)s+=100;else if(x.name.startsWith(qn))s+=60;else if(qc.length>=3&&x.ncompact.includes(qc))s+=x.ncompact.startsWith(qc)?60:40;
  if(qc.length>=2&&qc.length<=5&&x.initials.startsWith(qc)&&x.initials.length<=qc.length+1)s+=45;
  const nameW=x.nwords||(x.nwords=x.name.split(" "));
  const hitIn=(words,c)=>{let b=0;for(const w of words){if(w===c)b=Math.max(b,10);else if(c.length>=2&&w.startsWith(c))b=Math.max(b,7);
    else if(c.length>=4){const tol=c.length>=7?2:1;if(lev(w,c,tol)<=tol||(w.length>c.length&&lev(w.slice(0,c.length),c,tol)<=tol))b=Math.max(b,4)}
    else if(c.length===3&&w[0]===c[0]&&w.length<=4&&lev(w,c,1)<=1)b=Math.max(b,3)}return b};
  for(const w0 of toks){const alt=ALIAS[w0]?norm(ALIAS[w0]).split(" "):[];let best=0,inName=false;
    for(const c of [w0,...alt]){if(!c)continue;const n=hitIn(nameW,c);if(n){inName=true;best=Math.max(best,n)}else best=Math.max(best,hitIn(x.words,c))}

    if(!best){all=false;continue}

function searchAll(q,lim){const qn=norm(q);if(!qn)return [];const toks=qn.split(" ").filter(Boolean);
  const run=(t,n)=>searchIndex().map(x=>({x,s:scoreEntry(x,t,n)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s||a.x.label.length-b.x.label.length).slice(0,lim||8).map(r=>r.x);

/* moves a query finds: direct matches, plus everything from a position it names */
function searchTechIds(q){const r=searchAll(q,400);const ids=new Set(r.filter(x=>x.k==="t").map(x=>x.id));r.filter(x=>x.k==="p").forEach(p=>fromPos(p.id).forEach(t=>ids.add(t.id)));return ids}

function fromHereHTML(t){const mx=flowMax(),nx=(t.nx||[]).filter(n=>TM[n]);

function posKnown(p,max){const ts=fromPos(p,max);if(!ts.length)return null;return ts.reduce((x,t)=>x+Math.min(4,lv(t.id)),0)/(ts.length*4)}
/* Where a move goes, compared with where it starts: up the ladder, same level, down, a finish, or staying put. */
function flowDir(sel,d){if(d==="sub")return "fin";if(d===sel)return "stay";const a=POS[sel].r,b=POS[d].r;return b<a?"up":b>a?"down":"side"}

function flowGroups(sel,mx){const g={};fromPos(sel,mx).forEach(t=>{(g[t.t]=g[t.t]||[]).push(t)});const flat=ROWS.flat();

function flowSVG(sel){

  ROWS.forEach((r,ri)=>{const tw=r.length*NW+(r.length-1)*G;const x0=(W-tw)/2;r.forEach((p,i)=>{pos[p]={x:x0+i*(NW+G),y:top+(ri+1)*RH}})});

  if(fresh&&!inClaude())try{history.pushState({sheet:1},"")}catch(e){} // a step for the phone's Back button to close it
  sh.innerHTML=`<div class="wrap">${html}</div>`;app.hidden=true;sh.hidden=false;document.querySelector("nav.tabs").hidden=true;
  bar=bar||{};const backL=bar.back||((S.ui.stack||[]).length>1?"‹ Back":"Close");
  sb.innerHTML=`<div class="wrap">${bar.top||""}<div class="main"><button class="btn back" data-a="back">${backL}</button>${bar.act||'<span class="grow"></span>'}</div></div>`;sb.hidden=false;document.documentElement.classList.add("sheet-open");
  if(fresh&&!reduceMotion()){sh.classList.remove("in");sb.classList.remove("in");void sh.offsetWidth;sh.classList.add("in");sb.classList.add("in")}
  const t=sh.querySelector("h1")||sh.querySelector(".sheettitle");if(t){t.id="sheet-t";t.tabIndex=-1} // focusable, also when a redraw puts focus back on it
  sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-owns","sheetbar toast");if(t)sh.setAttribute("aria-labelledby","sheet-t");else sh.removeAttribute("aria-labelledby");

// The phone's Back button closes the open sheet, else goes back to the previous tab. A step left by a sheet that was closed in the app

window.addEventListener("popstate",()=>{if(inClaude())return;const sh=document.getElementById("sheet");

  const h=location.hash.slice(1),r=h?route(h):{tab:"home"};if(!r)return;

  if(isMap()&&h==="learn-map"&&Array.isArray(S.ui.trail)&&S.ui.trail.length>1){const st=history.state||{};if(!st.sheet){const want=Math.max(1,st.chain||1);if(want<S.ui.trail.length){chainJump(want-1);return}}}
  if((h||"home")===tabHash()){history.back();return}

let AICTL=null,TERMCTL=null;
function md(t){const out=[];let list=false;const inl=x=>gl(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  String(t).split(/\n/).forEach(line=>{const l=line.trim();let m;
    if((m=l.match(/^#{1,4}\s+(.*)$/))){if(list){out.push("</ul>");list=false}out.push(`<h4>${inl(m[1].replace(/\*\*/g,""))}</h4>`)}
    else if((m=l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/))){if(!list){out.push("<ul>");list=true}out.push(`<li>${inl(m[1])}</li>`)}
    else if(!l){if(list){out.push("</ul>");list=false}}
    else{if(list){out.push("</ul>");list=false}out.push(`<p>${inl(l)}</p>`)}});
  if(list)out.push("</ul>");return out.join("")}
const aiErr=c=>({not_granted:"Asking Claude isn't allowed for this page. You can turn it on in the page's permissions.",sampling_disabled:"Asking Claude isn't available on this account.",rate_limited:"You've asked a lot in a short time. Try again in a few minutes.",refused:"Claude couldn't answer that. Try asking it differently.",session_expired:"Sign in to Claude again, then try once more.",empty_completion:"No answer came back. Try asking it differently."})[c]||"Couldn't get an answer. Check your connection and try again.";

${t.s.map((x,i)=>`${i+1}. ${x}`).join("\n")}
