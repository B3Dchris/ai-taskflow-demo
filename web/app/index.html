<style>
/* Layout: single-column phone app with a bottom tab bar. Motif: belt + tape stripes; four stripes = mastery levels. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E3E8EF; --ink:#111722; --ink-2:#4E5869; --line:#D3DAE4;
  --blue:#1D4FB5; --blue-soft:#DCE5F8; --on-blue:#FFFFFF; --chart:#1D4FB5;
  --belt:#FAFAF7; --belt-edge:#C9CED6; --belt-bar:#151515; --tape:#F4F4F0; --tape-off:#3A3A3A;
  --good:#1D7748; --good-soft:#DDF1E6; --warn:#995A00; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE1DE;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F14; --surface:#151A22; --surface-2:#1F2631; --ink:#E8EBF1; --ink-2:#9AA5B8; --line:#2A323F;
  --blue:#82A5FF; --blue-soft:#1B2949; --on-blue:#0C1220; --chart:#6B90F0;
  --belt:#ECECE6; --belt-edge:#8E949D; --belt-bar:#0A0A0A; --tape:#F4F4F0; --tape-off:#333;
  --good:#52C78E; --good-soft:#15301F; --warn:#E6A84C; --warn-soft:#33260F; --bad:#F2786D; --bad-soft:#3A1916;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F14; --surface:#151A22; --surface-2:#1F2631; --ink:#E8EBF1; --ink-2:#9AA5B8; --line:#2A323F;
  --blue:#82A5FF; --blue-soft:#1B2949; --on-blue:#0C1220; --chart:#6B90F0;
  --belt:#ECECE6; --belt-edge:#8E949D; --belt-bar:#0A0A0A; --tape:#F4F4F0; --tape-off:#333;
  --good:#52C78E; --good-soft:#15301F; --warn:#E6A84C; --warn-soft:#33260F; --bad:#F2786D; --bad-soft:#3A1916;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{padding-block:10px calc(160px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h2.label{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
h3{font-size:22px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:12px;border-radius:2px;background:#151515;outline:1px solid var(--belt-edge);position:relative}
.brand .mark::after{content:"";position:absolute;right:4px;top:0;bottom:0;width:10px;background:#B3261E}
.sync{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.sync[data-s="db"]{color:var(--good);border-color:currentColor}
.sync[data-s="err"]{color:var(--warn);border-color:currentColor}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.subpanel{border-top:1px solid var(--line);padding-top:14px}
.panel.accent{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}
.panel.warnp{border-color:var(--warn)}

/* belt */
.beltwrap{display:flex;flex-direction:column;gap:12px;border-radius:20px;padding:18px 16px;color:#EEF2FA;border:1px solid rgba(255,255,255,.06);
  background:#0D1730}
.beltwrap .muted{color:#A9B5CC}.beltwrap .bignum{color:#FFFFFF}
.beltwrap .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}.beltwrap .stat b{color:#FFFFFF}.beltwrap .stat span{color:#A9B5CC}
.beltwrap .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#F4F6FB}
.beltwrap .area .track{background:rgba(255,255,255,.12)}.beltwrap .area .fill{background:linear-gradient(90deg,#5B8CFF,#A9C3FF)}.beltwrap .area.low .fill{background:#E6A84C}.beltwrap .area .mono{color:#A9B5CC}
.beltwrap .small b,.beltwrap p b{color:#FFFFFF}
.beltwrap svg.belt{filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
.posimg{margin:0;border-radius:14px;overflow:hidden;background:#0E1626}.posimg img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.posimg.sm{max-width:260px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.beltbanner{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:12px}
svg.belt{width:100%;height:auto;display:block;max-width:100%}
.belt .b{fill:var(--belt);stroke:var(--belt-edge);stroke-width:1}
.belt .b.blue{fill:#1F4FB0}.belt .b.purple{fill:#5E2D8C}.belt .b.brown{fill:#6A4326}
.belt .bar{fill:var(--belt-bar)}
.belt .on{fill:var(--tape)}
.belt .off{fill:var(--tape-off)}
.belt .knot{fill:var(--belt);stroke:var(--belt-edge)}
.bignum{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:44px}
a.btn{color:var(--ink);text-decoration:none}
.btn.yt{justify-content:flex-start;text-align:left}
.ytplay{display:inline-grid;place-items:center;width:26px;height:18px;border-radius:5px;background:#E1251B;color:#fff;font-size:10px;flex:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.full{width:100%}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-align:left}
.linkbtn.small{min-height:44px;display:inline-flex;align-items:center;padding-inline:4px}

/* technique rows */
.list{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px}
.list .trow:first-child{border-top:0}
.trow .nm{font-weight:600;display:block}
.ferr{color:var(--bad);font-weight:600;margin:0}
.addlist{max-height:44vh;overflow-y:auto;overscroll-behavior:contain}
.addlist .trow{padding:10px 2px}
.trow .meta{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.stripes{display:inline-flex;gap:3px;padding:3px;background:var(--belt-bar);border-radius:2px}
.stripes i{width:5px;height:16px;background:var(--tape-off);display:block}
.stripes i.on{background:var(--tape)}
.cat{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.cat[data-c="sub"]{background:var(--bad-soft);color:var(--bad)}
.cat[data-c="escape"],.cat[data-c="defense"]{background:var(--good-soft);color:var(--good)}
.cat[data-c="sweep"],.cat[data-c="back"]{background:var(--blue-soft);color:var(--blue)}
.cat[data-c="pass"],.cat[data-c="takedown"]{background:var(--warn-soft);color:var(--warn)}
.pri{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.pri[data-p="core"]{color:var(--blue)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.chip .x{font-weight:700;opacity:.7}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex}
nav.tabs .wrap button{flex:1 1 0;min-width:0}
nav.tabs .wrap[data-n="5"] button{font-size:11px;letter-spacing:.02em;padding-inline:0}
nav.tabs button{white-space:nowrap}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--blue)}

/* sheet */
.sheet{background:var(--bg)}
.sheet .wrap{padding-block:8px calc(190px + env(safe-area-inset-bottom,0px))}
.sheettitle{display:flex;align-items:center;gap:8px;min-height:40px;margin-bottom:8px}
.sheetbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheetbar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.sheetbar .main{display:flex;gap:10px;align-items:stretch}
.righty .sheetbar .main{flex-direction:row-reverse}
.sheetbar .grow{flex:1}
.sheetbar .btn{min-height:52px;font-size:17px}
.sheetbar .back{min-width:110px}
.fab{position:fixed;z-index:25;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));border-radius:50%;width:60px;height:60px;padding:0;display:grid;place-items:center;font-size:30px;line-height:1;background:var(--blue);color:var(--on-blue);border:0;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.righty .fab{left:auto;right:max(16px,env(safe-area-inset-right,0px))}
details.grp{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.grp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:14px;min-height:56px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .chev{transition:transform .15s;color:var(--ink-2)}
details.grp[open]>summary .chev{transform:rotate(90deg)}
details.grp .body{padding:0 14px 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.posfig{margin:0;display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:12px;padding:8px}
.posfig svg{width:100%;height:auto;display:block;max-width:100%}
.posfig.sm{padding:4px;border-radius:8px;max-width:260px}
.thumb{width:64px;height:44px;border-radius:8px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .posfig{padding:2px;border-radius:0;background:none;width:100%}
.thumb svg{max-height:40px}
.thumb .play{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;border-radius:3px;padding:1px 4px}
.btag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;color:#fff}
.btag.purple{background:#5E2D8C}.btag.brown{background:#6A4326}.btag.black{background:#111;outline:1px solid var(--line)}
.tree{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tree.root{padding-left:0;border-left:0;display:flex;flex-direction:column;gap:14px}
.tree li{position:relative;padding:6px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.tree.root>li{padding-left:0}
.tree:not(.root)>li::before{content:"";position:absolute;left:-14px;top:19px;width:22px;border-top:2px solid var(--line)}
.tif{font-size:13px;font-weight:600;color:var(--warn)}
.tree.root>li>.tif{color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.tnode{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.tnode .tm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tdef{font-size:14px;background:var(--good-soft);border-radius:8px;padding:8px 10px}
.tdef span:first-child{font-weight:700;color:var(--good)}
.term{all:unset;cursor:pointer;color:inherit;text-decoration:underline dotted var(--blue) 2px;text-underline-offset:3px;-webkit-tap-highlight-color:transparent}
.term:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.termcard{position:fixed;left:0;right:0;z-index:55;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet-open .termcard{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.termcard .in{max-width:696px;margin:0 auto;background:var(--surface);border:1px solid var(--blue);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto}
.termcard h3{font-size:22px}
.ai{display:flex;flex-direction:column;gap:8px}
.ai h4{font-family:var(--f-display);font-size:18px;margin:6px 0 0}
.ai ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ai p{margin:0}
.aiq{font-weight:700;font-size:14px;color:var(--ink-2)}
.aiitem{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.coachbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;background:var(--warn-soft)}
.coachbox b{color:var(--warn)}.coachbox.ok{border-color:var(--good);background:var(--good-soft)}.coachbox.ok b{color:var(--good)}
.btag.ok{background:var(--good)}
.ytbox{display:flex;flex-direction:column;gap:8px}
.ytface{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:12px;overflow:hidden;background:#000;cursor:pointer}
.ytface img{width:100%;height:100%;object-fit:cover;display:block}
.ytbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px;border-radius:12px;background:#E1251B;color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ytcap{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:15px;line-height:1.35}
.btn.ytpick{padding:10px 12px}
.ytembed{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.ytembed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.week{display:flex;flex-direction:column}
.wd{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;min-height:52px}
.week .wd:first-child{border-top:0}
.wd .dn{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1}
.wd .dn small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--ink-2)}
.wd.today{background:var(--blue-soft);border-radius:10px}
.wd.cls .dn{color:var(--blue)}
.wd .st{font-size:13px;color:var(--good);font-weight:700}
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.seg5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.seg5 button{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;font-size:13px;padding:0 1px}.seg5 button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg2 button{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;font-size:14px}.seg2 button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}.seg6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.seg7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.seg4 button,.seg6 button,.seg7 button{min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;font-size:14px;padding:0 2px}
.seg4 button[aria-pressed="true"],.seg6 button[aria-pressed="true"],.seg7 button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

<script>
"use strict";
/* ============ CONTENT ============ */
const LEVELS=[
  {n:"Not seen",d:"Not shown to you yet."},
  {n:"Seen",d:"Shown in class. You know the idea and the steps."},
  {n:"Drilling",d:"You can do it smoothly on a cooperative partner, both sides."},
  {n:"Positional",d:"You've hit it in positional sparring against resistance."},
  {n:"Live",d:"You've hit it in live rolls on a resisting partner."}
];
const CATS={takedown:"Takedown",entry:"Entry",guard:"Guard",sweep:"Sweep",pass:"Pass",escape:"Escape",defense:"Defense",control:"Control",sub:"Submission",back:"Back take"};
const PRI={core:"Core",key:"Key",plus:"Bonus"};
const TIERS=["Winning","Advantage","Neutral · top","Neutral · bottom","Defending","Danger"];
const POS={
  back_top:{l:"Back control",L:"Back control (you're behind)",r:0,g:"The highest-value position. Seatbelt first, then hooks or a body triangle, then hunt the choke. Fight their hands before you force it."},
  mount_top:{l:"Mount",L:"Mount (top)",r:0,g:"Stay low and heavy and widen your base on every bridge. Climb to high mount when they push. Attacks: armbar, arm triangle, back take when they turn."},
  sc_top:{l:"Side control",L:"Side control (top)",r:1,g:"Crossface and far underhook, hips low, near knee blocking their hip. Kill their frames, then go to mount or attack the arms."},
  fhl_top:{l:"Front headlock",L:"Front headlock (you control the head)",r:1,g:"Their head is below yours. Hips back and heavy, control one arm, then choke (guillotine, d'arce) or circle behind."},
  turtle_top:{l:"Turtle (top)",L:"They're turtled (you're on top)",r:1,g:"Seatbelt before hooks. Stay chest-to-back so they can't sit out, roll, or stand."},
  ashi:{l:"Leg entangle",L:"Leg entanglement (you're attacking)",r:1,g:"Control the knee line, keep your own heels hidden, then finish the foot. Know your gym's rules on heel hooks."},
  standing:{l:"Standing",L:"Standing",r:2,g:"Stance and hand fighting first. Snap down, shoot, or sit to guard when you choose to, not when they make you."},
  open_top:{l:"Passing",L:"Passing their open guard (top)",r:2,g:"Control legs or hips before you move. Pass to side control and pin before they recover a frame."},
  cg_top:{l:"In closed guard",L:"In their closed guard (top)",r:2,g:"Posture first, hands on hips, elbows inside knees. Then stand or wedge to open the legs."},
  hg_top:{l:"Half guard top",L:"Half guard (top)",r:2,g:"Crossface, flatten, kill their underhook, then free your leg."},
  seated:{l:"Seated guard",L:"Seated / open guard (bottom)",r:3,g:"Sit up, frames out, feet active. Keep your guard, then sweep, go for the legs, or wrestle up."},
  bfly_bot:{l:"Butterfly",L:"Butterfly guard (bottom)",r:3,g:"Sit up, chest close, one underhook. Pull them forward off balance, then sweep or arm drag to the back."},
  cg_bot:{l:"Closed guard",L:"Closed guard (bottom)",r:3,g:"Break their posture, control an arm or the head, angle off. Attack: hip bump, kimura, triangle, armbar."},
  hg_bot:{l:"Half guard",L:"Half guard (bottom)",r:3,g:"On your side, never flat. Knee shield plus the underhook. Come up to the dogfight or recover full guard."},
  sc_bot:{l:"Side (bottom)",L:"Under side control",r:4,g:"Frame with bones, don't push with your arms. Bridge, shrimp, knee in to recover guard, or underhook up to your knees. Keep your near arm in."},
  fhl_bot:{l:"Headlocked",L:"In their front headlock",r:4,g:"Hands on the choking wrist, head up, feet back under your hips. Then re-shoot or sit to guard."},

T("stance_motion","Stance, motion & hand fighting","control","standing","standing","core",

  "Keep the underhook, drive in, and switch to a single leg or come up behind them."],
 ["Go as they transition, when their weight shifts.","Turn to your knees in one motion."],
 ["Turning away from them, which gives up the back.","A shallow underhook at their elbow."],
 "Partner in side control: 10 reps each side.",["hg_dogfight","single_leg"]),
/* MOUNT */
T("mount_control","Mount: stay & climb","control","mount_top","mount_top","core",
 ["Low mount: knees tight to their hips, chest low, hands posted wide.",
  "Grapevine their legs (hook under them) when they bridge.",
  "When they push you, climb: walk your knees up toward their armpits (high mount).",
  "Keep your weight on them, not on your knees.",
  "Answer every bridge by widening your base."],
 ["High mount stops elbow-knee escapes because they can't get their knees up.","Sit on them, don't kneel over them."],
 ["Sitting upright with your hands off the mat.","Letting them trap an arm and bridge."],
 "Mount retention: partner tries upa and elbow-knee. 3 × 1 min.",["mount_armbar","arm_tri","mount_to_back"]),
T("mount_armbar","Armbar from mount","sub","mount_top","sub","core",
 ["From high mount, push one arm across their body; hug it to your chest.",
  "Step into S-mount: one knee up beside their head, the other foot tucked under their side.",
  "Swing your leg over their face and sit back, knees squeezed and their arm tight to you.",
  "Thumb up, hips up. Slow."],
 ["Stay heavy in S-mount. Sitting back too early lets them escape.","Squeeze your knees together the whole time."],
 ["Sitting back with space between your butt and their shoulder.","Letting go of the arm when they roll."],
 "5 reps each side.",["arm_tri"]),
T("arm_tri","Arm triangle (head & arm)","sub","mount_top","sub","core",
 ["When they push you with one arm, pin that arm across their neck with your head.",
  "Wrap your arm around their neck and under that arm; grip your other biceps, other hand on your own head.",
  "Get off mount to the side opposite their trapped arm.",
  "Walk your hips out, chest down, squeeze your elbows and drive your shoulder into their neck."],
 ["You have to come off to the side to finish.","Your head and shoulder trap their arm against their own neck."],
 ["Trying to finish while still in mount.","Their arm not high enough across their neck."],
 "5 reps each side.",["mount_control"]),
T("mount_to_back","Mount to back take","back","mount_top","back_top","core",
 ["When they turn onto their side to escape, go with them.",
  "Seatbelt: one arm over their shoulder, the other under their armpit, hands gripped.",
  "Put your bottom hook in as they turn, then the top hook.",
  "Roll to your side with them and keep the connection."],
 ["When they turn away, they're giving you their back. Expect it.","Get the hooks in before they turn back."],
 ["Losing chest-to-back contact.","Crossing your ankles, which gives them a free foot lock."],
 "10 reps: partner turns, you take the back.",["back_control","rnc"]),
T("upa","Trap & roll (upa)","escape","mount_bot","cg_top","core",
 ["Trap one arm: grab their wrist and pin their elbow to your body.",
  "Trap the foot on the same side by stepping your foot over it.",
  "Bridge explosively up and over your opposite shoulder.",
  "Roll them toward the trapped side and land in their guard."],
 ["Bridge up and diagonally over your shoulder, not straight up.","Trap the arm AND the leg on the same side, or they'll post."],
 ["Bridging without trapping, so they just post.","Pushing their chest with straight arms."],
 "Solo: 20 bridges. Partner: 10 upas each side.",["cg_posture"]),
T("elbow_knee","Elbow-knee escape (shrimp)","escape","mount_bot","hg_bot","core",
 ["Frame against their hip with your hands or elbows and turn onto your side.",
  "Shrimp your hips away to create space between their knee and your hip.",
  "Slide your bottom knee under their knee, to the inside.",
  "Trap their leg with your legs (half guard).",
  "Shrimp the other way and recover full guard."],
 ["Elbow and knee together form a wedge.","Pair it with the upa: when they post to stop the upa, go elbow-knee."],
 ["Pushing their chest with straight arms (armbar).","Shrimping without first turning onto your side."],
 "Solo: 20 shrimps. Partner: 10 each side.",["hg_frames","hg_recover"]),
/* BACK */
T("back_control","Back control: seatbelt & hooks","control","back_top","back_top","core",
 ["Seatbelt: one arm over their shoulder (the choking arm), one under their armpit, hands gripped at their chest.",
  "Chest tight on their back, head beside theirs on the side of your under arm.",
  "Hooks: both heels inside their thighs. Don't cross your ankles.",
  "Or lock a body triangle: one leg across their belly, ankle under your other knee.",
  "Keep them tilted on their side; follow if they try to put their back on the mat."],
 ["Your head on the under-arm side keeps them from turning into you.","If they fall toward your over-arm side, follow and readjust or switch to mount."],
 ["Crossing your feet.","Letting space open between your chest and their back."],
 "Back retention: partner tries to escape. 3 × 1 min.",["rnc","back_to_mount"]),
T("rnc","Rear-naked choke","sub","back_top","sub","core",
 ["From the seatbelt, slide your over arm across their neck, elbow under the chin.",
  "Grab your other biceps; put that hand behind their head (or on your own shoulder).",
  "Squeeze your elbows together and expand your chest into their back.",
  "If they tuck their chin, win the hand fight first (two-on-one their defending hand) or switch to an arm attack."],
 ["The crook of your elbow goes under the chin, centered on the neck.","Blade of your hand behind the head; don't shove the head forward."],
 ["Forcing it over the jaw (that's a crank, not a choke).","Losing the hooks while you focus on the choke."],
 "5 slow reps each side; partner taps early.",["back_control"]),
T("back_to_mount","Back to mount","control","back_top","mount_top","key",
 ["When they escape toward their back, keep your top arm.",
  "Follow their hips and let your top hook become a knee on the mat.",
  "Swing over to mount as their shoulders hit the mat."],
 ["Every back escape is a chance to take mount.","Don't chase the hooks; switch positions."],
 ["Holding on to the hooks while they turn into you."],
 "10 reps.",["mount_control","mount_armbar"]),
T("back_escape","Back escape","escape","back_bot","hg_top","core",
 ["Defend the choke first: chin down, both hands on the choking (over) arm, pull it off your neck.",
  "Scoot your hips and slide your shoulders to the mat on the side of their choking arm.",
  "Pin their bottom leg and push the hook off your hip with your hand or foot.",
  "Get your back flat on the mat and turn in toward them.",
  "Come up in their half guard or guard, or on top."],
 ["Hands first, then hips. If your hands aren't defending, you get choked.","Going to the choking-arm side means they can't easily climb to mount."],
 ["Escaping toward their under-arm side.","Grabbing their hand and pulling straight down."],
 "Partner takes your back: 10 escapes.",["hg_flatten","cg_posture"]),
/* TURTLE */
T("turtle_recover","Turtle: defend & recover guard","escape","turtle_bot","seated","core",
 ["Elbows tight to your knees, chin tucked, hands guarding your neck. No hooks allowed in.",
  "Look for space to roll or sit out.",
  "Granby roll: tuck your head and roll over your shoulder, away from them.",
  "Come out facing them with your legs between you (guard)."],
 ["Turtle is a transition, not a place to rest.","If they get one hook in, keep your elbow inside to block the second."],
 ["Gaps between your elbows and knees.","Flattening onto your belly."],
 "Solo: 10 granby rolls each side.",["guard_retention","technical_standup"]),
T("turtle_backtake","Back take from turtle","back","turtle_top","back_top","core",
 ["From behind or beside their turtle, get a seatbelt: one arm over the shoulder, one under the armpit.",
  "Chest tight on their back.",
  "Put in the hook on the side of your under arm, near their hip.",
  "Roll to your side, bringing them on top of you, and put in the second hook."],
 ["Seatbelt first, then hooks.","Roll toward your under-arm side."],
 ["Putting hooks in before you have the seatbelt.","Rolling to the wrong side."],
 "10 reps.",["back_control","rnc"]),
/* FRONT HEADLOCK */
T("guillotine","Guillotine (arm-in / high elbow)","sub","fhl_top","sub","core",
 ["From the front headlock, wrap the neck with your forearm under their chin; trap one of their arms inside (arm-in) if you can.",
  "Grip your hands together (palm to palm or your wrist).",
  "Hips back, pull up into the throat with your forearm, lift your elbow.",
  "Finish standing by arching back, or sit to guard and finish there."],
 ["Arm-in is harder to defend.","Your hips power the choke."],
 ["Trying to choke from too far in front of them."],
 "5 reps each side.",["darce"]),
T("darce","D'Arce choke","sub","fhl_top","sub","key",
 ["From the front headlock, thread your arm under their near arm and under their neck, out the other side.",
  "Grip your other biceps; put that hand behind their head or on their back.",
  "Squeeze your elbows together and walk your hips out to tighten.",
  "Roll them, or drop to your side, to finish if needed."],
 ["Get your armpit deep against their shoulder.","A common counter when they shoot, or when they dig an underhook from half guard."],
 ["A shallow grip.","Not adding your bodyweight."],
 "5 reps each side.",["fhl_go_behind"]),
T("fhl_go_behind","Go-behind from front headlock","back","fhl_top","turtle_top","core",
 ["Control their head and one arm.",
  "Step around to the side of the arm you're controlling, chest heavy on their back.",
  "Circle until you're behind them; take a seatbelt or body lock.",
  "Put in hooks, or flatten them out."],
 ["Keep pressure on their head while you circle.","If they try to come up, snap them back down."],
 ["Letting their head come up."],
 "10 reps each side.",["turtle_backtake"]),
T("fhl_escape","Front headlock & guillotine defense","escape","fhl_bot","standing","core",
 ["Hands first: grab the wrist of the arm around your neck and pull it off your throat.",
  "Head up: step your feet under your hips to restore posture.",
  "Against a guillotine, keep fighting the choking hand, chin tucked, and turn your head into their chest; don't pull straight back.",
  "Re-shoot when they lift, or sit to guard if you can't free your head."],
 ["Your hands protect your neck before anything else.","Get your feet under you. On your knees you're stuck."],
 ["Pulling your head straight back, which tightens the choke.","Going limp."],
 "Positional: start in front headlock, escape. 3 × 1 min.",["stance_motion"]),
/* LEGS */
T("ashi_control","Ashi garami / single-leg X control","control","ashi","ashi","core",
 ["Their foot under your armpit, your forearm locked around their ankle.",
  "Inside foot on their hip pushing away; outside leg across their hip and butt.",
  "Squeeze your knees together and pin their knee.",
  "Keep your hips close; their knee stays trapped inside your legs."],
 ["Control the knee line: once their knee gets past your hips, they're out.","Learn your gym's rules for heel hooks and reaping before you play here."],
 ["Letting their hip escape.","Crossing your leg across their knee (reaping) in rule sets that ban it."],
 "Leg lock positional: start in ashi, partner escapes. 3 × 1 min.",["sal","heel_hook"]),
T("sal","Straight ankle lock","sub","ashi","sub","core",
 ["From ashi garami, wrap your forearm under their Achilles, using the bony blade of your wrist.",
  "Grip your hands (or your other hand on their shin), their foot tucked under your armpit.",
  "Push your hips forward and arch your back to finish.",
  "Squeeze your knees to keep the leg."],
 ["The Achilles sits on the bony part of your forearm.","Arch with your whole body, don't just pull with your arms."],
 ["Gripping too low, on the foot."],
 "5 slow reps each side.",["heel_hook"]),
T("heel_hook","Heel hook (know it, defend it)","sub","ashi","sub","plus",
 ["Only drill it when your coach and class allow it.",
  "Mechanics: their heel is trapped in the crook of your arm; turning the heel twists the knee.",
  "Finish slowly. Knee damage can happen before pain. Partners tap as soon as the grip locks."],
 ["If your gym doesn't drill it yet, learn the defense first.","Never spin out of a heel hook that's already locked."],
 ["Cranking fast.","A partner who won't tap."],
 "Defense only until coached: hide the heel, clear the knee line.",["ashi_def"],
 "Rules vary. IBJJF no-gi bans heel hooks below brown belt; ADCC and many submission-only events allow them. Follow your gym's rules."),
T("ashi_def","Leg lock defense","escape","ashi_def","open_top","core",
 ["Hide your heel from their arm: turn it away from the crook of their elbow. Against a straight ankle lock, flex your toes back toward your shin (boot the foot).",
  "Clear the knee line: pull your knee out past their hips.",
  "Push their legs away; post and stand if you can.",
  "Never rotate out of a locked heel hook. In training, tap early."],
 ["The knee line decides leg lock exchanges.","Standing or stepping over breaks the entanglement."],
 ["Rolling out of a heel hook (knee injury).","Panicking."],
 "Leg lock escape game: 3 × 1 min.",["knee_cut"])
];

const TECH_DEF_BLUE=[
/* SUBMISSION DEFENSE */
T("armbar_def","Armbar defense: closed guard and mount","defense","cg_top","cg_top","core",
 ["Prevent it: keep your elbows tight and inside. In their guard, hands on their hips with elbows in. Under mount, never push their chest with straight arms.",
  "Hide the elbow: the moment they isolate an arm, pull that elbow back to your ribs before they can swing a leg over.",
  "If they swing the leg over, clasp your hands together (or grab your own wrist) so they can't pull the arm straight.",
  "Stack them: come up onto your feet or knees and drive your weight forward and down, so their hips lift and their weight goes onto their shoulders. From mount bottom, sit up and turn into them to get there.",
  "Rotate your thumb down toward the mat so your elbow turns out of line with their hips, then pull the elbow out toward your own hip.",
  "Tap when your arm is straight and they lift their hips. Elbows can pop before it really hurts."],
 ["Bent and tight beats strong. Once the arm is straight, strength won't save it.","Your weight is the escape. Stacking takes away the hip lift they need to finish."],
 ["Pulling the arm straight back while they're still flat, which straightens it for them.","Waiting to see if it's really on before tapping."],
 "Partner attacks at 50% from guard and from mount: 5 escapes each side, each position. Then 3 × 1 min positional where they only hunt the armbar.",["cg_posture","elbow_knee"]),
T("triangle_def","Triangle defense","defense","cg_top","cg_top","core",
 ["Prevent it: posture up, hands on their hips, elbows inside their knees. Keep both arms in or both arms out, never one of each.",
  "If one arm slips in and the other is out, fix it at once: pull the trapped arm back or bring the other arm in, before their leg closes over your neck.",
  "Stop the angle: keep your free hand on their hip and stay square to them. They need to turn their hips to finish.",
  "If the leg is over your neck, posture your head up, stand, and stack: drive your weight forward until their knees come toward their face and their hips leave the mat.",
  "From the stack, push the leg that's over your neck back over your head with your free hand, then pull your head and arm out.",
  "Tap if their legs are locked, they have the angle and they're pulling your head down. Blood chokes can put you out with little warning."],
 ["Both in or both out. One arm in and one out is the triangle.","Head up and weight forward. A dropped head lets them close the lock."],
 ["Pulling back from the stack, which gives them room to adjust the angle.","Letting them hold your head down while you fight the legs."],
 "Partner on bottom tries to get one arm in and one out: 3 × 1 min positional. Then 5 stack-and-clear reps each side from a loose triangle.",["cg_posture","knee_cut"]),
T("kimura_def","Kimura and americana defense","defense","sc_bot","sc_bot","core",
 ["Prevent it: keep your elbows tight to your ribs and your hands near your chest. A bent arm away from your body is what both locks need.",
  "When they grab your wrist, connect your arms: clasp your own hands, or grab your own thigh with the attacked hand.",
  "Against the kimura, turn your chest into them so your elbow stays in front of your body and your hand can't be pulled behind your back.",
  "Against the americana, bridge into them and turn onto your side, sliding your elbow back down toward your hip.",
  "In their closed guard, keep the attacked elbow tight, drive your weight into them and keep your hand connected until they let go.",
  "Tap when your hand moves behind your back (kimura) or your elbow lifts off the mat (americana) and the shoulder starts to hurt. Shoulders give little warning."],
 ["Your elbow is the key. Keep it close to your body and the lock can't bend.","Turn toward the lock, not away from it."],
 ["Straightening the arm to escape, which hands them an armbar.","Letting go of your own grip to frame with that hand."],
 "Partner on top attacks the kimura or americana at 50%: 5 escapes each arm. Then 2 × 1 min positional from side control.",["sc_frames","sc_underhook_escape"]),
T("arm_tri_def","Arm triangle defense","defense","mount_bot","mount_bot","core",
 ["Prevent it: keep your elbows tight and never push across their neck with a straight arm. That's how your arm ends up across your face.",
  "If they push an arm across your face, pull the elbow straight back to your ribs before their head drops onto it.",
  "If their head is down, bend the trapped arm and keep that hand near your own face. The bent arm keeps a gap at your neck.",
  "Turn onto your side, into them, so your shoulder isn't flat and pinned under their head.",
  "Stop them getting to the side: frame your free hand on their hip or knee on the side they want to step to, and bridge each time they try to slide off the mount.",
  "Tap once they're off to the side, head on the mat, squeezing. If you feel pressure on both sides of your neck, it's on."],
 ["They need to get off the mount to the side to finish. Stopping that step stops the choke.","Elbow early. Most arm triangles are lost when the arm first crosses the face."],
 ["Lying flat and letting them settle their head.","Pushing their head with the trapped arm, which straightens it into the choke."],
 "Partner in mount sets up the arm triangle at 50%: 5 reps each side of stopping the arm crossing, then 5 of blocking the step off.",["mount_def","elbow_knee","upa"]),
T("rnc_def","Rear-naked choke defense","defense","back_bot","back_bot","core",
 ["Prevent it: chin down and hands up at your collarbones the moment they get the seatbelt. Elbows tight.",
  "Find the choking arm. It's the one over your shoulder. That hand is your first target; ignore the bottom arm.",
  "Two-on-one: grab their choking wrist with both hands and pull it down off your neck to your chest.",
  "Keep your chin tucked and your shoulders up, so their forearm can't slide under your chin.",
  "Holding the hand, slide your shoulders to the mat on the choking-arm side and start your back escape.",
  "Tap when their forearm is across your throat and their second hand locks behind your head. Rear chokes put you out in seconds."],
 ["Order matters: choking hand first, everything else after.","Two hands on one wrist. You win the hand fight with numbers."],
 ["Grabbing the bottom arm while the top arm slides under your chin.","Pulling their forearm with one hand while the other does nothing."],
 "Partner on your back hunts the choke at 50%, no hooks fight: 3 × 1 min. Then 5 full reps of hand fight into back escape.",["back_escape"]),
T("guillotine_def","Guillotine defense: in their guard and standing","defense","cg_top","cg_top","core",
 ["Prevent it: when you shoot, keep your head up and to the side. In their guard, keep posture and don't drop your head in front of their chest.",
  "The moment the arm wraps your neck, chin down and two hands on their choking wrist. Pull it down to make room at your throat.",
  "Don't pull your head straight back. In their guard, drive your weight forward into them so they can't arch away from you.",
  "Walk to the side of the choking arm (where your head is), put your shoulder over theirs and settle in side control. Your head comes free as they flatten.",
  "Standing, keep both hands on the wrist. If they jump or pull guard, go down with them under control and finish the escape from guard.",
  "Tap if the arm is deep under your chin and they arch before your hands get inside."],
 ["Hands first, then move. Moving without the hand fight tightens it.","Go toward the choking arm, not away from it."],
 ["Pulling straight back out of it.","Panicking and lifting them, which gives them space to arch."],
 "Partner locks a loose guillotine from guard: 5 escapes each side. Then 5 standing, where they pull guard with it.",["fhl_escape","sc_control"]),
T("darce_def","D'Arce and anaconda defense","defense","fhl_bot","fhl_bot","key",
 ["Prevent it: keep your elbows tight to your ribs or knees so they can't thread an arm under your armpit and around your neck.",
  "If they thread the arm through, hand fight: grab the threading wrist and stop it reaching their other arm.",
  "Keep the trapped arm bent and that hand near your own face. The bent arm keeps the choke loose.",
  "Square up and keep your weight forward on them. Against the anaconda, post your free hand wide so they can't roll you onto your side.",
  "Once the grip breaks, pull your head out, get your feet under you and stand, or come up into their guard.",
  "Tap when the lock is closed and they squeeze or roll you. Both chokes come on fast."],
 ["The arm under your armpit is the whole setup. Stop it there.","Weight forward and square. Getting turned onto your side finishes it."],
 ["Reaching your arm forward on the mat, which feeds the thread.","Trying to pull your head out before breaking the grip."],
 "Partner in front headlock threads for the D'Arce at 50%: 5 hand fights each side, then 2 × 1 min positional.",["fhl_escape","darce"]),
T("sal_def","Straight ankle lock defense","defense","ashi_def","open_top","core",
 ["Prevent it: when they grab your foot, keep your knee bent and your foot flexed. Don't let them clamp your foot tight in their armpit.",
  "Boot your foot: pull your toes back toward your shin and keep them there. A flexed foot is hard to lever.",
  "Sit up as they fall back and fight the grip: grab the wrist that's under your Achilles and push it down off your foot.",
  "Clear the knee line: push their outside foot off your hip and pull your knee back past their hips.",
  "Pull your foot free, then stand or start passing.",
  "Tap when the forearm is under your Achilles and they arch. If they switch to a heel hook grip, stop moving and tap. Never spin out of a locked heel hook."],
 ["Sit up and fight hands. Lying flat lets them arch at full power.","Knee line first, then the foot comes out."],
 ["Pulling the foot straight back while the grip is tight, which helps their finish.","Pointing your toes, which feeds the lock."],
 "Partner enters ashi and goes for the ankle lock slowly: 5 escapes each leg. Then 3 × 1 min leg lock game, ankle locks only.",["ashi_def","knee_cut"]),
T("ns_choke_def","North-south choke defense","defense","sc_bot","sc_bot","plus",
 ["Prevent it: when they walk to north-south, keep your elbows tight and your hands at your neck. Don't reach around their back.",
  "If their arm slides under your neck, get a hand or forearm inside, between their arm and your throat.",
  "Bridge and walk your feet to turn your body, so you're on your side and out of line with them.",
  "Keep turning until you're at their side, then frame and escape side control.",
  "Tap when their arm is under your neck and they sink their weight with your hands still outside."],
 ["Hands inside before they sink their hips.","Get off your back. Flat and square under them is where the choke works."],
 ["Pushing their head with a straight arm.","Holding still and hoping the squeeze isn't tight."],
 "Partner in north-south hunts the choke at 50%: 3 × 1 min positional.",["sc_frames","ns_escape"]),
/* POSITIONAL ESCAPES */
T("kob_escape","Knee on belly escape","escape","sc_bot","seated","core",
 ["Frame the moment they pop up: both hands on their knee and shin. Don't let them settle their weight.",
  "Turn onto your side toward them. Flat on your back is where knee on belly hurts.",
  "Push their knee down toward your hips while you shrimp your hips away from it.",
  "As their knee slides off your belly, bring your near knee into the space between you.",
  "Recover guard with your frames. If you can't get the knee in, turn to your knees."],
 ["Escape early. Each second they settle, the escape gets harder.","Move your hips, not just your hands. The push makes space; the shrimp uses it."],
 ["Pushing their chest or face with straight arms (armbar).","Pushing the knee without moving your hips."],
 "Partner holds knee on belly: 10 escapes each side, then 2 × 1 min positional.",["guard_retention","sc_frames"]),
T("ns_escape","North-south escape","escape","sc_bot","seated","key",
 ["Protect your neck first: elbows tight, hands near your collarbones. North-south sets up the choke and the kimura.",
  "Frame your forearms or hands on their hips to make space.",
  "Bridge and walk your feet to turn your body sideways under them.",
  "Keep turning until you're at their side. You're now in side control bottom, which you know how to escape.",
  "Shrimp, bring your knee in and recover guard, or turn to your knees when they're light."],
 ["Turn the position first, then escape. Escaping straight from north-south is hard.","Arms tight the whole time."],
 ["Reaching around their back, which feeds the choke.","Bridging straight up without turning."],
 "Partner holds north-south: 10 escapes, then 2 × 1 min positional.",["sc_frames","sc_underhook_escape"]),
T("backtake_def","Stopping the back take from turtle or a scramble","escape","turtle_bot","seated","core",
 ["Prevent it: in turtle, keep your elbows tight to your knees. No space between them means no space for a hook.",
  "Hand fight the seatbelt: when an arm comes over your shoulder, grab that wrist with both hands and stop it locking with their other hand.",
  "Block the first hook: clamp your elbow to your knee on the side they're working. If a foot gets in, push it out with your hand.",
  "Turn in: while you hold their top arm, sit your hips down and turn to face them, and recover guard.",
  "In a scramble, turn toward them, never away. Showing them your back to get up is how backs get taken.",
  "If the seatbelt and both hooks land anyway, switch to back defense: hands on the choking arm first."],
 ["Win the hands and the hooks don't matter yet.","The first hook is the one to stop. One hook is easier to fight than two."],
 ["Posting a hand far out on the mat, which opens your side for a hook.","Turning away from them to stand up."],
 "Partner starts on top of your turtle: 3 × 1 min, they try to take the back, you turn in. Reset on each guard recovery.",["turtle_recover","rnc_def","back_escape"]),
/* TAKEDOWN DEFENSE */
T("single_leg_def","Single-leg defense: whizzer, hip pressure and limp leg","takedown","standing","standing","core",
 ["Prevent it: stance low, hands in front, lead leg not left out to grab.",
  "When they grab the leg, whizzer: overhook their arm on that side deep, hand on their back, and drive your hip down into their shoulder.",
  "Push their head down and away with your free hand so they can't stand up into you.",
  "Limp leg: point your trapped foot at the mat, turn your hips away, and pull the leg out straight.",
  "Once it's free, square back up or snap their head down to front headlock."],
 ["Hips in and heavy. A whizzer without hip pressure is just a hug.","Keep your trapped leg low. Once it's high in their hands, you're hopping."],
 ["Hopping back on one leg with your hips square to them.","A shallow whizzer that leaves their head in your chest."],
 "Partner holds a single: 5 whizzer-and-limp-leg escapes each leg. Then 3 × 1 min single-leg game.",["snapdown","stance_motion"]),
T("double_leg_def","Double-leg defense: downblock and sprawl","takedown","standing","fhl_top","key",
 ["Prevent it: stance low, hands in front, and watch their hips. Their level drops before they shoot.",
  "Downblock: as they shoot, put your hands on their head and shoulders to slow the shot.",
  "Sprawl right away: throw your legs back, drop your hips onto their shoulders and get your chest heavy on their back.",
  "Sprawl before their hands lock behind your knees. Late sprawls get finished.",
  "Circle to the side, keep their head down and settle into front headlock."],
 ["Timing beats strength. Sprawl on the level change, not after the grip.","Hips down. Hips high means they can still drive through."],
 ["Reaching around their back instead of blocking their head.","Sprawling with your legs but leaving your hips up."],
 "Partner shoots at 50%: 3 × 10 sprawls ending in front headlock.",["sprawl","fhl_go_behind","snapdown"]),
/* GUARD RETENTION */
T("knee_cut_def","Knee cut defense: knee shield and underhook","guard","seated","hg_bot","core",
 ["Prevent it: don't lie flat. Stay on your side with your knees up so they can't pin a knee to the mat.",
  "As they cut their knee across your thigh, turn onto your side facing them and get your other knee or shin in front of their hips (knee shield).",
  "Frame on their head or shoulder with your far arm to keep their chest off yours.",
  "Dig your near arm under their armpit for the underhook.",
  "Lock half guard on their cutting leg, then come up on the underhook or recover full guard."],
 ["The underhook is the race. If they get it first, they crossface and pass.","Knee shield in front of their hips, not on their belly."],
 ["Lying flat while they slice across.","Framing with your hands but leaving the underhook to them."],
 "Partner knee cuts at 50%: 10 reps, 5 each side. Then 3 × 1 min pass-and-retain.",["hg_frames","hg_dogfight","hg_recover"]),
T("bodylock_def","Body lock pass defense","guard","seated","seated","key",
 ["Prevent it: keep your feet on their hips and your knees between you. The body lock needs their chest close.",
  "If they close in, frame on their shoulders or collarbones before their hands lock behind your back.",
  "Hip escape away from the side they're stepping to, to make space for a knee.",
  "Slide a knee back inside and re-guard: feet on hips, or butterfly hooks.",
  "If they trap one leg, lock half guard on it and get your knee shield and underhook."],
 ["Early beats strong. Once the lock settles, it's very hard to move.","Frames first, then the hips move."],
 ["Lying flat and hugging them back.","Pushing with straight arms one at a time."],
 "Partner hunts the body lock at 50%: 3 × 1 min. Reset when they settle or you re-guard.",["guard_retention","hg_frames"]),

  "Pinch your knees and lift your hips slowly until they tap."],
 ["Their two-handed defense is the cue. They can't defend the arm and the neck at once.","Hold the elbow tight the whole way. Space lets them pull it out."],
 ["Letting go of the seatbelt before the arm is trapped.","Swinging the leg before you've moved your hips up."],
 "10 reps each side: partner defends the choke with both hands, you switch to the armbar slowly.",["triangle","back_control"]),
T("arm_trap_rnc","Arm-trap rear-naked choke","sub","back_top","sub","key",
 ["From back control, they defend your choking arm with both hands.",
  "With your bottom hand, grab their wrist on that side and pull it down to their hip.",
  "Lift your leg on that side over their forearm and pin it with your calf, foot hooked behind their thigh.",
  "Now they have one hand to defend. Slide your choking arm under their chin and grab your other biceps.",
  "Put your free hand behind their head.",
  "Squeeze your elbows together and expand your chest slowly until they tap."],
 ["Your elbow goes under the chin. If you are on the jaw, stop and adjust.","Pin the arm with your leg, not your hand, so both hands are free for the choke."],
 ["Cranking on the jaw instead of choking the neck.","Trapping the arm high near the shoulder, where they pull it free."],
 "10 slow reps each side, then 2 rounds of 2 minutes from back control.",["rnc","back_armbar"]),
T("back_retention","Back retention: re-seating hooks when they slide out","back","back_top","back_top","core",
 ["Keep the seatbelt tight and your chest glued to their back.",
  "When they slide their hips down and push a hook off, move your hips first: follow them down so your chest stays on their back.",
  "Put the cleared foot on the mat or their hip and push their hips back in line with yours.",
  "Slide the hook back in on the inside of their thigh, toes turned out.",
  "If they keep clearing hooks, lock a body triangle around their waist.",
  "If their shoulders reach the mat on your top-arm side, stop chasing and climb to mount."],
 ["Hips follow first, hooks second. A hook without your hips behind it comes straight back out.","The seatbelt matters more than the hooks. Never give it up to chase a hook."],
 ["Crossing your ankles in front of them, which gets your foot locked.","Reaching for the hook with your foot while your chest drifts off their back."],
 "3 rounds of 2 minutes: partner works the back escape, you keep the seatbelt and re-seat hooks.",["back_control","back_to_mount","arm_trap_rnc"]),
T("crucifix","Crucifix from turtle and the crucifix choke","sub","turtle_top","sub","key",
 ["From top turtle, sprawl on their back at one side, your chest across their upper back.",
  "Step one leg into the gap between their near elbow and knee.",
  "Lock their upper arm between your legs: cross your ankles or hook one foot over the other.",
  "Hold their far arm and roll over your shoulder toward their head, taking them with you. They land on their back on top of you, their near arm still locked in your legs.",
  "Extend your legs to stretch the trapped arm away. They now have one hand to defend.",
  "Slide your arm around their neck, elbow under the chin, grab your other biceps, put your free hand behind their head, and squeeze slowly until they tap."],
 ["Lock the arm with your legs before you roll.","Keep the trapped arm stretched. A bent arm comes back to defend."],
 ["Rolling before the arm is locked, so they turn into you.","Squeezing on the jaw. If the choke isn't under the chin, adjust or attack the far arm instead."],
 "10 entries each side to the crucifix, then 5 slow choke finishes each side.",["back_control","back_armbar"]),
T("anaconda","Anaconda choke from front headlock","sub","fhl_top","sub","key",
 ["From front headlock, snap their head down so it is under your chest.",
  "Shoot your choking arm under their neck from the front and out under their far armpit. Their head and one arm are inside.",
  "Grab your other biceps with your choking hand. Put your other hand on their upper back.",
  "Drive your shoulder into their trapped arm.",
  "Roll under them toward the trapped-arm side, so you end on your side and they end on their side.",
  "Walk your legs toward their hips and squeeze your elbows together slowly until they tap."],
 ["Reach deep. The deeper your arm, the more it chokes and the less it cranks.","The arm must be in. Head only is a neck crank, not this choke."],
 ["A shallow grip that squeezes the face and jaw.","Rolling toward the wrong side, which frees the arm."],
 "10 grips each side from front headlock, then 5 rolls and slow finishes each side.",["darce","fhl_go_behind"]),
T("hw_guillotine","High-wrist guillotine","sub","fhl_top","sub","key",
 ["From front headlock, wrap your choking arm around their neck so the bony blade of your wrist sits high across their throat.",
  "Reach your other arm over their far shoulder and grip your choking hand, palm on top.",
  "Point your choking elbow up and pull their head tight to your chest.",
  "Lift the wrist blade up into their throat, elbows tight to your ribs.",
  "Finish slowly on your knees, standing, or by sitting to guard. Never fall or jump onto them."],
 ["The wrist bone does the choking, not your forearm.","Lift up into the throat. Do not bend their neck back."],
 ["Gripping low on the forearm, which only squeezes the jaw.","Cranking the head instead of choking."],
 "10 slow grips and finishes each side from front headlock.",["guillotine","anaconda","fhl_go_behind"]),
T("ankle_pick","Ankle pick takedown","takedown","standing","open_top","key",
 ["Get a collar tie on their neck.",
  "Snap their head down and to the side so they step forward and put weight on that foot.",
  "Drop your level by bending your knees and step in toward that foot.",
  "Scoop the heel of the weighted foot with your free hand.",
  "Push their head back over that heel with your collar-tie hand. They sit down.",
  "Keep the ankle, step forward, and start passing."],
 ["Pick the foot that carries weight. A light foot just steps away.","The head push and the ankle pick happen at the same time."],
 ["Bending at the waist and reaching with your arm.","Letting go of the head as you reach."],
 "10 reps each side, partner reacting to the snap-down, ending in a pass position.",["knee_cut","toreando","leg_drag"]),
T("high_crotch","High crotch takedown","takedown","standing","open_top","key",
 ["From a hand fight, get their lead leg forward and drop your level.",
  "Take a penetration step to the outside of their lead leg. Your head goes outside their body.",
  "Wrap your inside arm deep around the inside of their thigh, high near the crotch. Your other hand holds behind their knee.",
  "Bring your trailing leg up and stand, your head driving into their side.",
  "Turn the corner: pivot your hips away and drive them down at an angle onto their hip.",
  "Land with your chest on their hip and pass to side control."],
 ["Head outside, ear tight to their side.","Finish at an angle on the mat, never by lifting and dropping."],
 ["Shooting with your head inside, which gives them a guillotine.","Lifting them high to finish. Slams are dangerous and banned."],
 "10 shots each side to the turn-the-corner finish at half speed.",["double_leg","single_leg","knee_cut"]),
T("ghost_escape","Ghost escape from side control","escape","sc_bot","turtle_bot","core",
 ["Frame: forearm across their neck or collarbone, other hand on their near hip.",
  "Bridge into them so they lift their hips and come up on their toes.",
  "Turn onto your side facing them and pull your knees in.",
  "Thread your top leg under your bottom leg and slide your hips out under theirs toward their legs.",
  "Come up on your knees beside their hips, head tight to their side.",
  "Grab a leg for a single or recover guard before they turn to face you."],
 ["This works when their hips are high. If their hips are flat on the mat, frame and re-guard instead.","Keep your head tight to their hip as you come up so they can't spin behind you."],
 ["Turning your back to them with nothing blocking their hips.","Coming up slowly and far away, so they front headlock you."],
 "10 reps each side, partner in side control on their toes, ending on your knees.",["turtle_recover","single_leg"]),
T("kneebar","Kneebar from outside position (ashi)","sub","ashi","sub","plus",
 ["From outside ashi, with their leg between yours, hug their foot at your armpit.",
  "Wrap both arms around their shin, their heel by your shoulder, the leg tight to your chest.",
  "Slide your hips up their leg until your hips are just above their knee.",
  "Cross your feet over their thigh and pinch your knees so the knee can't slide out.",
  "Turn so their kneecap points at your belly, not sideways.",
  "Finish very slowly: pull their ankle toward your shoulder and push your hips forward a little at a time. They tap early."],
 ["Hips above the knee. On the shin there's no lever.","Kneecap at your belly. A knee turned sideways twists instead of straightening."],
 ["Cranking fast. The knee can be hurt before it hurts.","Leaving your hips below their knee and pulling with your arms."],
 "Only with coach approval: 5 slow reps each side, partner taps at the first pressure.",["sal","ashi_def"],
 "IBJJF no-gi allows kneebars and knee reaping (outside ashi counts) only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules.")
];

 dlr_guard:"You hook one of their legs from the outside and hold the ankle while your other foot pushes their hip. Use it when they stand in your open guard and you want a base for sweeps and X-guard.",

 pendulum_sweep:"You trap an arm, lift the opposite leg, and swing your leg to roll them into mount. Use it when they keep good base in your closed guard but leave one arm on your chest.",
 omoplata:"You trap their arm with your legs and turn it behind their back to lock the shoulder. Use it when they pull an arm out of your triangle or post a hand on the mat.",
 kimura_trap_hg:"You catch their arm in a kimura grip and use it to sweep them or take their back. Use it when they post a hand or whizzer while you play half guard bottom.",

 lockdown_sweep:"You lock their trapped leg and stretch it, then grab the ankle and drive them over. Use it when they flatten you in half guard and you need to stop their pressure first.",

 high_crotch:"You shoot to the outside of their lead leg and hug the thigh high. Use it when their lead leg is forward and close.",
 ghost_escape:"You slide your hips under theirs and come up on your knees beside them. Use it when they ride side control high on their toes.",

};
