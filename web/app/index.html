const TECH_BROWN=[
/* LEG LOCK SYSTEM */
T("kguard_saddle","K-guard entry to the saddle (backside entanglement)","entry","seated","ashi","core",
 ["Sit facing them with one leg threaded between their legs, behind their lead leg, your knee flared out. That's the K shape.",
  "Post your other foot on their hip or knee and grab their lead ankle with both hands, tight to your chest.",
  "Lean back and turn to your side, sliding your hips under their lead leg. Lift with the threaded leg to take their weight off it.",
  "Keep turning until the threaded leg crosses under them toward their far hip, and bring your other leg over the top of their lead thigh.",
  "Lock your feet on their far hip side and squeeze your knees. You're in the saddle. If they step back as you turn, settle in backside 50/50 instead."],
 ["Control the ankle before you invert. If the foot slips out, you're just lying under them.","Turn under their leg with your hips, not your head. Your shoulders stay on the mat, your head stays out of the way."],
 ["Inverting from too far away, so their knee never gets between your thighs.","Leaving your top foot loose, which lets them step over and pass."],
 "Entry reps: partner kneels or stands in front. 8 entries each side, holding the saddle 3 seconds each.",["saddle_control","inside_heel_hook","fifty_fifty"],
 "The saddle crosses your leg over their hip, which counts as knee reaping. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("saddle_control","Saddle (inside sankaku) control: breaking the knee line","control","ashi","ashi","core",
 ["Their attacked leg sits between your thighs. Your inside leg runs between their legs, your outside leg crosses over their hip.",
  "Lock your feet on their far hip side and pinch your knees together on their thigh, just above the knee.",
  "Scoot your hips toward their butt until their knee is clearly past your hip line. That's the knee line broken.",
  "Pin their far leg: your bottom foot pushes it away, or your hand blocks it, so they can't step over or kick your locked feet apart.",
  "Hug their attacked leg to your chest and start the hand fight for the heel. Don't grip the heel until the knee is pinned."],
 ["Hips close, knees tight. Space between your hips and their butt is how they slide their knee out.","Their far leg is the escape tool. Manage it first."],
 ["Grabbing the heel while their knee is still free.","Locking your feet so loosely that one kick opens the triangle."],
 "Positional: start in the saddle, partner tries to clear their knee. No submissions. 4 × 1 min, switch roles.",["inside_heel_hook","sal"],
 "The saddle is a knee-reaping position. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("inside_heel_hook","Inside heel hook from the saddle","sub","ashi","sub","core",
 ["Start in the saddle with their knee pinned past your hip line and their far leg controlled.",
  "Hug their foot so their toes go under your armpit on the same side as their leg.",
  "Slide the blade of your forearm under their heel, heel in the crook of your arm, and lock your hands together.",
  "Pinch your knees and keep your hips tight so their knee can't turn.",
  "Learn the finishing direction from your coach in person, never from an app. Finish with a slow, small turn of your chest and shoulders. Stop the moment they tap."],
 ["The heel sits on the bony edge of your wrist, not in your hand.","The finish comes from your torso turning a small amount, never from yanking with your arms."],
 ["Cranking fast or at full range. The knee tears before it hurts.","Holding the heel with a loose grip so the heel slips and you chase it."],
 "Slow reps with a partner who taps early: 5 each side, grip and position only on the first 3.",["saddle_control","outside_heel_hook"],
 "Heel hooks injure knees quickly. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules, and tap the moment the grip locks."),
T("outside_heel_hook","Outside heel hook from outside ashi","sub","ashi","sub","key",
 ["Start in outside ashi: their leg between yours, your outside leg crossing over their hip, your feet locked on their inside thigh.",
  "Squeeze your knees on their knee and keep your hips tight to their butt.",
  "Trap their foot on your outside: toes under your armpit, heel in the crook of your arm.",
  "Lock your hands together with your wrist blade under the heel.",
  "Keep your bottom foot on their far hip so they can't turn or step over.",
  "Learn the finishing direction from your coach in person, never from an app. Finish with a slow, small turn of your chest. Stop the moment they tap."],
 ["Pin the knee before you touch the heel.","When they try to roll with it, keep your knees tight and turn with them. Never crank as they roll."],
 ["Leaving your top leg loose, so they clear the knee line.","Sitting up too high, which opens space at your hips."],
 "Outside ashi positional: 3 × 1 min, partner escapes, you finish only with slow grips.",["inside_heel_hook","fifty_fifty"],
 "Heel hooks injure knees quickly. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("fifty_fifty","50/50: entry, sweep and heel exposure","sweep","seated","ashi","key",
 ["From single-leg X or shin-to-shin, hug their leg and swing your outside leg over their thigh.",
  "Triangle your legs around their leg above the knee: your foot behind your other knee. Their leg and yours now mirror each other.",
  "Hide your own heel straight away: point your toes and keep your foot turned so they can't cup it.",
  "Sweep: pull their trapped leg to your chest and push their other leg away. They sit down.",
  "Come up on your elbow and keep the triangle tight. Their heel is now at your chest.",
  "Trap the toes under your armpit, cup the heel and lock your hands. Finish slowly with a small turn of your chest, or stand up and pass if heel hooks are off."],
 ["In 50/50 they have the same attacks as you. Defend your heel before you attack theirs.","Triangle above the knee. Lock too low and the knee slips out."],
 ["Attacking the heel while your own foot is exposed.","Lying flat on your back, which gives them the first move."],
 "Entry and sweep: 8 reps each side from single-leg X. Then 50/50 heel fighting, slow grips only, 3 × 1 min.",["outside_heel_hook","counter_leglock"],
 "50/50 exposes both players' heels. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("counter_leglock","Counter leg lock: clear the knee line into your own attack","escape","ashi_def","ashi","core",
 ["As they enter on your leg, sit up and fight their hands. Point your toes and turn your foot so the heel hides.",
  "Strip their grip off your heel with both hands before you do anything else.",
  "Clear the knee line: pull your knee out past their hips and turn it so your foot is away from their armpit.",
  "Put your free foot on their hip and scoot your hips toward theirs. Their legs are now loose around you.",
  "Grab the leg closest to your chest, pull it in and pummel your legs around it into your own ashi or 50/50.",
  "Hide your heel again, then attack: straight ankle lock, or a heel hook where allowed, finished slowly."],
 ["Defense first, counter second. Never trade attacks while your heel is caught.","The counter works because their legs open when your knee comes free. Move in that moment."],
 ["Reaching for their foot while your knee is still trapped.","Rolling or spinning to escape a heel hook that's already locked."],
 "Counter round: partner enters ashi on you, you clear and counter. 3 × 2 min, slow pace.",["fifty_fifty","sal","outside_heel_hook"],
 "The counter often ends in a heel hook or a reaping position. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("saddle_escape","Leg lock defense from the saddle: hand fight & escape","escape","ashi_def","open_top","core",
 ["Sit up right away. Lying flat gives them your heel.",
  "Hand fight: both hands peel their grip off your heel. Keep your toes pointed and your foot turned.",
  "Break their triangle: use your free foot to push their locked feet apart, or push the top foot down off your hip.",
  "Pull your knee up and out until it clears their hip line.",
  "Free your foot, post on their top leg and come up to your knees or feet.",
  "Step back out of their legs and start passing. If the grip locks and your heel is caught, tap."],
 ["The sequence is always hands, then triangle, then knee. Skipping a step gets you caught.","Your free leg is your best tool. Use it to open their feet."],
 ["Turning or rolling against a locked heel hook. That's how knees get hurt.","Grabbing their leg to attack while your heel is still in their armpit."],
 "Escape game: start in their saddle without a heel grip. Escape or tap. 4 × 1 min.",["counter_leglock","knee_cut"],
 "Safety: never spin or roll out of a locked heel hook. Damage can happen before pain. In training, tap early."),
/* BACK TAKES */
T("truck_back","Truck entry from turtle to back take","back","turtle_top","back_top","key",
 ["From the side of their turtle, chest on their back, thread your near leg between their legs and hook their near thigh.",
  "Sit back onto your hip behind them and lock your legs around their near leg: your far leg over the top, ankles crossed (a lockdown). That's the truck.",
  "Reach your near arm over their back and grab their far arm or far shoulder.",
  "Pull their upper body back toward you. Their hips are trapped, so they fall back on top of you.",
  "Release the lockdown and slide your top leg in as a hook while you get a seatbelt.",
  "Insert your second hook and settle in back control."],
 ["The lockdown on their leg is what holds them in place. Keep it tight until their back is on you.","Pull them backward over your chest, not sideways off you."],
 ["Letting your legs loosen, so they turn into you and come up on top.","Reaching for the neck before their back is on your chest."],
 "6 entries each side from turtle, finishing with seatbelt and both hooks.",["back_control","rnc"]),
T("berimbolo","Berimbolo from De La Riva to the back","back","seated","back_top","plus",
 ["Play De La Riva: your outside leg hooks around their lead leg from the outside, foot on the inside of their thigh.",
  "Grip their far ankle and their lead leg (behind the knee or ankle), close to your body.",
  "Off-balance them: pull their far ankle and push with your hook until they sit down.",
  "As they sit, invert over your shoulder (not your neck), rolling under them while your hook stays on their leg.",
  "Swing your hips through behind them and grab their far hip to pull yourself in.",
  "Come up on their back: get a seatbelt and put both hooks in."],
 ["The roll happens as they sit. Inverting while they still stand just exposes your back.","Keep the De La Riva hook through the roll. It steers their hips."],
 ["Rolling onto your neck instead of your shoulder.","Letting go of their far hip, so they turn to face you."],
 "Slow entries from De La Riva with a cooperative partner sitting down: 6 each side.",["back_control","rnc"]),
T("kimura_trap_back","Kimura trap from side control to the back","back","sc_top","back_top","key",
 ["From side control, when they turn away to turtle, catch their near wrist with your far hand.",
  "Reach your other arm over their back, under their near arm, and grab your own wrist: a figure-four kimura grip.",
  "Keep their elbow pulled tight to your chest. Their arm is bent behind them, so they can't post or base on it.",
  "Put your near foot in as a hook inside their near thigh.",
  "Sit to your near hip and roll back, using the kimura grip to pull them on top of you.",
  "Swap the kimura grip for a seatbelt and add your second hook."],
 ["The kimura grip is for control here. Keep their elbow tight and the shoulder stays quiet.","Roll them over your body, not away from you."],
 ["Cranking the shoulder instead of using the grip to steer.","Letting their elbow come off your chest, which frees the arm."],
 "6 reps each side from side control: partner turns to turtle, you trap and take the back.",["back_control","kimura_sc","rnc"]),
/* PASSING */
T("backstep_pass","Backstep pass from half guard top","pass","hg_top","sc_top","key",
 ["From half guard top, flatten them with a crossface or pin their far hip.",
  "Turn your hips toward their legs and step your free leg back over, so you sit on your hip facing their feet.",
  "Push their top knee down to the mat. Their legs now cross the wrong way and the lock on your leg loosens.",
  "Pull your trapped foot out, keeping your weight on their hips.",
  "Turn back toward their head, chest to chest, and settle in side control."],
 ["Stay heavy on their hips through the whole turn.","Free the foot only after the backstep. Pulling straight back keeps it trapped."],
 ["Leaving space under your hip, so they come up on a single leg.","Turning so slowly that they recover the knee shield."],
 "10 passes each side, holding side control 3 seconds each.",["sc_control","kimura_trap_back"]),
T("leg_weave","Leg weave pass to mount","pass","open_top","mount_top","key",
 ["Grip both of their knees and push them to one side so their hips turn and their legs stack.",
  "Drive your knee between their legs and pin their bottom thigh to the mat with your shin. That's the weave.",
  "Keep their top leg pinned with your hand or hip so it can't come back in front of you.",
  "Drop your chest onto theirs and get a crossface or underhook.",
  "Swing your back leg over their top leg and land in mount, knees tight to their hips."],
 ["The weave knee pins the bottom leg. If it floats, they re-guard.","Chest heavy before you step to mount."],
 ["Stepping over before your chest is down.","Letting their top knee slide back between you."],
 "10 passes each side, ending with a 3-second mount hold.",["mount_control","mount_chain"]),
/* TOP ATTACK CHAINS */
T("mount_chain","Mount attack chain: arm triangle, armbar, back take","sub","mount_top","sub","core",
 ["From high mount, push one of their arms across their neck and drop your head beside it to set the arm triangle.",
  "If they straighten the other arm to push you away, step up to S-mount on that side and attack the armbar.",
  "If they turn away to escape the armbar, follow the turn, put your hooks in and take a seatbelt.",
  "If they pull the first arm back, keep your weight high and go back to the arm triangle on the other side.",
  "Whichever finish you land, finish slowly: the choke squeezes on, the armbar lifts the hips gently."],
 ["Each defense opens the next attack. Read what they give you instead of forcing one move.","Stay high in mount. Low mount gives them room to bridge."],
 ["Chasing one attack past the point where they've defended it.","Shifting to S-mount without controlling the arm first."],
 "Chain drill: partner defends each attack in turn, you flow arm triangle, armbar, back. 5 slow cycles each side.",["arm_tri","mount_armbar","mount_to_back"]),
T("fhl_chain","Front headlock chain: guillotine, d'arce, anaconda & go-behind","sub","fhl_top","sub","core",
 ["From front headlock, chin strap with one arm and control their near arm with the other. Hips back, weight on their head.",
  "If their head is low and both arms are out, wrap the neck for a guillotine.",
  "If they drive into you with their near arm forward, thread your arm under that arm and around the neck for a d'arce.",
  "If they sit back or turn heavy onto their knees, thread the same arm for the anaconda and roll them over the trapped arm.",
  "If they lift their head or turn into you to defend, spin behind for the go-behind and take the back.",
  "Whichever choke you land, finish slowly and give them time to tap."],
 ["Their reaction picks the attack. Keep your weight on their head while you read it.","Every choke failure is a back take if you keep the headlock."],
 ["Pulling them on top of you with a bad guillotine and losing the position.","Letting your hips sit close to their head, so they shoot your legs."],
 "Chain drill: partner shows one defense at a time, you switch attack. 5 slow cycles, then 3 × 1 min live from front headlock.",["guillotine","darce","fhl_go_behind"]),
/* STANDING */
T("bodylock_trip","Body lock takedown with outside trip","takedown","standing","sc_top","core",
 ["Get to a body lock: both arms under their arms, hands locked low on their back, head tight to their chest.",
  "Pull their hips in tight to yours and step to an angle on one side.",
  "Step your leg behind their near leg, from the outside, your calf against the back of their heel.",
  "Drive your chest into them diagonally back over the trapped leg. They fall backward.",

T("back_handfight","Back attack hand-fight: two-on-one strip to choke or armbar","back","back_top","sub","core",

T("power_half","Power half and spiral ride from turtle","control","turtle_top","back_top","key",
 ["Kneel at their side with your chest heavy on their upper back.",
  "Thread the arm nearer their head under their near armpit and put your hand on the back of their head. This is the half nelson.",
  "Grab their near knee or hip with your other hand.",
  "Drive your chest forward and circle toward their head while you pull the knee or hip toward you. Their near shoulder collapses and they spill onto their belly or side. That circle is the spiral ride.",
  "If they flatten, keep the half nelson, slide your hips onto their back, and put in your hooks or stay flat chest to back.",
  "If they turn toward you to escape, keep driving the half nelson over their head. It rolls them onto their back. Settle chest to chest in side control."],
 ["The half nelson moves their shoulder, not their neck. Your chest does the work. Never crank the head sideways.","Keep your weight on them. Space between your chest and their back lets them sit out or stand."],
 ["Pulling the head sideways with your arm instead of driving with your body.","Lifting your chest to reach for the half nelson, so they sit through."],
 "Partner in turtle at 50 percent. 3 rounds of 2 minutes: half nelson, spiral, finish to the back or side control, reset.",["back_control","rnc_chin","sc_control"]),

T("reverse_triangle","Reverse triangle from top (side control or turtle)","sub","sc_top","sub","key",
 ["From side control, push their near arm across their neck and pin it there with your head and shoulder, as for an arm triangle.",

  "Slide your bottom leg under their head so your shin crosses the back of their neck. Lift their head with your hand if you need room.",

  "From turtle: pin one of their arms to their head from the front headlock, step your knee over the back of their neck, and sit to your hip to roll them onto their back. Lock your legs the same way.",
  "Finish slowly. Grip the trapped wrist, squeeze your knees together, and lift your hips a little. If they hold out, switch to the armbar or kimura on the trapped arm."],

T("mounted_guillotine","Mounted guillotine","sub","mount_top","sub","key",

T("ezekiel_nogi","No-gi Ezekiel choke from mount","sub","mount_top","sub","plus",
 ["From mount, wait until they cover their neck with their hands or push your chest. Drop your chest and put your head on the mat beside theirs.",

T("ns_kimura_armbar","North-south kimura to armbar","sub","sc_top","sub","key",
 ["From north-south with your chest on their chest, pick one arm. Grab that wrist with the hand on the same side.",

T("buggy_choke","Buggy choke from under side control","sub","sc_bot","sub","plus",

T("drag_bodylock_return","Arm drag to body lock to mat return","takedown","standing","back_top","core",

T("imanari_roll","Imanari roll to leg entanglement","entry","standing","ashi","plus",

T("backside_5050_heel","Backside 50/50 heel hook","sub","ashi","sub","key",

T("guard_ret_pressure","Guard retention against heavy pressure: frames and leg pummeling","guard","seated","seated","core",
 ["Get on your hip facing them. Never lie flat. Put one forearm across their collarbone and the other hand on their hip or biceps, elbows tight.",

  "Keep your arms straight and your grip tight. Both legs are now on their back and neck, pinning them down.",
  "Finish slowly. Pull up with your arms while you press down with your legs, a little at a time. Release on the tap."],
 ["The choke comes from your arms pulling up while your legs press down. Keep both legs on their back, not just one.","Sit to the side of the trapped arm. Falling straight back lets them push your leg off their head and escape."],
 ["Sitting down before the gable grip is tight, so their arm slides out.","Pulling with bent arms while your legs stay loose, which only strains the neck."],
 "Partner on knees at 50 percent. 8 reps each side to the seated position with no squeeze, then 4 reps each side finishing slowly.",["japanese_necktie","anaconda","fhl_go_behind"],
 "This choke also loads the neck. IBJJF bans chokes with a spinal lock for competitors under 16; adult divisions allow them. Apply it very slowly, keep the pressure even, and release the moment they tap."),

T("flying_guillotine","Flying guillotine","sub","standing","sub","plus",
 ["From a collar tie or a snap down, wait for their head to drop below yours as they come forward.",
  "Wrap their neck: the blade of your wrist under their chin, your arm over the back of their neck. Grip your hands palm to palm.",
  "Pull their head tight to your chest and keep your choking elbow tight to your side before you leave the ground.",
  "Jump and lock your legs around their waist in a high closed guard, keeping the grip. If they are not balanced for it, sit to guard with the grip instead of jumping.",
  "When you land on your back, keep the guard closed high on their waist and their head trapped against your chest.",
  "Finish slowly. Pull your forearm up into their throat and stretch your hips away from them, a little at a time. Release on the tap."],
 ["The grip must be locked before you jump. Jumping to find the neck lands you in their guard with nothing.","Your guard holds their hips away while your arm pulls up. Both are needed for the finish."],
 ["Jumping when they lean back, so both of you fall badly.","Hanging on the neck with your bodyweight in the air, which cranks it instead of choking."],
 "Partner standing, ready for the jump, on soft mats. 5 sit-to-guard entries each side, then 5 jumping entries each side. Finish slowly only after you land.",["guillotine_cg","hw_guillotine","guillotine"],
 "IBJJF bans jumping to closed guard in white belt divisions, and many gyms ban jumping guard in open training. Only jump on a partner who knows it is coming, on soft mats. Sitting to guard with the grip is the safer version."),

T("von_flue_choke","Von Flue choke: guillotine counter from side control","sub","sc_top","sub","key",
 ["When they hold an arm-out guillotine from guard, put both hands on their choking wrist and pull it down to free your throat.",
  "Pass to side control on the side away from their choking arm, the opposite side from where your head is trapped. Your legs end on one side of their body and your head on the other.",
  "Slide your leading arm under their head. Bring your trailing arm over the wrist and forearm of their choking arm to keep it wrapped around your neck. Clasp your hands palm to palm.",
  "Squeeze your far shoulder up to your ear so they cannot drop the arm and unwrap.",
  "Sprawl your legs back and come up on your toes.",
  "Finish slowly. Drive your weight down through your near shoulder toward their head. Your shoulder closes one side of the neck and their own arm closes the other. Release on the tap."],
 ["Go to the side away from their choking arm. On the same side the guillotine gets tighter.","If they let go of the neck, stop the choke and attack the free arm with a kimura or americana."],
 ["Moving to side control with your weight off them, so they roll you while the guillotine is still on.","Squeezing hard and fast. This choke works quickly and can knock someone out."],
 "Partner locks a loose arm-out guillotine from guard. 5 passes each side to the locked hands, then 3 slow finishes each side.",["sc_control","kimura_sc","americana"],
 "This choke acts fast. Apply it slowly and release the moment they tap."),

T("gogoplata","Gogoplata from closed guard","sub","cg_bot","sub","plus",
 ["From closed guard, break their posture and overhook one arm tight to your chest so their head stays low.",
  "Climb your legs high on their back. On the overhook side, bring your knee up so your leg sits over their shoulder with their arm trapped under it.",
  "Hold your ankle with your free hand and pull your foot past the front of their face, so your shin slides under their chin and your foot ends past their far ear.",
  "Cup the back of their head with both hands, or hold their head with one hand and your toes with the other.",
  "Keep their trapped arm inside your leg so they cannot push your shin away.",
  "Finish slowly. Pull their head down onto your shin and curl your hips up a little at a time. Release on the tap."],
 ["Your shin must be under the chin, not on the jaw or face.","This needs open hips. Warm up your hips and knees first and stop if your own knee hurts."],
 ["Trying it with their arm outside your leg, so they push your shin straight off.","Yanking the head down fast, which hurts the throat before they can tap."],
 "From closed guard with a cooperative partner. 3 rounds of 1 minute: break posture, overhook, place the shin, hold 3 seconds with no squeeze, reset.",["omoplata","triangle","cg_break_posture"],
 "The shin presses the windpipe, which can be hurt with little force. Apply it very slowly and release the moment they tap."),

T("truck_calf_slicer","Calf slicer from the truck","sub","back_top","sub","plus",
 ["Get to the truck: sit behind and to the side of them with your legs locked around their near leg, your leg threaded behind their knee.",
  "Make sure your shin is deep in the back of their trapped knee. Keep the lock on their leg tight.",
  "Reach down and hug their trapped ankle and foot to your chest with both arms.",
  "Keep their upper body turned away from you with your chest and shoulder so they cannot sit up into you.",
  "Finish slowly. Pull their foot toward your chest while you extend your hips and locked legs away, folding their calf around your shin a little at a time. Release on the tap."],
 ["Your shin is the blade. It must sit deep in the knee pit or there is no pressure.","The finish is a slow fold. Calf slicers damage the knee before they hurt much."],
 ["Grabbing the foot before your shin is deep in the knee.","Jerking the foot toward you instead of folding the leg slowly."],
 "From the truck with a partner who knows the move. 6 entries each side to the foot grip with no pressure. Finish only slowly, with a partner you trust.",["banana_split","truck_back","back_control"],
 "IBJJF allows calf slicers only at brown and black belt, in gi and no-gi; ADCC and most submission-only events allow them. Follow your gym's rules. Apply it slowly and release at the tap."),

T("banana_split","Banana split from the truck","sub","back_top","sub","plus",
 ["Get to the truck: sit behind and to the side of them with your legs locked around their near leg.",
  "Lie back onto your side and pull them back toward you so their hips stay trapped by your legs.",
  "Reach under their free far leg and hug the thigh behind the knee with both arms.",
  "Pull their far leg toward your head while you keep the lock on their near leg.",
  "Finish very slowly. Extend your locked legs to push their near leg away while you pull the far leg in, splitting their legs a little at a time. Release on the tap."],
 ["The stretch comes from both directions at once: legs push one way, arms pull the other.","This is a groin and hip attack. Many people have no feeling of danger until it is too late, so go slower than you think."],
 ["Pulling the far leg with your arms only while your locked legs stay bent.","Rolling or jerking into the split. Small, slow movements only."],
 "From the truck with a partner who knows the move. 6 entries each side to the leg grip with no stretch. Finish only very slowly, with a partner you trust.",["truck_calf_slicer","truck_back","back_control"],
 "Leg-splitting submissions strain the groin, hips and lower back. IBJJF currently bans them only in the 4 to 12 kids divisions, but many gyms and events ban them for everyone. Follow your gym's rules, apply it very slowly, and release the moment they tap."),

T("toe_hold","Toe hold from outside ashi","sub","ashi","sub","key",
 ["From outside ashi or a single-leg X, keep their knee bent and pinned with your legs and their foot by your hip.",
  "Grab the top of their foot near the toes with the hand on the side of their little toe.",
  "Thread your other arm under their Achilles and grab your own wrist. This is a figure four on the foot.",
  "Keep their knee bent near 90 degrees and their leg pinned with your legs so it cannot straighten or turn.",
  "Finish slowly. Turn their toes down and in toward their buttocks with your figure four, a few degrees at a time. Release on the tap."],
 ["The grip on the toes must be over the top of the foot, not the ankle.","Pin the leg first. If their knee is free, they turn with the lock and it fails."],
 ["Letting their leg straighten, so the lock slides off.","Twisting fast. The foot and knee can tear before they feel pain."],
 "From outside ashi with a partner. 8 grips each side with no turn, then 4 slow finishes each side.",["sal","ashi_control","kneebar"],
 "IBJJF allows toe holds only at brown and black belt, and turning the foot outward only in brown and black no-gi divisions; ADCC and most submission-only events allow them. Follow your gym's rules. Apply it slowly and release at the tap."),

T("wrist_lock_cg","Wrist lock from closed guard against a posted hand","sub","cg_bot","sub","plus",
 ["In closed guard, wait for them to post a hand flat on your chest or stomach.",
  "Cover the back of that hand with both of your hands and pin it flat to your body. Keep their palm on you.",
  "Hold your guard closed and pull them in with your legs so their elbow stays bent.",
  "Keep their elbow pointing out to the side and their forearm angled toward your face.",
  "Finish very slowly. Curl your chest up toward their forearm, bending their wrist back, a few degrees at a time. Release on the tap."],
 ["The hand must stay flat on your body. If the palm lifts, the lock is gone.","Small movement, big pressure. Wrist locks hurt quickly, so go slowly."],
 ["Grabbing the fingers instead of covering the whole hand.","Sitting up fast and snapping the wrist."],
 "Partner posts a hand from inside your closed guard. 8 reps each side to the pinned hand, then 3 very slow finishes each side.",["kimura_cg","armbar_cg","hip_bump"],
 "IBJJF bans wrist locks for competitors under 18 and for adult white belts. Wrist locks can injure with little warning. Apply it very slowly and release the moment they tap."),

T("electric_chair_sweep","Electric chair sweep from lockdown half guard","sweep","hg_bot","hg_top","key",
 ["From half guard bottom, lock your legs around their trapped leg in a lockdown and extend your legs to stretch it back. Their base breaks.",
  "Get the underhook on the trapped-leg side and slide your head and shoulders under them toward their far leg, as if going to deep half. Keep the lockdown on.",
  "Reach under their far thigh with your free arm and hug it. Pull their far knee onto your shoulder.",
  "Extend your lockdown to push their trapped leg away while you pull their far leg toward you. With both legs split, they cannot post and fall to their back on the far side.",
  "Release the lockdown, come up on your knees, and settle on top in half guard. Start passing."],
 ["Stretch first, then reach for the far leg. Without the stretch they keep their weight on you.","Move to their far leg with your head under them. If you stay flat, you cannot reach it."],
 ["Letting go of the lockdown before they are on their back.","Staying on the split to force a tap instead of coming up on top."],
 "Partner in your half guard at 50 percent. 3 rounds of 2 minutes: lockdown, stretch, far leg, sweep, come up on top, reset.",["hg_pass","smash_pass","banana_split"],
 "Holding the split for a tap is the electric chair submission, a leg-splitting attack. IBJJF currently bans those only in the 4 to 12 kids divisions, but many gyms ban them. Follow your gym's rules and apply any split very slowly."),

T("granby_roll","Granby roll from turtle to guard","escape","turtle_bot","seated","key",
 ["From turtle with them on your back or side, tuck your chin and look under your body toward your far hip.",
  "Post on your feet and drive one shoulder to the mat under you.",
  "Roll across your shoulders, not your neck, pulling your knees toward your chest as you go.",
  "Keep turning until your hips face them and your legs come between you.",
  "Put your feet on their hips or knees and frame with your hands. Recover your guard."],
 ["Roll on your shoulders. Tuck your chin and turn your head away so your neck stays out of it.","Keep your knees tight to your chest through the roll so your legs come back fast."],
 ["Rolling straight over your head.","Stopping halfway on your back with your legs still behind you."],
 "Solo first: 10 Granby rolls each side on the mat. Then partner rides your turtle at 50 percent, 5 rolls each side to guard.",["guard_retention","wrestle_up","shin_to_shin"]),

T("wrestling_switch","Wrestling switch from turtle","escape","turtle_bot","turtle_top","plus",
 ["From turtle with them at your side and an arm around your waist, get your hands and knees under you.",
  "Reach your near arm over the top of their arm that is around your waist, and put your hand deep on the inside of their near thigh.",
  "Sit your hips through away from them, so your arm levers down on their shoulder.",
  "As their shoulder drops, circle your hips behind them and come up on your knees at their back.",
  "Settle with your chest on their back and an arm around their waist. You are now on top of their turtle."],
 ["The lever is your arm over theirs. Sit your hips away to make it work, not your arm strength.","Get your hand deep to the inside of their thigh, or they pull the arm out."],
 ["Reaching for the leg without sitting your hips out.","Sitting through so far that you land on your back."],
 "Partner rides your turtle at 50 percent. 3 rounds of 1 minute: switch, come behind, reset. Change sides each round.",["turtle_backtake","power_half","back_control"]),

T("turtle_standup","Stand-up from turtle","escape","turtle_bot","standing","core",
 ["From turtle with them behind you, lift your head and push your back up into their chest.",
  "Grab the hand around your waist with both hands so they cannot lock their grip.",
  "Post your outside foot flat on the mat, then the other, and stand up with your back pressing into them.",
  "Peel their hands off your waist, turning your hips away from their grip.",
  "Turn to face them with your elbows in and get back to your stance."],
 ["Head up and back pressure first. With your head down, they keep you flat.","Fight their hands the whole time. If they lock their grip around your waist, they can lift and return you."],
 ["Standing up with your back bent forward.","Turning to face them before their hands are off your waist."],
 "Partner rides your turtle at 50 percent. 6 stand-ups to stance, then 3 rounds of 1 minute where you only score by getting to stance.",["stance_motion","single_leg","double_leg"]),

T("russian_tie","Russian tie (two-on-one) to the back or single leg","entry","standing","back_top","key",
 ["From stance, grab one of their wrists with one hand.",
  "Bring your other arm across and clamp their upper arm just above the elbow, with your armpit over the top of their shoulder and your chest on their arm.",
  "Hip in tight beside them and pull the arm down so their weight sinks onto the near leg.",
  "If they pull back, drop your level and switch to a single leg on the near leg.",
  "If they push in or turn toward you, step behind them, release the arm, and lock your hands around their waist from behind."],
 ["Your chest controls the arm, not just your hands. Stay glued to their shoulder.","Keep your hips beside theirs. If you stand square in front, they spin out."],
 ["Holding the arm with straight arms at a distance.","Bending forward so they lift their head and turn into you."],
 "Partner in stance at 50 percent. 3 rounds of 2 minutes: Russian tie, then single leg or go-behind depending on their reaction.",["single_leg","drag_bodylock_return","back_control"]),

T("tripod_sweep","Tripod sweep against a standing passer","sweep","seated","open_top","core",
 ["From open guard with them standing, grab behind both their heels.",
  "Hook the instep of your foot behind one of their heels from the outside.",
  "Put your other foot on their hip on the other side.",
  "Push the hip away with your foot while you pull the hooked heel toward you. They cannot step back with that leg and fall back.",
  "Come up on top as they land: technical stand-up, or follow them down and start passing."],
 ["Pull the heel and push the hip at the same moment.","Keep your hand on the heel until they hit the mat."],
 ["Pushing the hip with a bent leg, so nothing happens.","Lying flat after the sweep instead of coming up."],
 "Partner stands in your open guard at 50 percent. 10 sweeps each side, coming up on top each time.",["knee_cut","toreando","sal"]),

T("lumberjack_sweep","Lumberjack sweep when they stand in your closed guard","sweep","cg_bot","mount_top","key",
 ["When they stand up in your closed guard, keep your guard closed and sit up toward them.",
  "Reach down and cup behind both their heels.",
  "Open your guard and keep your knees in front of their hips.",
  "Drive your hips and chest forward into their thighs while you pull both heels toward you. They fall onto their back.",
  "Follow them down and land on top with your knees on the mat beside their hips, in mount."],
 ["Grab the heels before they break your guard and step back.","Drive forward with your hips, not just your arms."],
 ["Letting them get their posture and step away first.","Releasing the heels too early, so they sit down and keep you in guard."],
 "Partner stands up in your closed guard at 50 percent. 10 sweeps to mount, then 5 where they try to step back as you reach.",["mount_control","mount_armbar","arm_tri"]),

T("firemans_carry","Fireman's carry takedown","takedown","standing","sc_top","plus",
 ["From a collar tie or two-on-one, control their arm just above the elbow.",
  "Pull the arm down and across so their weight goes onto their near leg.",
  "Drop step between their feet onto your knees, with their arm over your shoulder and your head on the outside of their body.",
  "Reach your free arm between their legs and hook the near leg.",
  "Keep pulling the arm, turn your head away, and roll them across your shoulders. They land on their back and side.",
  "Follow them and settle chest to chest in side control."],
 ["Keep hold of their arm all the way down. That is what puts them on their back and not their head.","Get your hips under their hips. If you are too far away, you just pull them down on top of you."],
 ["Lifting them high and dropping them.","Letting go of the arm, so they post and land on top."],
 "On crash pads first. 5 slow reps each side with a partner who knows how to fall, then 5 at normal speed each side.",["sc_control","sc_to_mount","kob_armbar"],
 "Drill on crash pads with a partner who can breakfall. Stay on your knees and roll them across your shoulders. Never lift and drop them; slams are illegal in every IBJJF division."),

T("knee_tap","Knee tap takedown","takedown","standing","open_top","key",
 ["From a collar tie, pull their head down and toward the side of the knee you will tap.",
  "Step your lead foot in close to their lead foot.",
  "Drop your level by bending your knees. Put your free hand on the outside of their near knee.",
  "Keep their knee blocked with your hand while you pull the collar tie down and across their body. They fall toward the blocked knee.",
  "Follow them down, keep your weight on them, and start passing."],
 ["The collar tie moves their head over the blocked knee. Head and knee work together.","Block the knee, don't grab it. The hand is a wall they trip over."],
 ["Reaching for the knee from too far away, with your back bent.","Pulling the head straight down instead of down and across."],
 "Partner in stance at 50 percent. 10 knee taps each side, following them down to a pass.",["knee_cut","toreando","sc_control"]),

T("scissor_sweep","Scissor sweep with collar tie and wrist control","sweep","cg_bot","mount_top","core",
 ["From closed guard, get a collar tie on one side and control their wrist on the other.",
  "Open your guard and hip out to the side of the collar tie.",
  "Put your top shin across their belly with your knee near their ribs. Put your bottom leg flat on the mat against the outside of their knee.",
  "Pull them forward with the collar tie and wrist so their weight comes onto your shin.",
  "Kick your top shin across their body while your bottom leg chops their knee toward you.",
  "Roll with them and come up in mount."],
 ["Their weight must be on your shin before you chop. Pull first, then kick.","Control the wrist on the side they fall to, so they cannot post that hand."],
 ["Chopping with their weight still back.","Letting go of the collar tie as they fall, so they recover guard."],
 "Partner kneels in your closed guard at 50 percent. 10 sweeps each side to mount.",["mount_control","mount_armbar","arm_tri"]),

T("inside_trip","Inside trip (ouchi gari) from the clinch","takedown","standing","open_top","key",
 ["From an over-under clinch or a collar tie and elbow, pull them close so your chest is on theirs.",
  "Step in deep between their feet.",
  "Hook one of their legs from the inside with your leg, the back of your calf against the back of their calf or knee.",
  "Reap that leg out to the side and back while you drive your chest forward into them.",
  "They fall onto their back. Stay chest to chest, land on top, and start passing."],
 ["Chest pressure and the reap happen at the same time.","Hook low on the leg, at the calf or knee, not the thigh."],
 ["Reaching for the leg from a distance, so you stand on one leg in front of them.","Driving forward with your head down, so they sprawl."],
 "Partner in clinch at 50 percent. 10 inside trips each side, landing in a passing position.",["knee_cut","bodylock_pass","hg_pass"]),
];

function nextIvl(c,r){c=c||{ivl:0,ease:2.3};
  if(r===0)return 1;
  if(r===1)return Math.max(1,Math.round((c.ivl||1)*1.2));
  if(r===2)return c.ivl?Math.max(2,Math.round(c.ivl*c.ease)):2;
  return c.ivl?Math.max(4,Math.round(c.ivl*c.ease*1.3)):4}
function rateCard(id,r){
  const c=P().srs[id]||{ivl:0,ease:2.3};const ivl=nextIvl(c,r);
  if(r===0)c.ease=Math.max(1.3,c.ease-.2);else if(r===1)c.ease=Math.max(1.3,c.ease-.15);else if(r===3)c.ease=Math.min(3,c.ease+.15);

}

const byPos=(a,b)=>RANK[beltOf(a)]-RANK[beltOf(b)]||(a.p==="core"?0:1)-(b.p==="core"?0:1)||ORDER.indexOf(a.f)-ORDER.indexOf(b.f);

function chainTree(nodes,mode,depth){
  const flip=w=>w.replace(/\b(they|their|them|you|your)\b/gi,(m,_,i,str)=>{const lw=m.toLowerCase();let r={they:"you",their:"your",them:"you",your:"their"}[lw];
    if(lw==="you"){const before=str.slice(0,i).trim().toLowerCase();r=(!before||/(^|[:,.]|\band|\bso|\bif|\bwhen|\bbefore|\bas)$/.test(before))?"they":"them"}
    return m[0]===m[0].toUpperCase()?r[0].toUpperCase()+r.slice(1):r});
  const lab=(w,d)=>{if(mode==="def")w=w.replace(/^Start:/,"Their start:").replace(/^(Their start:)(.*)$/,(m,a,rest)=>a+flip(rest)),w=/^Their start:/.test(w)?w:flip(w);
    return d===0?(/start:/i.test(w)?w:"When "+w[0].toLowerCase()+w.slice(1)):"If "+w[0].toLowerCase()+w.slice(1)};
  return `<ul class="tree${depth?"":" root"}">${nodes.filter(n=>TM[n.t]).map(n=>{const t=TM[n.t],b=beltOf(t);

    return `<li><div class="tif">${gl(lab(n.w,depth))}</div><button class="tnode" data-a="open" data-v="${t.id}"><span class="tn">${mode==="def"?"They go for ":""}<b>${esc(t.n)}</b></span><span class="tm">${cat(t.c)}${b!=="blue"?`<span class="btag ${b}">${BELT[b].to}</span>`:""}${mode==="att"?stripes(lv(t.id)):""}</span></button>${def}${n.k.length?chainTree(n.k,mode,depth+1):""}</li>`}).join("")}</ul>`;
}

function defaultDays(pw){return ({1:[2],2:[1,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]})[Math.min(7,Math.max(1,Number(pw)||2))]}

let SIDX=null;
function searchIndex(){if(SIDX)return SIDX;const e=[];
  TECH.forEach(t=>e.push({k:"t",id:t.id,label:t.n,sub:`${CATS[t.c]} · from ${POS[t.f].l.toLowerCase()}`,name:norm(t.n),text:norm(`${t.n} ${CATS[t.c]} ${POS[t.f].L} ${POS[t.f].l} ${t.t==="sub"?"submission":POS[t.t]?POS[t.t].L:""}`)}));
  Object.entries(POS).forEach(([k,p])=>e.push({k:"p",id:k,label:p.L,sub:"Position",name:norm(p.L),text:norm(p.L+" "+p.l)}));
  GLOSS.forEach(g=>e.push({k:"g",id:g.k,label:g.k,sub:"Term",name:norm(g.k),text:norm(g.k)}));

  return null}

async function api(method,url,body){
  const h=method==="GET"?{}:{"content-type":"application/json","x-jf":"1"};
  const r=await fetch("/api"+url,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),credentials:"same-origin"});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const err=new Error(j.error||"Something went wrong. Try again.");err.status=r.status;throw err}
  return j;
}

let apTimer=null,apDirty=false;
/* Whose data is on this phone? "rtb.owner" holds the account id once someone signs in here.
   - Data that belongs to a different account is cleared before this account's data loads.
   - Data from before anyone signed in is only carried into an account that's being created now (adopt).
   - Signing out clears the phone; the data stays in the account. */
function wipeLocal(){S.progress=blankProgress();S.sessions=[];try{["rtb.progress","rtb.sessions","rtb.owner"].forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function startSync(opts){
  opts=opts||{};S.mode="api";setSync("Saved to your account","db");
  const owner=lsGet("rtb.owner"),mine=String(API.me.id);
  const foreign=!!owner&&String(owner)!==mine,adopt=!owner&&!!opts.adopt;
  if(foreign||(!owner&&!adopt))wipeLocal();
  try{
    const [p,l]=await Promise.all([api("GET","/progress"),api("GET","/logs")]);
    if(p.data){S.progress=normalize(p.data)}else{if(!adopt)S.progress=blankProgress();await api("PUT","/progress",{data:clone(S.progress)})}
    lsSet("rtb.progress",S.progress);
    const have=new Set(l.logs.map(x=>x.id));const extra=adopt?S.sessions.filter(x=>x&&x.id&&!have.has(x.id)):[];
    for(const s of extra.slice(0,200)){try{await api("PUT","/logs/"+encodeURIComponent(s.id),{data:s})}catch(e){}}
    S.sessions=[...l.logs,...extra];lsSet("rtb.sessions",S.sessions);lsSet("rtb.owner",mine);
    setTimeout(()=>autoLog(true),300);
  }catch(e){setSync("Saved on this device","err");toast("Couldn't reach your account. Changes are kept on this device for now.");if(!foreign)lsSet("rtb.owner",mine)}
}

  const max=Math.max(1,...weeks.map(w=>w.visits)),W=340,H=150,pad=22,bw=Math.floor((W-8)/weeks.length)-2;
  const bars=weeks.map((w,i)=>{const h=Math.round((H-pad-14)*w.visits/max),x=4+i*(bw+2),y=H-pad-h;const lbl=new Date(w.wk+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
    return `<g class="bar" tabindex="0" aria-label="Week of ${esc(lbl)}: ${w.visits} visits by ${w.people} people"><rect class="hit" x="${x-1}" y="0" width="${bw+2}" height="${H-pad}" fill="transparent"/>${h?`<path d="M${x},${H-pad} V${y+4} q0,-4 4,-4 h${bw-8} q4,0 4,4 V${H-pad} Z" fill="var(--chart)"/>`:""}<title>Week of ${esc(lbl)}: ${w.visits} visits by ${w.people} people</title></g>`}).join("");
  const first=new Date(weeks[0].wk+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
  const last=weeks[weeks.length-1];
  return `<figure class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visits per week for the last 12 weeks, from ${weeks[0].visits} to ${last.visits}"><line x1="0" x2="${W}" y1="${H-pad}" y2="${H-pad}" stroke="var(--line)"/>${bars}
    <text x="4" y="${H-6}" class="ax">${esc(first)}</text><text x="${W-4}" y="${H-6}" text-anchor="end" class="ax">This week</text>${weeks.some(w=>w.visits)?`<text x="4" y="11" class="ax">${max} max</text>`:`<text x="${W/2}" y="${(H-pad)/2}" text-anchor="middle" class="ax">No visits recorded yet</text>`}</svg>
    <figcaption class="small muted">Visits per week. Bars count check-ins (or bookings, for classes nobody checked in at). Tap a bar for the number.</figcaption>
    <details class="small"><summary>Show as a table</summary><table class="tbl"><tr><th>Week of</th><th>Visits</th><th>People</th></tr>${weeks.map(w=>`<tr><td>${esc(w.wk)}</td><td>${w.visits}</td><td>${w.people}</td></tr>`).join("")}</table></details></figure>`}
function trend(a,b){if(!b&&!a)return "";if(!b)return `<span class="tr up">new</span>`;const p=Math.round(100*(a-b)/b);return p===0?`<span class="tr">±0%</span>`:`<span class="tr ${p>0?"up":"down"}">${p>0?"▲":"▼"} ${Math.abs(p)}%</span>`}

    ...quiet.slice(0,3).map(s=>card("",`${DOW[s.dow]} ${esc(s.hm)} ${esc(s.title)} is quiet`,`Averages ${s.avg} ${s.avg===1?"person":"people"} over the last ${s.n} weeks. Move it, merge it, or turn it into an open mat or privates.`,"")),
    I.plans&&I.noPlan&&I.plans.length?card("",`${I.noPlan} student${I.noPlan>1?"s have":" has"} no membership plan`,`Put them on a plan in the Roster so fees and weekly limits work.`,`<button class="btn" data-a="coachgo" data-v="roster">Open roster</button>`):"",
  ].filter(Boolean);
  const list=st.filter(s=>!f||s.segment===f).sort((a,b)=>b.d28-a.d28||a.name.localeCompare(b.name));
  const ret=k.retention.base?Math.round(100*k.retention.retained/k.retention.base):null;

  return `<section class="stack-lg">
    <div class="stats four"><div class="stat"><b>${k.active}</b><span>Active members</span></div><div class="stat"><b>${k.perWeek}</b><span>Visits / week ${trend(k.visits28,k.prev28)}</span></div><div class="stat"><b>${k.perMember}</b><span>Per member / week</span></div><div class="stat"><b>${ret===null?"–":ret+"%"}</b><span>Still training after 90 days</span></div></div>
    ${weekChart(I.weeks)}
    <section class="stack"><h2 class="label">Needs your attention</h2>${cards.length?cards.join(""):`<p class="small muted">Nothing urgent. Everyone's training${I.revenue?" and paid up":""}.</p>`}</section>
    <section class="stack"><h2 class="label">Students</h2>
      <div class="segpills">${["","regular","occasional","at_risk","new","inactive"].map(s=>`<button data-a="segf" data-v="${s}" aria-pressed="${f===s}">${s?esc(SEG[s][0]):"All"} <b>${s?I.segments[s]:st.length}</b></button>`).join("")}</div>
      ${f?`<p class="small muted">${esc(SEG[f][1])}.</p>`:""}
      <div class="list">${list.map(s=>`<button class="trow" data-a="student" data-v="${s.id}" style="grid-template-columns:minmax(0,1fr) auto"><span><span class="nm">${esc(s.name)}</span><span class="meta">${beltChip(s.belt,s.stripes)}<span class="segtag ${s.segment}">${esc(SEG[s.segment][0])}</span><span>${s.last?`Last ${s.daysSince===0?"today":s.daysSince===1?"yesterday":s.daysSince+" days ago"}`:"Never trained"}</span>${s.streak>1?`<span>${s.streak}-week streak</span>`:""}${s.planName?`<span>${esc(s.planName)}</span>`:""}</span></span><span class="mono" style="text-align:right"><b>${s.d28}</b><small class="muted"> / 4 wks</small><br>${trend(s.d28,s.p28)}</span></button>`).join("")||`<div class="empty">Nobody here.</div>`}</div></section>
    ${I.slots.length?`<section class="stack"><h2 class="label">Class times (last 8 weeks)</h2><table class="tbl"><tr><th>When</th><th>Class</th><th>Avg</th><th>Full</th></tr>${I.slots.map(s=>`<tr><td class="mono">${DOW[s.dow]} ${esc(s.hm)}</td><td>${esc(s.title)}</td><td class="mono">${s.avg}</td><td class="mono">${s.fill===null?"–":s.fill+"%"}${s.waitlisted?" · waitlist":""}</td></tr>`).join("")}</table></section>`:""}
    ${I.revenue?`<section class="stack"><h2 class="label">Money this month</h2>

const bySess=(a,b)=>(a.date===b.date?String(b.time||"").localeCompare(String(a.time||"")):a.date<b.date?1:-1);
async function autoLog(force){
  if(S.mode!=="api"||!API.me||!API.me.gym||isCoach())return;
  if(!force&&API.autoLogAt&&Date.now()-API.autoLogAt<5*60e3)return;API.autoLogAt=Date.now();
  let cs;try{cs=(await api("GET","/me/attended?days=45")).classes}catch(e){return}
  const have=new Set(S.sessions.map(s=>s.classId).filter(Boolean)),skip=new Set(P().logSkip||[]);
  const add=cs.filter(c=>!have.has(c.id)&&!skip.has(c.id)).slice(0,40);if(!add.length)return;
  let n=0,fresh=0;
  for(const c of add){const taught=(c.ids||[]).filter(id=>TM[id]);
    const s={id:"k"+c.id,classId:c.id,auto:true,date:dayKey(c.startsAt),time:c.startsAt,type:c.kind==="private"?"Private":"Class",title:c.title,coach:c.coach,focus:c.focus,mins:c.durationMin,rolls:0,taught,hits:[],tapped:[],stuck:[],worked:"",fix:""};
    // anything taught that's new to you goes into your reviews
    taught.forEach(id=>{if(lv(id)<1){P().mastery[id]=1;ensureCard(id);fresh++}});
    if(await addSession(s))n++}
  if(fresh)saveProgress();
  if(n){if(["journal","home"].includes(S.ui.tab)&&!S.ui.sheet)render();toast(`Logged ${n} class${n>1?"es":""} from your bookings${fresh?`; ${fresh} new move${fresh>1?"s":""} added to your reviews`:""}.`)}
}

function nextSteps(){const out=[],seen=new Set();
  const st=stuckCounts(21)[0];
  if(st){const p=st[0],t=fromPos(p).filter(t=>["escape","defense","sweep","guard"].includes(t.c)).sort((a,b)=>lv(a.id)-lv(b.id))[0];if(t){seen.add(t.id);out.push({why:`You got stuck in ${POS[p].l.toLowerCase()}${st[1]>1?` ${st[1]} times`:""} lately`,t})}}
  const tc={};recent(21).forEach(s=>(s.tapped||[]).forEach(id=>{if(TM[id])tc[id]=(tc[id]||0)+1}));
  const top=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];if(top){const d=defFor(top[0]);if(d&&!seen.has(d.id)){seen.add(d.id);out.push({why:`${TM[top[0]].n} got you${top[1]>1?` ${top[1]} times`:""}`,t:d})}}
  const taught=[...new Set(S.sessions.slice().sort(bySess).slice(0,6).flatMap(s=>s.taught||[]))].filter(id=>TM[id]&&lv(id)<3&&!seen.has(id));
  if(taught.length)out.push({why:"Taught in your recent classes",ids:taught.slice(0,8)});
  return out.slice(0,3)}

function tagChoices(s,k,q){const sel=new Set(s[k]||[]);q=(q||"").trim().toLowerCase();

    else if((m=l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/))){if(!list){out.push("<ul>");list=true}out.push(`<li>${inl(m[1])}</li>`)}
    else if(!l){if(list){out.push("</ul>");list=false}}

Rules: no-gi only. Plain language, second person, short sentences. Use short "## " headings and "- " bullets, no tables, under ${q?250:450} words. If coaches commonly teach a detail differently, say so briefly. Never give a finishing rotation direction for heel hooks or other knee attacks; tell them to learn the finish from their coach. For submissions, remind them to finish slowly and to tap early.`}
async function askAI(id,q){const t=TM[id];if(!SAMPLE||!t||S.ui.aiBusy)return;
  S.ui.aiBusy=id;AICTL=new AbortController();redrawExplain(id);
  try{const r=await SAMPLE(aiPrompt(t,q),{signal:AICTL.signal,cache:q?false:{gcTime:86400000},onText:({text})=>{const el=document.getElementById("ai-live");if(el)el.innerHTML=md(text)}});
    (EXPLAIN[id]=EXPLAIN[id]||[]).unshift({q:q||"",text:r.text+(r.truncated?"\n\n(The answer was cut short. Ask something narrower.)":""),at:Date.now()});saveExplain(id);}
  catch(e){const c=e&&e.code;if(c!=="cancelled"){toast(aiErr(c));if(/not_granted|sampling_disabled|not_declared|capability_/.test(c||""))SAMPLE=null}
    if(e&&e.text){(EXPLAIN[id]=EXPLAIN[id]||[]).unshift({q:q||"",text:e.text+"\n\n(Stopped before the end.)",at:Date.now()});saveExplain(id)}}
  S.ui.aiBusy=null;AICTL=null;
  if(S.ui.sheet&&S.ui.sheet.k==="tech"&&S.ui.sheet.id===id){if(!SAMPLE){const y=window.scrollY;techSheet(id,true);window.scrollTo(0,y)}else redrawExplain(id)}}
/* swipe right on an open page to go back */
(function(){const sh=document.getElementById("sheet");let sx=0,sy=0,st=0,ok=false;
  sh.addEventListener("touchstart",e=>{const t=e.touches[0];ok=t.clientX>24&&!e.target.closest("input,textarea,select");sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  sh.addEventListener("touchend",e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(dx>90&&Math.abs(dy)<60&&Date.now()-st<700)goBack()},{passive:true});
})();
/* remember which curriculum groups are open */
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.g){S.ui.openG=S.ui.openG||{};if(d.open)S.ui.openG[d.dataset.g]=1;else delete S.ui.openG[d.dataset.g]}},true);

/* ============ SWIPE ROWS: swipe right to edit, left to delete (both reveal a button; nothing happens until it's tapped) ============ */
/* The public page for a technique (matches tools/seo.js: name-based address, id added only when two names clash). */
const techSlug=(()=>{let m=null;const sl=x=>String(x).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return id=>{if(!m){m={};const seen={};TECH.forEach(t=>{let x=sl(t.n.replace(/&/g,"and"))||sl(t.id);if(seen[x])x=x+"-"+sl(t.id);seen[x]=1;m[t.id]=x})}return m[id]}})();
function swipeWrap(html,o){const e=o.edit,d=o.del;
  return `<div class="swipe"${e?' data-edit="1"':""}${d?' data-del="1"':""}>${e?`<button class="sw-btn sw-edit" data-a="${e[0]}" data-v="${esc(e[1])}" tabindex="-1">${e[2]||"Edit"}</button>`:""}${d?`<button class="sw-btn sw-del" data-a="${d[0]}" data-v="${esc(d[1])}" tabindex="-1">${d[2]||"Delete"}</button>`:""}<div class="sw-front">${html}</div></div>`}
function closeSwipes(except){document.querySelectorAll(".swipe.open,.swipe.show-edit,.swipe.show-del").forEach(w=>{if(w===except)return;w.classList.remove("open","show-edit","show-del");const f=w.querySelector(".sw-front");if(f)f.style.transform=""})}
(function(){let el=null,sx=0,sy=0,dx=0,drag=false,base=0;
  document.addEventListener("touchstart",e=>{const f=e.target.closest(".swipe>.sw-front");if(e.target.closest(".sw-btn"))return;closeSwipes(f&&f.parentNode);if(!f)return;
    el=f;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;drag=false;const m=/translateX\((-?\d+)/.exec(f.style.transform||"");base=m?Number(m[1]):0;f.style.transition="none"},{passive:true});
  document.addEventListener("touchmove",e=>{if(!el)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(!drag){if(Math.abs(x)>10&&Math.abs(x)>Math.abs(y)*1.4)drag=true;else{if(Math.abs(y)>10){el.style.transition="";el=null}return}}
    const w=el.parentNode;let t=base+x;if(t>0&&!w.dataset.edit)t=t/6;if(t<0&&!w.dataset.del)t=t/6;t=Math.max(-120,Math.min(120,t));dx=t;
    el.style.transform=`translateX(${t}px)`;w.classList.toggle("show-edit",t>0);w.classList.toggle("show-del",t<0)},{passive:true});
  document.addEventListener("touchend",()=>{if(!el)return;const w=el.parentNode;el.style.transition="";
    if(drag){w.dataset.swiped="1";setTimeout(()=>{delete w.dataset.swiped},350);
      if(dx>56&&w.dataset.edit){el.style.transform="translateX(88px)";w.classList.add("open","show-edit");w.classList.remove("show-del")}
      else if(dx<-56&&w.dataset.del){el.style.transform="translateX(-88px)";w.classList.add("open","show-del");w.classList.remove("show-edit")}
      else{el.style.transform="";w.classList.remove("open","show-edit","show-del")}
      try{localStorage.setItem("jf.swiped","1")}catch(x){}}
    el=null},{passive:true});
})();
function confirmSheet(title,text,yes,label){S.ui.sheet={k:"confirm"};S.ui.stack=[];
  openSheet(`${sheetHead(title)}<div class="stack-lg"><h1>${esc(title)}</h1><p>${text}</p></div>`,false,{act:`<button class="btn grow" data-a="close">Keep it</button><button class="btn danger grow" data-a="${yes[0]}" data-v="${esc(yes[1])}">${esc(label)}</button>`})}

})();
