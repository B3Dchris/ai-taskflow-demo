 ["Their attacked leg sits between your thighs. Your inside leg runs between their legs, your outside leg crosses over their hip.",
  "Lock your feet on their far hip side and pinch your knees together on their thigh, just above the knee.",
  "Scoot your hips toward their butt until their knee is clearly past your hip line. That's the knee line broken.",
  "Pin their far leg: your bottom foot pushes it away, or your hand blocks it, so they can't step over or kick your locked feet apart.",
  "Hug their attacked leg to your chest and start the hand fight for the heel. Don't grip the heel until the knee is pinned."],
 ["Hips close, knees tight. Space between your hips and their butt is how they slide their knee out.","Their far leg is the escape tool. Manage it first."],
 ["Grabbing the heel while their knee is still free.","Locking your feet so loosely that one kick opens the triangle."],
 "Positional: start in the saddle, partner tries to clear their knee. No submissions. 4 × 1 min, switch roles.",["inside_heel_hook","sal"],
 "The saddle is a knee-reaping position. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("inside_heel_hook","Inside heel hook from the saddle","sub","ashi","sub","core",
 ["Start in the saddle with their knee pinned past your hip line and their far leg controlled.",
  "Hug their foot so their toes go under your armpit on the same side as their leg.",
  "Slide the blade of your forearm under their heel, heel in the crook of your arm, and lock your hands together.",
  "Pinch your knees and keep your hips tight so their knee can't turn.",
  "Learn the finishing direction from your coach in person, never from an app. Finish with a slow, small turn of your chest and shoulders. Stop the moment they tap."],
 ["The heel sits on the bony edge of your wrist, not in your hand.","The finish comes from your torso turning a small amount, never from yanking with your arms."],
 ["Cranking fast or at full range. The knee tears before it hurts.","Holding the heel with a loose grip so the heel slips and you chase it."],
 "Slow reps with a partner who taps early: 5 each side, grip and position only on the first 3.",["saddle_control","outside_heel_hook"],
 "Heel hooks injure knees quickly. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules, and tap the moment the grip locks."),
T("outside_heel_hook","Outside heel hook from outside ashi","sub","ashi","sub","key",
 ["Start in outside ashi: their leg between yours, your outside leg crossing over their hip, your feet locked on their inside thigh.",
  "Squeeze your knees on their knee and keep your hips tight to their butt.",
  "Trap their foot on your outside: toes under your armpit, heel in the crook of your arm.",
  "Lock your hands together with your wrist blade under the heel.",
  "Keep your bottom foot on their far hip so they can't turn or step over.",
  "Learn the finishing direction from your coach in person, never from an app. Finish with a slow, small turn of your chest. Stop the moment they tap."],
 ["Pin the knee before you touch the heel.","When they try to roll with it, keep your knees tight and turn with them. Never crank as they roll."],
 ["Leaving your top leg loose, so they clear the knee line.","Sitting up too high, which opens space at your hips."],
 "Outside ashi positional: 3 × 1 min, partner escapes, you finish only with slow grips.",["inside_heel_hook","fifty_fifty"],
 "Heel hooks injure knees quickly. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("fifty_fifty","50/50: entry, sweep and heel exposure","sweep","seated","ashi","key",
 ["From single-leg X or shin-to-shin, hug their leg and swing your outside leg over their thigh.",
  "Triangle your legs around their leg above the knee: your foot behind your other knee. Their leg and yours now mirror each other.",
  "Hide your own heel straight away: point your toes and keep your foot turned so they can't cup it.",
  "Sweep: pull their trapped leg to your chest and push their other leg away. They sit down.",
  "Come up on your elbow and keep the triangle tight. Their heel is now at your chest.",
  "Trap the toes under your armpit, cup the heel and lock your hands. Finish slowly with a small turn of your chest, or stand up and pass if heel hooks are off."],
 ["In 50/50 they have the same attacks as you. Defend your heel before you attack theirs.","Triangle above the knee. Lock too low and the knee slips out."],
 ["Attacking the heel while your own foot is exposed.","Lying flat on your back, which gives them the first move."],
 "Entry and sweep: 8 reps each side from single-leg X. Then 50/50 heel fighting, slow grips only, 3 × 1 min.",["outside_heel_hook","counter_leglock"],
 "50/50 exposes both players' heels. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("counter_leglock","Counter leg lock: clear the knee line into your own attack","escape","ashi_def","ashi","core",
 ["As they enter on your leg, sit up and fight their hands. Point your toes and turn your foot so the heel hides.",
  "Strip their grip off your heel with both hands before you do anything else.",
  "Clear the knee line: pull your knee out past their hips and turn it so your foot is away from their armpit.",
  "Put your free foot on their hip and scoot your hips toward theirs. Their legs are now loose around you.",
  "Grab the leg closest to your chest, pull it in and pummel your legs around it into your own ashi or 50/50.",
  "Hide your heel again, then attack: straight ankle lock, or a heel hook where allowed, finished slowly."],
 ["Defense first, counter second. Never trade attacks while your heel is caught.","The counter works because their legs open when your knee comes free. Move in that moment."],
 ["Reaching for their foot while your knee is still trapped.","Rolling or spinning to escape a heel hook that's already locked."],
 "Counter round: partner enters ashi on you, you clear and counter. 3 × 2 min, slow pace.",["fifty_fifty","sal","outside_heel_hook"],
 "The counter often ends in a heel hook or a reaping position. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules."),
T("saddle_escape","Leg lock defense from the saddle: hand fight & escape","escape","ashi_def","open_top","core",
 ["Sit up right away. Lying flat gives them your heel.",
  "Hand fight: both hands peel their grip off your heel. Keep your toes pointed and your foot turned.",
  "Break their triangle: use your free foot to push their locked feet apart, or push the top foot down off your hip.",
  "Pull your knee up and out until it clears their hip line.",
  "Free your foot, post on their top leg and come up to your knees or feet.",
  "Step back out of their legs and start passing. If the grip locks and your heel is caught, tap."],
 ["The sequence is always hands, then triangle, then knee. Skipping a step gets you caught.","Your free leg is your best tool. Use it to open their feet."],
 ["Turning or rolling against a locked heel hook. That's how knees get hurt.","Grabbing their leg to attack while your heel is still in their armpit."],
 "Escape game: start in their saddle without a heel grip. Escape or tap. 4 × 1 min.",["counter_leglock","knee_cut"],
 "Safety: never spin or roll out of a locked heel hook. Damage can happen before pain. In training, tap early."),
/* BACK TAKES */
T("truck_back","Truck entry from turtle to back take","back","turtle_top","back_top","key",
 ["From the side of their turtle, chest on their back, thread your near leg between their legs and hook their near thigh.",
  "Sit back onto your hip behind them and lock your legs around their near leg: your far leg over the top, ankles crossed (a lockdown). That's the truck.",
  "Reach your near arm over their back and grab their far arm or far shoulder.",
  "Pull their upper body back toward you. Their hips are trapped, so they fall back on top of you.",
  "Release the lockdown and slide your top leg in as a hook while you get a seatbelt.",
  "Insert your second hook and settle in back control."],
 ["The lockdown on their leg is what holds them in place. Keep it tight until their back is on you.","Pull them backward over your chest, not sideways off you."],
 ["Letting your legs loosen, so they turn into you and come up on top.","Reaching for the neck before their back is on your chest."],
 "6 entries each side from turtle, finishing with seatbelt and both hooks.",["back_control","rnc"]),
T("berimbolo","Berimbolo from De La Riva to the back","back","seated","back_top","plus",
 ["Play De La Riva: your outside leg hooks around their lead leg from the outside, foot on the inside of their thigh.",
  "Grip their far ankle and their lead leg (behind the knee or ankle), close to your body.",
  "Off-balance them: pull their far ankle and push with your hook until they sit down.",
  "As they sit, invert over your shoulder (not your neck), rolling under them while your hook stays on their leg.",
  "Swing your hips through behind them and grab their far hip to pull yourself in.",
  "Come up on their back: get a seatbelt and put both hooks in."],
 ["The roll happens as they sit. Inverting while they still stand just exposes your back.","Keep the De La Riva hook through the roll. It steers their hips."],
 ["Rolling onto your neck instead of your shoulder.","Letting go of their far hip, so they turn to face you."],
 "Slow entries from De La Riva with a cooperative partner sitting down: 6 each side.",["back_control","rnc"]),
T("kimura_trap_back","Kimura trap from side control to the back","back","sc_top","back_top","key",
 ["From side control, when they turn away to turtle, catch their near wrist with your far hand.",
  "Reach your other arm over their back, under their near arm, and grab your own wrist: a figure-four kimura grip.",
  "Keep their elbow pulled tight to your chest. Their arm is bent behind them, so they can't post or base on it.",
  "Put your near foot in as a hook inside their near thigh.",
  "Sit to your near hip and roll back, using the kimura grip to pull them on top of you.",
  "Swap the kimura grip for a seatbelt and add your second hook."],
 ["The kimura grip is for control here. Keep their elbow tight and the shoulder stays quiet.","Roll them over your body, not away from you."],
 ["Cranking the shoulder instead of using the grip to steer.","Letting their elbow come off your chest, which frees the arm."],
 "6 reps each side from side control: partner turns to turtle, you trap and take the back.",["back_control","kimura_sc","rnc"]),
/* PASSING */
T("backstep_pass","Backstep pass from half guard top","pass","hg_top","sc_top","key",
 ["From half guard top, flatten them with a crossface or pin their far hip.",
  "Turn your hips toward their legs and step your free leg back over, so you sit on your hip facing their feet.",
  "Push their top knee down to the mat. Their legs now cross the wrong way and the lock on your leg loosens.",
  "Pull your trapped foot out, keeping your weight on their hips.",
  "Turn back toward their head, chest to chest, and settle in side control."],
 ["Stay heavy on their hips through the whole turn.","Free the foot only after the backstep. Pulling straight back keeps it trapped."],
 ["Leaving space under your hip, so they come up on a single leg.","Turning so slowly that they recover the knee shield."],
 "10 passes each side, holding side control 3 seconds each.",["sc_control","kimura_trap_back"]),
T("leg_weave","Leg weave pass to mount","pass","open_top","mount_top","key",
 ["Grip both of their knees and push them to one side so their hips turn and their legs stack.",
  "Drive your knee between their legs and pin their bottom thigh to the mat with your shin. That's the weave.",
  "Keep their top leg pinned with your hand or hip so it can't come back in front of you.",
  "Drop your chest onto theirs and get a crossface or underhook.",
  "Swing your back leg over their top leg and land in mount, knees tight to their hips."],
 ["The weave knee pins the bottom leg. If it floats, they re-guard.","Chest heavy before you step to mount."],
 ["Stepping over before your chest is down.","Letting their top knee slide back between you."],
 "10 passes each side, ending with a 3-second mount hold.",["mount_control","mount_chain"]),
/* TOP ATTACK CHAINS */
T("mount_chain","Mount attack chain: arm triangle, armbar, back take","sub","mount_top","sub","core",
 ["From high mount, push one of their arms across their neck and drop your head beside it to set the arm triangle.",
  "If they straighten the other arm to push you away, step up to S-mount on that side and attack the armbar.",
  "If they turn away to escape the armbar, follow the turn, put your hooks in and take a seatbelt.",
  "If they pull the first arm back, keep your weight high and go back to the arm triangle on the other side.",
  "Whichever finish you land, finish slowly: the choke squeezes on, the armbar lifts the hips gently."],
 ["Each defense opens the next attack. Read what they give you instead of forcing one move.","Stay high in mount. Low mount gives them room to bridge."],
 ["Chasing one attack past the point where they've defended it.","Shifting to S-mount without controlling the arm first."],
 "Chain drill: partner defends each attack in turn, you flow arm triangle, armbar, back. 5 slow cycles each side.",["arm_tri","mount_armbar","mount_to_back"]),
T("fhl_chain","Front headlock chain: guillotine, d'arce, anaconda & go-behind","sub","fhl_top","sub","core",
 ["From front headlock, chin strap with one arm and control their near arm with the other. Hips back, weight on their head.",
  "If their head is low and both arms are out, wrap the neck for a guillotine.",
  "If they drive into you with their near arm forward, thread your arm under that arm and around the neck for a d'arce.",
  "If they sit back or turn heavy onto their knees, thread the same arm for the anaconda and roll them over the trapped arm.",
  "If they lift their head or turn into you to defend, spin behind for the go-behind and take the back.",
  "Whichever choke you land, finish slowly and give them time to tap."],
 ["Their reaction picks the attack. Keep your weight on their head while you read it.","Every choke failure is a back take if you keep the headlock."],
 ["Pulling them on top of you with a bad guillotine and losing the position.","Letting your hips sit close to their head, so they shoot your legs."],
 "Chain drill: partner shows one defense at a time, you switch attack. 5 slow cycles, then 3 × 1 min live from front headlock.",["guillotine","darce","fhl_go_behind"]),
/* STANDING */
T("bodylock_trip","Body lock takedown with outside trip","takedown","standing","sc_top","core",
 ["Get to a body lock: both arms under their arms, hands locked low on their back, head tight to their chest.",
  "Pull their hips in tight to yours and step to an angle on one side.",
  "Step your leg behind their near leg, from the outside, your calf against the back of their heel.",
  "Drive your chest into them diagonally back over the trapped leg. They fall backward.",
  "Fall with them, keep the body lock and land chest to chest. Pass to side control."],
 ["Hips in first. A body lock with space between you won't trip anyone.","Your chest drives them back, your leg only blocks."],
 ["Reaching the leg before their weight is on it.","Lifting and dropping them. Take them down; never slam."],
 "10 takedowns each side onto a crash pad or soft mat, partner breakfalls.",["bodylock_pass","sc_control"]),
T("duck_under","Duck-under to the back","takedown","standing","back_top","key",
 ["From a collar tie, let them push their forearm into you or grab your neck.",
  "Push their elbow up with your same-side hand.",
  "Change levels and duck your head under their armpit as you step your near foot deep, past their hip.",
  "Come up behind them and lock your hands around their waist.",
  "Drop your hips, step behind their heel and bring them down to the mat, landing behind them.",
  "Insert your hooks and settle in back control."],
 ["Lift the elbow and duck in the same moment.","Step deep. A short step leaves you in front of them with your head exposed."],
 ["Ducking without changing levels.","Lifting and dropping them. Bring them down with a mat return, never a slam."],
 "Duck-under reps from a collar tie: 10 each side, finishing behind them standing.",["back_control","turtle_backtake"]),
/* GUARD */
T("shoulder_clamp","Shoulder clamp (overhook guard) to triangle or back","guard","cg_bot","sub","key",
 ["From closed guard, break their posture and wrap one arm in a tight overhook, their arm pinned to your chest.",
  "Open your guard and swing the leg on the overhook side high across their upper back, behind their shoulder. Clamp down.",
  "Reach your free hand to grab your own shin to keep the clamp tight.",
  "If they posture with their free arm, push that wrist out past your hip and swing your free leg over the back of their neck. Lock the triangle with the overhooked arm inside.",
  "If they pull back hard and turn away, follow them: open the clamp, sit up and climb behind on the clamped side, then get a seatbelt.",
  "If you land the triangle, finish slowly: angle out and squeeze until they tap."],
 ["The overhook and the clamp work together. If either is loose, they posture out.","Keep their head below your chest the whole time."],
 ["Clamping with your leg on their head instead of their shoulder.","Letting the overhooked arm escape before the triangle is locked."],
 "Clamp reps: 10 each side to the clamp, then 5 each side to the triangle.",["triangle","back_control"]),
T("peterson_roll","Peterson roll (sit-out) from turtle to leg entanglement","escape","turtle_bot","ashi","plus",
 ["From turtle, with them on your side and their arm around your waist, trap that arm: clamp your arm over their elbow and grab their wrist.",
  "Slide your near leg inside their near thigh as a hook.",
  "Tuck your near shoulder and roll toward them, keeping the arm trapped. Your hook lifts their leg and they go over you.",
  "As they land, keep their near leg between yours and wrap it into ashi garami.",
  "Sit up and control their foot. Attack the straight ankle lock, or move to the saddle where allowed."],
 ["Trap the arm before you roll, or they stay on top.","The hook does the lifting. The roll only works if their leg comes with you."],
 ["Rolling over your neck instead of your shoulder.","Rolling away from them, which gives up your back."],
 "6 rolls each side from referee's position, ending in ashi garami.",["ashi_control","sal","saddle_control"])
];
const OV_BROWN={
kguard_saddle:"You thread one leg between theirs, invert under their lead leg and lock the saddle from underneath. Use it when they stand or kneel in front of your seated guard and give you their lead ankle.",
saddle_control:"The saddle traps one of their legs between yours with your feet locked on their far hip. Use it to pin the knee past your hips before you ever reach for a heel.",
inside_heel_hook:"A heel hook from the saddle, the most common leg lock finish in modern no-gi. Use it only once the knee is pinned, finish slowly, and only where your rules allow it.",
outside_heel_hook:"A heel hook from outside ashi, used when they defend the saddle. Use it when they defend the saddle by turning their knee out, and finish slowly.",
fifty_fifty:"A mirrored leg entanglement where both of you have the same leg trapped. Use it to sweep a standing opponent and to expose their heel, but hide your own heel first.",
counter_leglock:"You defend their leg entry, clear your knee and attack their leg in return. Use it the moment their entanglement loosens as your knee comes free.",
saddle_escape:"The escape sequence when they have you in the saddle: hands, then triangle, then knee. Use it the instant they lock the saddle, and tap if the heel grip is locked.",
truck_back:"You lock one of their legs from behind their turtle and pull them back onto you. Use it when they turtle tight and a direct back take won't open.",
berimbolo:"An inverting back take from De La Riva guard. Use it when they sit down or lean back against your guard.",
kimura_trap_back:"You use a kimura grip as a handle to stop their turn and roll them onto you. Use it when they turn away to turtle from side control.",
backstep_pass:"You turn your hips toward their feet to free your trapped leg from half guard. Use it when their knee shield or leg lock stops a normal half guard pass.",
leg_weave:"You stack their legs to one side, pin the bottom leg with your knee and step over to mount. Use it when they turn their hips sideways to defend your pass.",
mount_chain:"Three mount attacks linked so each defense opens the next. Use it once your mount is stable instead of forcing a single submission.",
fhl_chain:"Guillotine, d'arce, anaconda and go-behind linked off their reactions. Use it every time you land a front headlock from a snap-down or sprawl.",
bodylock_trip:"You lock your hands around their back, pull their hips in and trip them backward over your leg. Use it when you get double underhooks or a body lock standing.",
duck_under:"You lift their elbow and slip under their arm to get behind them. Use it when they push into you from a collar tie or reach for your neck.",
shoulder_clamp:"You overhook one arm and clamp your leg high on their shoulder to keep their posture broken. Use it against an opponent who postures well in your closed guard.",
peterson_roll:"You trap the arm around your waist and roll them over you into a leg entanglement. Use it when you're turtled and they ride on your side."
};

const TECH_BLACK=[
T("back_handfight","Back attack hand-fight: two-on-one strip to choke or armbar","back","back_top","sub","core",
 ["From seatbelt with hooks or a body triangle, reach your choking hand toward their neck so they commit both hands to it.",
  "Grab their wrist on your underhook side with your underhook hand. Bring your choking hand down to the same wrist so your two hands hold one of theirs.",
  "Strip that hand down past their hip and pin it. Step your leg on that side over their forearm to trap it, or hold it to their hip with your underhook hand alone.",
  "Now they defend with one hand. Feed your choking arm under their chin and lock the rear-naked choke.",
  "If they clamp your choking wrist to their chest with the free hand, their elbow comes away from their body. Hug that wrist to your chest, slide your hips out to that side, and swing your other leg over their face for the armbar.",
  "Finish slowly. For the choke, squeeze your elbows together and expand your chest. For the armbar, pinch your knees, keep their thumb up, and lift your hips a little at a time. Release on the tap."],
 ["Two hands beat one. Pick one of their hands, strip it, and keep it pinned before you go for the neck.","Keep your chest on their back the whole time. If your hips slide off while you fight hands, they escape."],
 ["Chasing the choke with one arm while both their hands hold your wrist.","Loosening your hooks or body triangle to chase a hand, so they slide down and out."],
 "Partner defends with hands only, no escapes. 5 rounds of 1 minute: strip, pin, finish slowly, reset.",["rnc_chin","back_control","back_to_mount"]),

T("rnc_chin","Rear-naked choke against a defended chin","sub","back_top","sub","core",
 ["Win the hands first. Strip and pin at least one defending hand so they cannot pull your choking arm down.",
  "Put your head beside theirs on your choking-arm side, ear to ear, chest tight to their back.",
  "Stretch them out. Extend your hooks or squeeze the body triangle and arch a little so their chin lifts off their chest.",
  "Slide the blade of your choking wrist in from the side of their neck, under the ear, not straight at the chin. Work it under the jaw line a little each time they breathe or move.",
  "When your elbow is under their chin, lock the choke: choking hand on your other biceps, other hand behind their head.",
  "Finish slowly. Squeeze your elbows together and expand your chest. If your forearm is still on the jaw, let go and re-enter. Do not squeeze the jaw."],
 ["A forearm across the jaw is not a choke. It does not finish, and cranking it can injure their jaw or neck.","Position comes first. Stay on the back and keep fighting hands, and the chin opens when they tire or reach."],
 ["Squeezing harder over the jaw instead of resetting the arm.","Giving up your hooks or body triangle to chase the chin, so they turn out."],
 "Partner tucks the chin and keeps one hand up. 6 rounds of 1 minute from seatbelt and hooks. Count clean chokes only.",["back_handfight","back_to_mount"]),

T("power_half","Power half and spiral ride from turtle","control","turtle_top","back_top","key",
 ["Kneel at their side with your chest heavy on their upper back.",
  "Thread the arm nearer their head under their near armpit and put your hand on the back of their head. This is the half nelson.",
  "Grab their near knee or hip with your other hand.",
  "Drive your chest forward and circle toward their head while you pull the knee or hip toward you. Their near shoulder collapses and they spill onto their belly or side. That circle is the spiral ride.",
  "If they flatten, keep the half nelson, slide your hips onto their back, and put in your hooks or stay flat chest to back.",
  "If they turn toward you to escape, keep driving the half nelson over their head. It rolls them onto their back. Settle chest to chest in side control."],
 ["The half nelson moves their shoulder, not their neck. Your chest does the work. Never crank the head sideways.","Keep your weight on them. Space between your chest and their back lets them sit out or stand."],
 ["Pulling the head sideways with your arm instead of driving with your body.","Lifting your chest to reach for the half nelson, so they sit through."],
 "Partner in turtle at 50 percent. 3 rounds of 2 minutes: half nelson, spiral, finish to the back or side control, reset.",["back_control","rnc_chin","sc_control"]),

T("reverse_triangle","Reverse triangle from top (side control or turtle)","sub","sc_top","sub","key",
 ["From side control, push their near arm across their neck and pin it there with your head and shoulder, as for an arm triangle.",
  "Keep it pinned and walk toward their head, turning to face their legs. Sit to your hip by their trapped shoulder.",
  "Slide your bottom leg under their head so your shin crosses the back of their neck. Lift their head with your hand if you need room.",
  "Bring your top leg over the trapped arm and lock your knee pit over the ankle of your bottom leg. Their head and near arm are inside, the far arm is out.",
  "From turtle: pin one of their arms to their head from the front headlock, step your knee over the back of their neck, and sit to your hip to roll them onto their back. Lock your legs the same way.",
  "Finish slowly. Grip the trapped wrist, squeeze your knees together, and lift your hips a little. If they hold out, switch to the armbar or kimura on the trapped arm."],
 ["The trapped arm must stay across their neck. If it slips out you only have the head, so let go and reset.","Turn your hips toward their legs so your thigh, not your calf or knee, presses the side of their neck."],
 ["Locking the legs before the arm is pinned, so they pull it out.","Squeezing the head or jaw instead of the neck and arm together."],
 "From side control, 8 entries each side to the locked legs. Then 2 rounds of 2 minutes where your partner tries to free the arm.",["kimura_sc","mount_armbar","sc_control"]),

T("mounted_guillotine","Mounted guillotine","sub","mount_top","sub","key",
 ["From high mount, wait for them to lift their head or push on your chest to escape.",
  "Wrap one arm around their neck so the blade of your wrist is under their chin. Let their pushing arm come inside for arm-in, or knock it out for no-arm.",
  "Grip your choking wrist with your other hand, or go palm to palm if their arm is in.",
  "Drop your chest over their head and stretch your legs back so your hips sit heavy on their chest. Keep one foot wide for base if they bridge.",
  "Finish slowly. Pull the blade of your wrist up into their throat and drive your choking elbow high, squeezing with your chest and hips, not just your arms."],
 ["The blade of the wrist goes under the chin into the throat. If it is on the jaw, it is a crank, so reset.","Stay heavy. If your hips float, they bridge and roll you."],
 ["Falling off mount to guard to finish, giving up the best position for a worse angle.","Squeezing with the arms only and letting the elbow drop."],
 "Partner in bottom mount pushes your chest. 8 entries each side to the locked grip, then 3 slow finishes each side.",["mount_control","arm_tri","guillotine"]),

T("ezekiel_nogi","No-gi Ezekiel choke from mount","sub","mount_top","sub","plus",
 ["From mount, wait until they cover their neck with their hands or push your chest. Drop your chest and put your head on the mat beside theirs.",
  "Slide one arm under their head so your forearm is behind their neck.",
  "With that hand, grip your other arm at the biceps.",
  "Bring that other forearm across the front of their throat, blade edge down, hand reaching past the far side of their neck.",
  "Keep your knees wide and your hips low. Both arms are busy, so your base comes from your legs.",
  "Finish slowly. Drive the blade toward the mat and lift the arm behind their neck, closing your elbows like scissors."],
 ["The blade goes into the front of the neck below the jaw, not across the face.","It works when they block the arm triangle and keep their hands at their chest. You do not need their arm."],
 ["Sitting up tall while you set the grip, so they bridge and roll you.","Pushing the blade into the chin and calling it a choke."],
 "Partner in bottom mount with hands up. 10 reps: set the grip, settle base, slow finish. Then 2 rounds of 1 minute where they bridge as you set it.",["mount_control","mounted_guillotine","arm_tri"]),

T("ns_kimura_armbar","North-south kimura to armbar","sub","sc_top","sub","key",
 ["From north-south with your chest on their chest, pick one arm. Grab that wrist with the hand on the same side.",
  "Reach your other arm under their upper arm and grab your own wrist for the kimura grip. Pull their elbow tight to your chest.",
  "Lift their elbow off the mat and drive their hand behind their back. If it goes, finish the kimura slowly.",
  "If they defend by clasping their hands or holding their own body, keep the kimura grip. Come up to your feet and step your leg over their head, then sit down tight to their trapped shoulder with your other leg across their chest.",
  "Break their grip by leaning back and pulling with the kimura grip while your legs push their body away.",
  "Finish slowly. Pinch your knees, keep their thumb up, and lift your hips a little at a time."],
 ["The kimura grip is a handle. When they hide the arm from the kimura, the armbar opens, and the other way round.","Keep their elbow against your chest while you step over. Space at the elbow lets them pull out."],
 ["Taking your weight off their chest as you step over, so they turn in and come up.","Letting go of the kimura grip to set up the armbar."],
 "Partner defends with a hand clasp. 10 reps each side: kimura grip, step over, break, slow armbar.",["kimura_sc","mount_armbar","ns_choke"]),

T("buggy_choke","Buggy choke from under side control","sub","sc_bot","sub","plus",
 ["Under side control, keep your near elbow tight and wait for them to keep their head low on your near side instead of crossfacing you.",
  "Reach your near arm over the back of their neck so your arm wraps their head and the arm they have by your head.",
  "Bring your other hand up and clasp palm to palm, closing the loop around their neck and that arm, like an arm triangle from underneath.",
  "Curl your legs up and cross them, one ankle over the other shin, so your body folds into a tight ball and your elbows pin together.",
  "Finish slowly. Pull your elbows toward your chest and curl forward. The pressure goes into the sides of their neck, not the back of it. Release on the tap."],
 ["Only take it when their head is on your near side. If they crossface you, recover guard instead.","Keep your elbows tight together. A loose loop turns it into a neck crank, not a choke."],
 ["Yanking the head with your arms instead of curling your whole body.","Staying flat with straight legs, so the loop never tightens."],
 "Partner holds side control with the head on your near side. 8 reps each side to the locked ball, then 3 slow finishes with a partner you trust.",["sc_frames","sc_underhook_escape"],
 "Done fast or at a bad angle, this pulls on the neck. Apply it slowly. Some gyms and events restrict it, so check your rules."),

T("drag_bodylock_return","Arm drag to body lock to mat return","takedown","standing","back_top","core",
 ["Grab their wrist with your same-side hand. Catch their triceps with your other hand and pull the arm across your body as you step your near foot outside theirs.",
  "Circle behind them with your head tight to their back. Lock your hands around their waist with your chest on their back and your hips lower than theirs.",
  "Step one foot behind and between their feet. Pop your hips forward to lift them just off the mat, and turn so their feet swing away from you.",
  "Lower them to the mat on their side or their hands and knees. Follow with your chest on their back. Do not drop them.",
  "If they widen their stance to block the lift, block behind their near knee with your foot and sit them down to the same side.",
  "As they land, put in your first hook or flatten them, and take the seatbelt."],
 ["Hips under their hips. If your hips are behind you, you cannot lift or turn them.","Return them to the mat and follow them down. The lift is only enough to take their feet off the floor."],
 ["Locking the hands high on their chest, so they peel your grip and turn in.","Lifting high and dropping them instead of turning and lowering them."],
 "Partner stands with a light stance. 5 reps each side: drag, lock, mat return, hook in. Then 3 rounds of 1 minute from the body lock with partner fighting the grip.",["back_control","back_handfight","turtle_backtake"],
 "Return them to the mat under control. Lifting and dropping someone is a slam and is illegal in most rule sets."),

T("imanari_roll","Imanari roll to leg entanglement","entry","standing","ashi","plus",
 ["From a collar tie or wrist control, step your near foot outside their lead foot and turn your hips toward their legs.",
  "Drop your near shoulder to the mat outside their lead foot and roll diagonally across your shoulder blades, chin tucked, so your legs swing up toward their hip.",
  "As your legs come over, hook your top leg behind their lead knee and bring your bottom leg across the front of their hip.",
  "Pull their leg to your chest with both arms and squeeze your knees together. They lose balance and fall.",
  "Settle the entanglement: hips close to their hip, knees pinched on their thigh, their foot hugged to your chest. Then work your ankle lock or finish under your rules."],
 ["Roll on the back of your shoulder with your chin tucked. Never roll over your head.","Commit to the roll. Half rolls leave you on your back under them."],
 ["Rolling straight under them instead of diagonally across their lead leg.","Reaching for the heel before both legs are locked on, so they step out."],
 "On crash pads first. 10 solo rolls each side, then 8 rolls each side on a partner who lets you take the leg.",["ashi_control","sal","heel_hook"],
 "This roll usually leads to heel hooks. IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules. Drill on soft mats with a partner who knows to go with the fall."),

T("backside_5050_heel","Backside 50/50 heel hook","sub","ashi","sub","key",
 ["Start in 50/50 with your outside leg over their thigh and your feet locked.",
  "When they turn away to hide their heel, turn with them. Keep your top leg over their hip and your knees pinched above their knee so the knee stays trapped.",
  "Hug their foot to your chest with their toes under your armpit. Slide the blade of your forearm behind their heel.",
  "Clasp your hands or grab your own wrist close to their heel. Keep your elbow tight to your ribs.",
  "Finish slowly. Turn your shoulders a few degrees, not just your arms, and stop the moment they tap."],
 ["Control the knee line first. If their knee slips past your knees, the heel hook does not finish and they escape.","Heel hooks injure the knee before they hurt. Turn slowly and release on the tap."],
 ["Grabbing the heel before the knee is trapped.","Cranking fast when they spin, which is how knees get hurt."],
 "From 50/50, partner turns away at 50 percent. 10 reps each side to the locked grip with no rotation. Finish only slowly, with a partner you trust.",["heel_hook","ashi_control","sal"],
 "IBJJF no-gi allows heel hooks and knee reaping only at brown and black belt; ADCC and most submission-only events allow them. Follow your gym's rules. Apply it slowly and release at the tap."),

T("inside_position_pass","Inside position passing: hands and knees first","pass","open_top","sc_top","core",
 ["Stand or kneel just out of reach with your elbows inside your knees and your hands near their knees.",
  "Win the hands. Break their grips on your wrists by circling your wrist toward their thumb. Put your hands inside, on their knees or the inside of their shins.",
  "Win the knees. Pummel your knee inside their foot or knee. Push their foot off your hip and down to the mat.",
  "Pin before you pass. Press both their knees to one side, or stick one shin to the mat, with your head over their hips.",
  "Pass from the pin with a knee cut, body lock or step around, and settle in side control.",
  "If they get a frame or foot back inside, return to step 2 instead of forcing the pass."],
 ["Whoever has hands and knees inside controls the exchange. Win that before any pass.","Every pass starts from a pin. Moving around legs that are free just gives them time to recover."],
 ["Diving into a pass while their feet are still on your hips.","Reaching with straight arms, so they grab your wrists and steer you."],
 "Positional rounds from open guard. 5 rounds of 2 minutes: you score only by getting both hands and one knee inside, then pinning for 3 seconds.",["knee_cut","bodylock_pass","toreando"]),

T("guard_ret_pressure","Guard retention against heavy pressure: frames and leg pummeling","guard","seated","seated","core",
 ["Get on your hip facing them. Never lie flat. Put one forearm across their collarbone and the other hand on their hip or biceps, elbows tight.",
  "When they drive in, hip escape away from your frames to make space. Your frames hold the distance; your hips move.",
  "Pummel your near knee into the space between you as a shield.",
  "If they pin one leg, circle that foot inside and up to their hip or biceps to free it. Keep both feet active, one after the other.",
  "If they get past your knees, keep the frame on their neck, hip out, and bring your knee back to the middle. If that fails, get the underhook and come up to your knees rather than inverting.",
  "Once both knees are back in front of their hips with your feet connected to them, reset your guard."],
 ["Frames stop the weight. Hip movement makes the space. You need both.","Recover with knees and feet, not by rolling under. Inversion is slow against heavy passers and loads your neck."],
 ["Pushing with straight arms, so they collapse your frames and lie on you.","Waiting until they are fully past your hips to start working."],
 "Partner passes with pressure at 70 percent. 6 rounds of 1 minute. No inverting. Score a point each time you get both knees back in front.",["hg_frames","guard_retention","hg_dogfight"]),

T("seated_counter_wrestle","Counter-wrestling from seated guard: front headlock and guillotine","guard","seated","fhl_top","key",
 ["Sit on one hip with one hand posted behind you and the other hand at their head or wrist. Keep your head higher than theirs.",
  "When they wrestle up or shoot into your legs with their head low, catch the back of their head with your free hand and snap it down as you come up to your knees.",

sprawl:"The defense to a shot on your legs: throw your hips back and land your weight on their head and shoulders. A good sprawl turns their takedown into your front headlock.",
arm_drag:"You pull their arm across your body and step behind them. It works standing or seated and is one of the fastest routes to the back.",

bfly_armdrag:"From butterfly you pull their arm across and slide behind them. It's the go-to back take when they post an arm or reach for you.",
cg_break_posture:"The first job in closed guard: pull them down and control them so they can't stand up or posture. Every closed guard attack starts from broken posture.",
hip_bump:"When they sit up straight in your guard, you sit up into them and roll them over the arm you've wrapped. It chains with the kimura and guillotine.",
kimura_cg:"A shoulder lock using a figure-four grip on their wrist, turning their arm behind their back. Use it when they post a hand on the mat, often while defending a hip bump.",
guillotine_cg:"A front choke around their neck from your guard. Use it when their head drops in front of you, such as when they reach in or after a hip bump.",
triangle:"A choke made with your legs: their neck and one arm are trapped in a figure-four of your legs. You need one of their arms in and the other out.",
armbar_cg:"You isolate one arm and straighten it across your hips while your legs control their head and body. Use it when they push on your chest or leave one arm extended.",
cg_posture:"The top player's answer to closed guard: posture up, protect your arms, then stand or wedge to open their legs. You can't pass a closed guard until it opens.",
knee_cut:"You slide your knee across their thigh to pass to side control. It's the most common pass in no-gi and works against both half guard and open guard.",
bodylock_pass:"You lock your hands around their hips and walk past their legs while staying chest to chest. It's strong against butterfly and seated guard because it stops their hips moving.",
toreando:"A speed pass: control their knees, push their legs to one side, and run around to the other. Use it when they're on their back with their legs up.",

over_under:"A slow pressure pass: one arm under a leg, the other over the other thigh, stacking them onto their shoulders before you walk around. Good against flexible guards.",
hg_frames:"The defensive base of half guard bottom: on your side, knee shield up, fighting for the underhook. Get this right and half guard becomes a safe place to work from.",
hg_dogfight:"From the half guard underhook you come up onto your knee beside them (the dogfight) and turn it into a single leg. It's the main way to attack from half guard bottom.",
hg_recover:"Make space and put your knees back in to get full guard back. It's the safe choice when you can't win the underhook.",
hg_flatten:"On top in half guard, you crossface and drive their shoulders flat so they can't use an underhook. Flatten first, then pass.",
hg_pass:"Once they're flat, you work your trapped knee free and slide through to side control. The key is keeping chest pressure while the leg comes out.",
sc_control:"The pin itself: how to stay heavy and stop them escaping once you're in side control. Holding the position is what lets you attack later.",
sc_to_mount:"Slide your knee across their belly to move from side control to mount. Mount is more dominant and opens up more attacks.",
americana:"A shoulder lock from on top: pin their bent arm beside their head and slide the hand toward their hip. Use it when their far arm is bent and up near their head.",
kimura_sc:"The same figure-four shoulder lock as from guard, but from side control. Use it when their near arm comes off their body to frame or push.",
ns_choke:"From north-south, a choke using your armpit and lat against their neck. It's tight and catches people who frame with their head turned away.",
sc_frames:"The main side control escape: build frames, bridge, shrimp away, and put your knee back in. The goal is getting your guard back, not getting on top.",
sc_underhook_escape:"From under side control you get an underhook and turn onto your knees, then wrestle up. Use it when they sit high on your chest or are moving between pins.",
mount_control:"How to stay in mount when they bridge and push: low base, grapevines, and climbing high. If you can't hold mount, you can't attack from it.",
mount_armbar:"From high mount, isolate one arm, step to S-mount, and sit back into the armbar. It's the classic finish when they push on you.",
arm_tri:"A choke where their own arm and your shoulder close off their neck. Use it when they push you with one arm from under mount or side control.",
mount_to_back:"When they turn onto their side to escape mount, follow them and take the back. Mount and back attacks chain together.",
upa:"Trap one arm and the same-side leg, then bridge and roll them off. It's the first mount escape most people learn and works best when they lean forward.",
elbow_knee:"Shrimp and slide your knee under theirs to recover half guard, then full guard. Use it when they sit upright or post their hands wide to stop the upa.",
back_control:"How to stay on the back: seatbelt grip, hooks or body triangle, head tight to theirs. Most back takes are lost because the attacker rushes the choke.",
rnc:"Your arm wraps their neck from behind and squeezes both sides. It's the most common finish in no-gi.",
back_to_mount:"When they get their shoulders to the mat, swing over to mount instead of chasing the back. It keeps you on top.",
back_escape:"Defend the choke with your hands, then get your shoulders to the mat on the choking-arm side and turn in. Hands first, always.",
turtle_recover:"Getting out of turtle by rolling, sitting out or standing, back to guard or your feet. Turtle is a short-term defense, not a place to stay.",
turtle_backtake:"From on top of a turtled opponent, take a seatbelt, put a hook in, and roll them to take the back.",
guillotine:"A front choke from the front headlock: their head under your armpit, your forearm on their throat. Arm-in (one of their arms trapped inside) is tighter and harder to defend.",
darce:"A choke from front headlock or half guard top: your arm threads under their arm and neck, trapping both. Use it when they shoot or dig for an underhook.",
fhl_go_behind:"From the front headlock, circle around to their back while keeping your weight on their head. If the choke isn't there, take the back.",
fhl_escape:"Protect your neck with your hands, rebuild your posture, and get your feet under you. Then re-shoot or sit to guard.",
ashi_control:"How to hold the leg entanglement so they can't escape: foot trapped, knees pinching, hips close. Without control, leg attacks don't work.",
sal:"Your forearm under their Achilles, arching to bend the foot. It's legal at white belt in most rule sets and a good first leg lock.",
heel_hook:"A knee-twisting attack that's powerful and dangerous. Know how it works so you can defend it, and only train it where your coach allows.",
ashi_def:"How to escape a leg entanglement: hide the heel, pull your knee past their hips, and get out. Tap early in training."

function videoThumb(file){return new Promise(res=>{let done=false;const fin=b=>{if(done)return;done=true;clearTimeout(tm);try{URL.revokeObjectURL(u)}catch(e){}res(b||null)};
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";const u=URL.createObjectURL(file);const tm=setTimeout(()=>fin(null),8000);
  v.addEventListener("loadeddata",()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(e){fin(null)}},{once:true});
  v.addEventListener("seeked",()=>{try{const w=480,h=Math.round(w*(v.videoHeight||270)/(v.videoWidth||480));const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);c.toBlob(b=>fin(b),"image/jpeg",0.8)}catch(e){fin(null)}},{once:true});
  v.addEventListener("error",()=>fin(null),{once:true});v.src=u;});}

 G("Crossface","cross-?fac(?:e|es|ed|ing)","Your shoulder or forearm drives across their jaw and turns their head away from you. Their body follows their head, so they can't turn in to face you or get an underhook."),

function gl(text){const seen=new Set();return esc(text).replace(GLOSS_RE,(...a)=>{const groups=a[a.length-1];let k=null;for(const n in groups)if(groups[n]!==undefined){k=GLOSS[Number(n.slice(1))].k;break}

async function connect(){
  const timer=setTimeout(()=>{if(S.mode!=="db"){setSync("Saved on this device","local");maybeOnboard()}},10000);
  try{
    if(!window.claude||!window.claude.use){clearTimeout(timer);setSync("Saved on this device","local");maybeOnboard();return}
    window.claude.use("assets").then(a=>{if(a){ASSETS=a;render()}}).catch(()=>{});
    window.claude.use("sample").then(sm=>{if(sm){SAMPLE=sm;if(S.ui.sheet&&S.ui.sheet.k==="tech"){const y=window.scrollY;techSheet(S.ui.sheet.id,true);window.scrollTo(0,y)}}}).catch(()=>{});
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){clearTimeout(timer);setSync("Saved on this device","local");maybeOnboard();return}
    const uid=await user.id();
    if(!uid){clearTimeout(timer);setSync("Saved on this device","local");maybeOnboard();return}
    DB=db;
    progRef=db.doc("data/users/"+uid+"/progress");
    sessCol=db.doc("data/users/"+uid+"/profile").collection("sessions");
    explainCol=db.doc("data/users/"+uid+"/profile").collection("explain");
    let firstP=true;
    progRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||pTimer||pWriting)return;
      if(!snap.metadata.fromCache)clearTimeout(timer);
      S.mode="db";setSync("Saved to your account","db");
      if(snap.exists){S.progress=normalize(snap.data());lsSet("rtb.progress",S.progress)}
      else if(firstP&&!snap.metadata.fromCache){flushProgress()}
      firstP=false;render();if(!snap.metadata.fromCache)setTimeout(maybeOnboard,400);
    },err=>{clearTimeout(timer);S.mode="local";setSync("Saved on this device","err");maybeOnboard()});
    let firstS=true;
    sessCol.orderBy("date","desc").limit(500).onSnapshot(snap=>{
      const remote=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(firstS&&!snap.metadata.fromCache){
        firstS=false;
        const local=lsGet("rtb.sessions")||[];
        const have=new Set(remote.map(x=>x.id));
        local.filter(x=>x&&x.id&&!have.has(x.id)).slice(0,100).forEach(x=>sessCol.doc(x.id).set(x).catch(()=>{}));
      }
      S.sessions=remote;lsSet("rtb.sessions",remote);render();
    },err=>{});
  }catch(e){clearTimeout(timer);setSync("Saved on this device","local")}
}

function rateCard(id,r){
  const c=P().srs[id]||{ivl:0,ease:2.3};let ivl;
  if(r===0){ivl=1;c.ease=Math.max(1.3,c.ease-.2)}
  else if(r===1){ivl=Math.max(1,Math.round((c.ivl||1)*1.2));c.ease=Math.max(1.3,c.ease-.15)}
  else if(r===2){ivl=c.ivl?Math.max(2,Math.round(c.ivl*c.ease)):2}
  else{ivl=c.ivl?Math.max(4,Math.round(c.ivl*c.ease*1.3)):4;c.ease=Math.min(3,c.ease+.15)}
  c.ivl=ivl;c.due=addDays(today(),ivl);P().srs[id]=c;saveProgress();
}

function chainTree(nodes,mode,depth){
  const flip=w=>w.replace(/\b(they|their|them|you|your)\b/gi,(m,_,i,str)=>{const lw=m.toLowerCase();let r={they:"you",their:"your",them:"you",your:"their"}[lw];
    if(lw==="you"){const before=str.slice(0,i).trim().toLowerCase();r=(!before||/(^|[:,.]|\band|\bso|\bif|\bwhen|\bbefore|\bas)$/.test(before))?"they":"them"}
    return m[0]===m[0].toUpperCase()?r[0].toUpperCase()+r.slice(1):r});
  const lab=(w,d)=>{if(mode==="def")w=w.replace(/^Start:/,"Their start:").replace(/^(Their start:)(.*)$/,(m,a,rest)=>a+flip(rest)),w=/^Their start:/.test(w)?w:flip(w);
    return d===0?(/start:/i.test(w)?w:"When "+w[0].toLowerCase()+w.slice(1)):"If "+w[0].toLowerCase()+w.slice(1)};
  return `<ul class="tree${depth?"":" root"}">${nodes.filter(n=>TM[n.t]).map(n=>{const t=TM[n.t],b=beltOf(t);
    let def="";if(mode==="def"){const d=defTech(t);def=d?`<div class="tdef"><span>Your defense:</span> <button class="linkbtn" data-a="open" data-v="${d.id}">${esc(d.n)}</button></div>`:CT[t.id]?`<div class="tdef"><span>Your defense:</span> ${gl(CT[t.id])}</div>`:""}
    return `<li><div class="tif">${gl(lab(n.w,depth))}</div><button class="tnode" data-a="open" data-v="${t.id}"><span class="tn">${mode==="def"?"They go for ":""}<b>${esc(t.n)}</b></span><span class="tm">${cat(t.c)}${b!=="blue"?`<span class="btag ${b}">${BELT[b].to}</span>`:""}${mode==="att"?stripes(lv(t.id)):""}</span></button>${def}${n.k.length?chainTree(n.k,mode,depth+1):""}</li>`}).join("")}</ul>`;

function flowSVG(sel){
  const W=400,NW=92,NH=34,G=8,top=24,RH=64;const pos={};
  ROWS.forEach((r,ri)=>{const tw=r.length*NW+(r.length-1)*G;const x0=(W-tw)/2;r.forEach((p,i)=>{pos[p]={x:x0+i*(NW+G),y:top+ri*RH}})});
  const outs=fromPos(sel,flowMax());const dests=[...new Set(outs.map(t=>t.t).filter(t=>t!=="sub"&&t!==sel))];
  const subs=outs.filter(t=>t.t==="sub").length;
  let edges="";const s=pos[sel];
  dests.forEach(d=>{const a={x:s.x+NW/2,y:s.y+NH/2},b={x:pos[d].x+NW/2,y:pos[d].y+NH/2};
    const up=b.y<a.y,dy=Math.abs(b.y-a.y);
    const sy=dy?(up?s.y:s.y+NH):a.y,ey=dy?(up?pos[d].y+NH:pos[d].y):b.y;
    const sx=dy?a.x:(b.x>a.x?s.x+NW:s.x),ex=dy?b.x:(b.x>a.x?pos[d].x:pos[d].x+NW);
    const cx=(sx+ex)/2+(dy?0:0),cy=dy?(sy+ey)/2:sy-26;
    edges+=`<path class="edge" d="M${sx},${sy} Q${dy?(sx+ex)/2+((ex-sx)>0?-18:18):cx},${cy} ${ex},${ey}" marker-end="url(#ah)"/>`});
  let labels=TIERS.map((t,i)=>`<text class="tier" x="4" y="${top+i*RH-6}">${t}</text>`).join("");
  let nodes="";Object.entries(pos).forEach(([p,c])=>{const cls=["node","t"+POS[p].r];if(p===sel)cls.push("sel");else if(dests.includes(p))cls.push("dest");
    nodes+=`<g class="${cls.join(" ")}" data-a="pos" data-v="${p}" role="button" tabindex="0" aria-label="${esc(POS[p].L)}"><rect x="${c.x}" y="${c.y}" width="${NW}" height="${NH}" rx="6"/><text x="${c.x+NW/2}" y="${c.y+NH/2+4}" text-anchor="middle">${esc(POS[p].l)}</text>${p===sel&&subs?`<circle class="badge" cx="${c.x+NW-2}" cy="${c.y+2}" r="8"/><text class="badgetx" x="${c.x+NW-2}" y="${c.y+5}" text-anchor="middle">${subs}</text>`:""}</g>`});
  return `<svg class="flowsvg" viewBox="0 0 ${W} ${top+5*RH+NH+8}" role="group" aria-label="Position map"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>${labels}${edges}${nodes}</svg>`;
}

  bar=bar||{};const backL=bar.back||((S.ui.stack||[]).length>1?"‹ Back":"Close");
  sb.innerHTML=`<div class="wrap">${bar.top||""}<div class="main"><button class="btn back" data-a="back">${backL}</button>${bar.act||'<span class="grow"></span>'}</div></div>`;sb.hidden=false;document.documentElement.classList.add("sheet-open");
  if(!keepScroll){window.scrollTo(0,0);try{sh.scrollIntoView({block:"start"})}catch(e){}}}
function hideTerm(){const c=document.getElementById("termcard");if(c&&!c.hidden){c.hidden=true;c.innerHTML="";if(TERMCTL)TERMCTL.abort()}}
function hideSheet(){hideTerm();const sh=document.getElementById("sheet");sh.hidden=true;sh.innerHTML="";const sb=document.getElementById("sheetbar");sb.hidden=true;sb.innerHTML="";document.querySelector("nav.tabs").hidden=false;document.documentElement.classList.remove("sheet-open");document.getElementById("app").hidden=false;S.ui.sheet=null;S.ui.stack=[]}
function goBack(){if(S.ui.sheet&&S.ui.sheet.k==="onboard"){P().settings.onboarded=true;saveProgress();closeSheet();return}
const st=S.ui.stack||[];if(S.ui.sheet&&S.ui.sheet.k==="tech"&&st.length>1){st.pop();techSheet(st[st.length-1],true)}else closeSheet()}
function closeSheet(){hideSheet();render();const y=S.ui.backY||0;window.scrollTo(0,y);if(!y){try{document.getElementById("app").scrollIntoView({block:"start"})}catch(e){}}}
const sheetHead=(t)=>`<div class="sheettitle small muted">${t}</div>`;

function techSheet(id,fromBack){

  S.ui.sheet={k:"tech",id};const l=lv(id),c=P().srs[id];
  openSheet(`${sheetHead(`${CATS[t.c]} · <span class="pri" data-p="${t.p}">${PRI[t.p]}</span>`)}
  <div class="stack-lg">
   <div class="stack"><h1>${esc(t.n)}</h1>
    ${beltOf(t)!=="blue"?`<div><span class="btag ${beltOf(t)}">${BELT[beltOf(t)].from} → ${BELT[beltOf(t)].to}</span></div>`:""}
    <p class="lead">${gl(OV[t.id]||"")}</p>
    ${(P().videos||{})[t.id]||S.ui.vidUp===t.id?videoBlock(t):vidOf(t.id)?(inClaude()?posVisual(t.f)+ytPlayer(t.id,t.n):ytPlayer(t.id,t.n)):posVisual(t.f)}

    ${t.w?`<div class="warnbox">${esc(t.w)}</div>`:""}
    ${UNC.has(t.id)?`<div class="coachbox${coachOK(t.id)?" ok":""}"><b>${coachOK(t.id)?"Coach checked ✓":"Check with your coach"}</b><span class="small">${coachOK(t.id)?"You've gone through this one with your coach.":"Some details of this move vary between coaches or haven't been verified. Go through it with your coach before you drill it hard."}</span><button class="btn" data-a="coachok" data-v="${t.id}">${coachOK(t.id)?"Undo":"My coach checked this"}</button></div>`:""}
   </div>
   <section class="stack"><h2 class="label">Your level</h2>
    <div class="levels">${LEVELS.map((L,i)=>`<button data-a="level" data-id="${id}" data-v="${i}" aria-pressed="${l===i}">${stripes(i)}<span>${L.n}</span></button>`).join("")}</div>
    ${c?`<p class="small muted">Next review ${esc(fmtDate(c.due))}</p>`:""}</section>
   <section class="stack"><h2 class="label">Starting position: ${esc(POS[t.f].L)}</h2><p>${gl((PD[t.f]||{}).d||POS[t.f].g)}</p><button class="linkbtn small" data-a="pos" data-v="${t.f}">See all moves from here ›</button></section>
   <section class="stack"><h2 class="label">Steps</h2><ol class="steps">${t.s.map(x=>`<li><span>${gl(x)}</span></li>`).join("")}</ol></section>
   <section class="stack"><h2 class="label">Key details</h2><ul class="plain">${t.d.map(x=>`<li>${gl(x)}</li>`).join("")}</ul></section>
   <section class="stack"><h2 class="label">Common mistakes</h2><ul class="plain">${t.m.map(x=>`<li>${gl(x)}</li>`).join("")}</ul></section>
   <section class="stack"><h2 class="label">Drill</h2><p>${gl(t.dr)}</p></section>
   ${SAMPLE?`<section class="stack"><h2 class="label">Go deeper</h2><div id="explain-box">${explainBox(t)}</div></section>`:""}
   ${t.nx.length?`<section class="stack"><h2 class="label">Chains into</h2><div class="list">${t.nx.filter(n=>TM[n]).map(n=>tRow(TM[n])).join("")}</div></section>`:""}

   ${(P().videos||{})[t.id]||S.ui.vidUp===t.id||!ASSETS?"":`<section class="stack"><h2 class="label">Video</h2>${videoBlock(t)}</section>`}
  </div>`,false,{act:!ASSETS?"":(P().videos||{})[t.id]?`<button class="btn grow" data-a="playvid">▶ Play video</button>`:`<label class="btn grow" for="vid-${t.id}" style="cursor:pointer">Add a video</label>`});
}

  </div>`,false,r.shown?{top:`<div class="small muted">How well did you know it?</div><div class="ratebar"><button class="btn" data-a="rate" data-v="0">Again<small>1 day</small></button><button class="btn" data-a="rate" data-v="1">Hard<small>soon</small></button><button class="btn" data-a="rate" data-v="2">Good<small>later</small></button><button class="btn" data-a="rate" data-v="3">Easy<small>much later</small></button></div>`}:{act:`<button class="btn primary grow" data-a="reveal">Show steps</button>`});

  <div class="revealcard">${techMedia(t,"sm")}<div class="fromto"><span class="posbtn">${esc(POS[t.f].L)}</span><span>→</span><span class="posbtn">${t.t==="sub"?"Tap":esc(POS[t.t].L)}</span></div><h1>${esc(t.n)}</h1><p class="lead">${gl(OV[t.id]||"")}</p>

function newForm(){return {date:today(),type:"Class",mins:P().settings.sessionMins||90,taught:[],rolls:5,hits:[],tapped:[],stuck:[],worked:"",fix:"",feel:3}}
function techOptions(filter){return ORDER.map(p=>{const ts=TECH.filter(t=>t.f===p&&(!filter||filter(t)));return ts.length?`<optgroup label="${esc(POS[p].L)}">${ts.map(t=>`<option value="${t.id}">${esc(t.n)}</option>`).join("")}</optgroup>`:""}).join("")}

  openSheet(`${sheetHead(f.editId?"Edit session":"Log a session")}<form id="logform" class="stack-lg" novalidate>

  <div class="stack"><label class="f" for="f-tapped">What you got tapped with</label><select id="f-tapped" data-pick="tapped"><option value="">Add…</option>${techOptions(t=>t.t==="sub")}</select>${picked("tapped")}</div>
  <div class="stack"><span class="f" style="font-size:14px;font-weight:600;color:var(--ink-2)">Where you got stuck</span><div class="chips">${ORDER.map(p=>`<button type="button" class="chip" data-a="stuck" data-v="${p}" aria-pressed="${f.stuck.includes(p)}">${esc(POS[p].l)}</button>`).join("")}</div></div>

function settingsSheet(){render()}

  const st=P().settings,b=blockIndex();const hand=st.hand||"left";

  <section class="stack"><h2 class="label">Training days</h2><div class="seg7">${DN.map((n,i)=>`<button data-a="day" data-v="${i}" aria-pressed="${(P().settings.days||defaultDays(P().settings.perWeek)).includes(i)}">${n}</button>`).join("")}</div><p class="small muted">Your weekly plan on the Today screen follows these days.</p></section>
